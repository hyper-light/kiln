[package]
name = "hyper-log"
description = "The shared Raft log: one log per device, shared by every group on it, so that one flush commits every group's writes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crc32c.workspace = true
getrandom.workspace = true
hyper-block = { path = "../hyper-block" }
# Sealing at rest: a sealed log's records, session keys and framing MACs (hyper-raft docs/seal.md §5).
hyper-seal = { path = "../hyper-seal" }
# The histograms the log's statistics keep (`LogStats`, docs/durable.md §13.1).
hyper-timing = { path = "../hyper-timing" }
thiserror.workspace = true

[dev-dependencies]
hyper-block = { path = "../hyper-block", features = ["sim"] }
hyper-measure = { path = "../hyper-measure" }
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "allocs"
harness = false

[[bench]]
name = "log"
harness = false

[[bench]]
name = "sealing"
# docs/seal.md §11: group commit sealed against unsealed, open loop; a table, not a criterion run.
harness = false

[lints]
workspace = true
