[package]
name = "hyper-seal"
description = "Sealing at rest for mantle, focal and slates: a hierarchy of random keys wrapped with AES-256-KW, files sealed by STREAM, the shared log sealed record by record under a key per writer session, keys to another machine by ML-KEM-1024, names keyed per tenant"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
getrandom.workspace = true
# The device a sealed file is written and read through (`sealed_file`), only with the `files`
# feature: hyper-block opens and writes files, and a consumer that confines file writes to one crate
# (slates' land) takes hyper-seal's keys, log sealing and STREAM primitives without it.
hyper-block = { path = "../hyper-block", optional = true }
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# mlock(2) and madvise(2) for the key region, and the page size.
rustix = { workspace = true, features = ["mm", "param"] }

[target.'cfg(windows)'.dependencies]
# VirtualLock for the key region; GetSecurityInfo and the ACL walk for a key file's owner-only check.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory"] }

[dev-dependencies]
hyper-block = { path = "../hyper-block", features = ["sim"] }
hyper-measure = { path = "../hyper-measure" }
tempfile.workspace = true

[[bench]]
name = "seal"
harness = false

[features]
# A whole file sealed through a `hyper_block::block::BlockFile` (`sealed_file`).
files = ["dep:hyper-block"]

[lints]
workspace = true

[[bench]]
name = "files"
harness = false
required-features = ["files"]
