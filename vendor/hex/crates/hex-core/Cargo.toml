[package]
name = "hex-core"
description = "Hex's sans-IO cores: bounds as cgroup writes, usage from cgroup files, box records, crash recovery, the node agent's wire format and the rule a macOS box is bounded by"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hex-api.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
triomphe.workspace = true

[features]
# `Seeds::seeded`, and hex-api's `Patience::seeded` with it, for tests alone: only hex-testkit's dependency turns it
# on, and hex-testkit is a dev-dependency everywhere, so no production build has it (decision 9: no production wait is
# seeded from a record; tests/test_seeds_dev_only.rs holds every manifest to it).
test-seeds = ["hex-api/test-seeds"]

[dev-dependencies]
# hex-core's own tests seed their waits (`Patience::seeded`), a dev-dependency's feature alone.
hex-api = { workspace = true, features = ["test-seeds"] }
proptest = "1.12.0"

# The doc-truth tests of `darwin`'s signal table against each kernel's own numbers.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
