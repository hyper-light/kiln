[package]
name = "hex-runtime"
description = "Hex's runtime classes: process boxes (cgroup v2 on Linux) and OCI containers (Hex's own runtime)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hex-api.workspace = true
hex-client.workspace = true
hex-core.workspace = true
hex-gpu.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shards-api.workspace = true
# The most a boot's request carries (shards_abi::run::MAX_PAYLOAD), which bounds the destinations a box's grants name
# (src/grants.rs; the review's D-9); and, in the tests, a vCPU's typed unread cause (shards_abi::guest_time::Unread),
# which the image class's usage test reads as its run host says it (src/guest/image_tests.rs). shards-api names neither
# without re-exporting it.
shards-abi.workspace = true
socket2.workspace = true
thiserror.workspace = true
triomphe.workspace = true
# Condition variables whose timed waits end at their deadlines on macOS too (docs/design/deadline-waits.md).
hex-wait.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
rustix.workspace = true
seccompiler.workspace = true

# The macOS `process` class: posix_spawn, proc_pid_rusage, kqueue, the Mach time-constraint watcher
# (crates/hex-runtime/src/macos). rustix wraps kqueue, kill and waitid; libc binds the rest.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
rustix.workspace = true

# The Windows `process` class: job objects and suspended, job-listed process creation
# (crates/hex-runtime/src/windows). windows-sys binds the OS calls; windows binds the in-process WMI
# COM query for the installer features (windows/wmi.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
windows.workspace = true

[features]
# Read-only held-child phase witness for Node native tests; no execution authority.
native-gate-test = []
# Measurement-only shared typed startup builder; native entry remains separately reviewed.
native-trusted-entry-measurement = []

[dev-dependencies]
# The image class's tests wait on their own facts' patiences (src/guest/image_tests.rs).
hex-testkit.workspace = true
proptest = "1.12.0"
tempfile.workspace = true
# src/guest/image_tests.rs: a node VM's run's real agent-control endpoint (D251, D252) on loopback, its run host the
# test's, which the guest under shards-init is reached through.
shards-remote.workspace = true

# tests/first_readable_alloc.rs: a counting global allocator, by which the create, claim and park poll is held to
# allocating nothing (the review's C-7).
[target.'cfg(target_os = "linux")'.dev-dependencies]
cap = { version = "0.1.2", features = ["stats"] }

# src/guest/image_tests.rs on Windows: a lane's ends as Shards' run host makes them there, a plain pipe pair
# (shards_ipc::Stream), the relay holding its VM's end.
[target.'cfg(windows)'.dev-dependencies]
shards-ipc.workspace = true

[lints]
workspace = true
