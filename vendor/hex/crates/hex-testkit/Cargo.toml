[package]
name = "hex-testkit"
description = "What Hex's tests share: the skip record, which says every skipped test where libtest's capture can't hide it, and the records their waits take"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hex-core = { workspace = true, features = ["test-seeds"] }

# A thread as a party (waits::follow::Thread): macOS reads another thread through proc_pidinfo. A delegated cgroup's
# preparation (cgroup::delegated): Linux's ESRCH, a process that ended before it was moved.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
