[package]
name = "hex-testkit"
description = "What Hex's tests share: the skip record, which says every skipped test where libtest's capture can't hide it, and the records their waits take"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hex-core = { workspace = true, features = ["test-seeds"] }
# The rest between an until's looks, to a deadline on every OS (hex_wait::rest_until; docs/design/deadline-waits.md).
hex-wait.workspace = true

# A delegated cgroup's preparation (cgroup::delegated): Linux's ESRCH, a process that ended before it was moved.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
