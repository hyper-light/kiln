[package]
name = "hex-quic"
description = "Hex's wire over hyper-transport on hyper-quic: a node's connections to its peers by kiln's CA, TLS13_AES_256_GCM_SHA384 alone, each a port's byte stream on lanes (docs/design/hex-quic.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hex-api.workspace = true
# The node agent's client, which runs over a link of QUIC connections (src/link.rs).
hex-client.workspace = true
hex-core.workspace = true
hyper-quic.workspace = true
hyper-transport.workspace = true
# A peer's enrollment kept in its folder, as PEM (src/enroll/store.rs).
pem.workspace = true
rcgen.workspace = true
# The driver's wait on its socket and wake: poll(2), Winsock's WSAPoll (src/driver.rs); a client's descriptor bound.
rustix.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Condition variables whose timed waits end at their deadlines on macOS too (docs/design/deadline-waits.md).
hex-wait.workspace = true
webpki.workspace = true

[dev-dependencies]
# The tests' waits on their own facts' records (src/tests.rs).
hex-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
