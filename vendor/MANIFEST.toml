# Every project kiln vendors: where it comes from, the revision kiln takes, and what in its folder
# is kiln's own (docs/vendoring.md). scripts/vendor.py reads it:
#
#   scripts/vendor.py <project> <revision>    take a project at a revision, kiln's recorded changes
#                                             re-applied, the pins checked, the gate run
#   scripts/vendor.py check                   every vendored folder is its upstream at its revision
#                                             plus its recorded changes, byte for byte
#   scripts/vendor.py record <project> <title> --why <why>
#                                             record an edit made in a vendored folder
#
# A project's recorded changes are vendor/patches/<project>/*.patch, applied in name order, each a
# row of its UPSTREAM.md. kiln holds one copy of each project: a product that vendors another takes
# it at the revision kiln takes, and `[patch]` in Cargo.toml points every dependency on it here.
format = 1

# kiln's gate, run from the repository's root after a re-vendor: the critical path's (its master plan
# §3): tests, clippy, the macOS and Windows cross-checks, tsc and eslint, and the UI's build. The
# cross-checks are clippy through zig, as ci/release/build.sh builds those platforms: they need zig
# and cargo-zigbuild where the gate runs, and the two targets added to rustup. The UI's packages
# install without their scripts: no native build (node-pty's needs a C++ compiler), and none of
# their code runs to install them.
gate = [
  "cargo clippy --locked --all-targets -- -D warnings",
  "cargo test --locked --no-fail-fast",
  "cargo-zigbuild clippy --locked --all-targets --target aarch64-apple-darwin -- -D warnings",
  "cargo-zigbuild clippy --locked --all-targets --target x86_64-pc-windows-gnu -- -D warnings",
  "npm ci --ignore-scripts --prefix ui --no-audit --no-fund",
  "npm run --prefix ui typecheck",
  "npm run --prefix ui lint",
  "KILN_UI_SERVER=off npm run --prefix ui build",
]

# The conversation store's engine (docs/conversations.md): four of Turso's crates, Rust only.
[projects.turso]
kind = "git"
repository = "https://github.com/tursodatabase/turso"
commit = "3e09a82750d8290ef96e3830896e7205b7c0b9e6"
path = "vendor/turso"
# What kiln takes of upstream's tree, at upstream's paths.
take = ["Cargo.toml", "LICENSE.md", "NOTICE.md", "core", "extensions/core", "macros", "sqlite/parser"]
own = ["UPSTREAM.md"]

# The Bun kiln carries to run its UI server (vendor/bun/README.md). Its revision is a release.
[projects.bun]
kind = "bun"
version = "1.4.3"
path = "vendor/bun"
own = ["README.md", "NOTICE"]
# The musl runtime Bun's musl build needs comes from Oven's Alpine image, pinned by its index.
image = "docker.io/oven/bun"
image_tag = "{version}-alpine"
image_digest = "sha256:629e17411f1f129dbec3af78d5af9c9f2a937435c80349437206c6b0b7422373"
# Packing the UI server downloads this machine's Bun and checks it against bun.json (after kiln's
# gate, whose tests must not run against a binary with the UI server packed in).
gate = ["npm run --prefix ui build"]

# Each license file and its source. {musl} and {gcc} are the versions the image's packages hold.
[projects.bun.licenses]
"licenses/bun-LICENSE.md" = "https://raw.githubusercontent.com/oven-sh/bun/bun-v{version}/LICENSE.md"
"licenses/musl-COPYRIGHT" = "https://git.musl-libc.org/cgit/musl/plain/COPYRIGHT?h=v{musl}"
"licenses/GPL-3.0" = "https://raw.githubusercontent.com/spdx/license-list-data/v3.29.0/text/GPL-3.0-only.txt"
"licenses/GCC-RUNTIME-LIBRARY-EXCEPTION" = "https://raw.githubusercontent.com/gcc-mirror/gcc/releases/gcc-{gcc}/COPYING.RUNTIME"

# musl/<arch>/<file>, each from its path in the image's platform.
[projects.bun.musl.x86_64]
platform = "linux/amd64"
files = { "ld-musl-x86_64.so.1" = "/lib/ld-musl-x86_64.so.1", "libstdc++.so.6" = "/usr/lib/libstdc++.so.6", "libgcc_s.so.1" = "/usr/lib/libgcc_s.so.1" }

[projects.bun.musl.aarch64]
platform = "linux/arm64"
files = { "ld-musl-aarch64.so.1" = "/lib/ld-musl-aarch64.so.1", "libstdc++.so.6" = "/usr/lib/libstdc++.so.6", "libgcc_s.so.1" = "/usr/lib/libgcc_s.so.1" }

# Quiver, the topic store (docs/bus.md): kiln's bus, behind kiln-seams' `Bus`. Its own vendored
# projects (Focal's bus, hyper-raft) are kiln's below, so kiln's copy of it leaves them out, and
# its benchmarks' records, which are Quiver's evidence and no part of what kiln builds. Its record
# of what it vendors (its vendor/MANIFEST.toml and vendor/patches) is kept, so kiln's pins are
# checked against Quiver's as kiln's copy holds them (vendor/quiver/UPSTREAM.md).
[projects.quiver]
kind = "git"
repository = "https://github.com/hyper-light/quiver"
commit = "966ea139a18d590afd64cc3e30ba3807302d42b1"
path = "vendor/quiver"
exclude = ["vendor/focal-bus", "vendor/hyper-raft", "bench/records"]
own = ["UPSTREAM.md"]

# Focal's event bus, which Quiver is built on, at the commit Quiver takes (Quiver's
# docs/design/focal-bus.md); its recorded change is Quiver's.
[projects.focal-bus]
kind = "git"
repository = "https://github.com/hyper-light/focal"
commit = "9aded7cdf0a596f35039acb9b4e610c52f9d1f0a"
path = "vendor/focal-bus"
take = [
  "Cargo.toml",
  "LICENSE",
  "crates/focal-bus",
  "crates/focal-memory",
  "crates/focal-platform",
  "crates/focal-seal",
  "crates/focal-timing",
]
own = ["UPSTREAM.md"]

# hyper-raft's shared crates at one revision for Focal's bus, Quiver, Mantle and kiln's own transport,
# runtime and replicated stores (sync, CD): the merge of hyper-raft's main and Mantle's line
# (CP-T10.2); its recorded change is Quiver's.
[projects.hyper-raft]
kind = "git"
repository = "https://github.com/hyper-light/hyper-raft"
commit = "fb74b59533908472ade7e526eb08117601cede0e"
path = "vendor/hyper-raft"
take = [
  "Cargo.toml",
  "LICENSE",
  "crates/hyper-block",
  "crates/hyper-datagram",
  "crates/hyper-durable",
  "crates/hyper-liveness",
  "crates/hyper-log",
  "crates/hyper-measure",
  "crates/hyper-quic",
  "crates/hyper-raft",
  "crates/hyper-rt",
  "crates/hyper-rt-transport",
  "crates/hyper-seal",
  "crates/hyper-sim",
  "crates/hyper-swim",
  "crates/hyper-timing",
  "crates/hyper-tls",
  "crates/hyper-transport",
]
own = ["UPSTREAM.md"]

# vorpal, the search across a change (docs/ci.md W26-R07): its pattern engine (ast-grep's, with the
# regex literal analysis and the trigram primitive), its outline (the definition each hit sits in),
# its trigram store, and the tree-sitter runtime and grammars they parse with. Its release v0.10.2;
# the grammars of the languages kiln reads structurally, of the 48 vorpal carries.
[projects.vorpal]
kind = "git"
repository = "https://github.com/hyper-light/vorpal"
commit = "4420a4dfd7b96854784431ff899bbdd35510e07e"
path = "vendor/vorpal"
take = [
  "Cargo.toml",
  "LICENSE",
  "crates/canonical",
  "crates/config",
  "crates/core",
  "crates/graph",
  "crates/kg",
  "crates/language",
  "crates/mem",
  "crates/outline",
  "crates/segment",
  "vendor/tree-sitter",
  "grammars/tree-sitter-bash",
  "grammars/tree-sitter-c",
  "grammars/tree-sitter-cpp",
  "grammars/tree-sitter-css",
  "grammars/tree-sitter-go",
  "grammars/tree-sitter-html",
  "grammars/tree-sitter-java",
  "grammars/tree-sitter-javascript",
  "grammars/tree-sitter-json",
  "grammars/tree-sitter-md",
  "grammars/tree-sitter-python",
  "grammars/tree-sitter-rust",
  "grammars/tree-sitter-toml-ng",
  "grammars/tree-sitter-typescript",
  "grammars/tree-sitter-yaml",
]
own = ["UPSTREAM.md"]

# aws-lc-rs, kiln's (and rustls's, Mantle's) cryptography over AWS-LC, at its release v1.18.2, the
# version kiln takes from crates.io, with Mantle's change to it (a digest's state read out and
# resumed, which Mantle's gateway needs) so Mantle builds on kiln's one copy (kiln's CP-T10.2). The
# crate alone: aws-lc-sys stays crates.io's (0.46.0). Its manifest is made standalone, as crates.io's
# package states it (vendor/aws-lc-rs/UPSTREAM.md).
[projects.aws-lc-rs]
kind = "git"
repository = "https://github.com/aws/aws-lc-rs"
commit = "9df497501436596d4da77109217806b3af7f56cb"
path = "vendor/aws-lc-rs"
take = ["LICENSE", "aws-lc-rs"]
# Upstream's checkouts write its NIST vectors with CRLF line ends; kiln's copy holds each file's bytes
# as upstream's repository does, so a checkout of kiln holds them as scripts/vendor.py checks them.
exclude = ["aws-lc-rs/third_party/NIST/.gitattributes"]
own = ["UPSTREAM.md"]

# Mantle, kiln's store of bytes (docs/mantle.md; kiln's CP-T10.2), at the head of its main: its crates,
# built on kiln's one hyper-raft (vendor/hyper-raft) and aws-lc-rs (vendor/aws-lc-rs), so kiln's copy
# leaves its own copies of them (its vendor/) out, and its docs and drawings, which are Mantle's and no
# part of what kiln builds, and its CI (.github, .kiln), which runs in Mantle's repository. Its crates
# take hyper-raft's by path: the recorded change points those paths at kiln's copy
# (vendor/mantle/UPSTREAM.md).
[projects.mantle]
kind = "git"
repository = "https://github.com/hyper-light/mantle"
commit = "87ab09e1c94149c7b669cb0de5975e228125c867"
path = "vendor/mantle"
exclude = [".github", ".kiln", "vendor", "docs", "loomdoc.html", "mantle-strata.svg", "mantle-strata-dark.svg", "mantle-strata-light.svg"]
own = ["UPSTREAM.md"]

# Shards, the microVMs kiln's harnesses run in (docs/shards.md; kiln plan 01a1cd8e862e7169a074db3d5fa33f3d, step 16):
# the one Shards revision kiln and Hex build on. kiln links its Agentfile parser (shards-agentfile: every Agentfile is
# checked in-process) and, through Hex, its orchestrator's API (shards-api); and it carries Shards' binary, `shards`,
# with its VM and network processes beside it, built from here (ci/shards/pack.sh) and written out and signed by kiln
# (crates/kiln/src/shards). Upstream's tree less what no build reads: its docs, examples, fuzzing, CI, its scripts
# but the C compiler wrappers its guests are built with, its crates' recorded test data, and its byte-for-byte copies
# of aws-lc-rs and aws-lc-sys, which are kiln's: kiln's vendor/aws-lc-rs, and crates.io's aws-lc-sys as kiln links it
# (vendor/shards/UPSTREAM.md). It builds in its own folder, so Shards' toolchain file applies there: its Rust, and the
# musl targets its guest binaries need.
[projects.shards]
kind = "git"
repository = "https://github.com/hyper-light/shards"
commit = "1389dc0b60c92d33b3897af6d08690d7a459bba0"
path = "vendor/shards"
take = [
  ".cargo",
  "Cargo.lock",
  "Cargo.toml",
  "LICENSE",
  "clippy.toml",
  "crates",
  "resources",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "scripts/hvf-run",
  "scripts/install-zig",
  "scripts/zig-ar",
  "scripts/zig-cc",
  "vendor/rquickjs-sys",
]
exclude = [
  "crates/agentfile/testdata",
  "crates/archive/testdata",
  "crates/build/testdata",
  "crates/devcgroup/testdata",
  "crates/ext4/testdata",
  "crates/flate/testdata",
  "crates/gateway/testdata",
  "crates/gitsign/testdata",
  "crates/image/testdata",
  "crates/init/testdata",
  "crates/rego/testdata",
  "crates/seccomp/testdata",
  "crates/shards/src/build/testdata",
  "crates/shards/src/daemon/engine/testdata",
  "crates/shards/src/daemon/testdata",
  "crates/shards/src/logging/testdata",
  "crates/shards/testdata",
  "crates/sigstore/testdata",
  "crates/tuf/testdata",
  "crates/zstd/testdata",
]
own = ["UPSTREAM.md"]

# Hex, the runtime and scheduler kiln's harness microVMs run under (its docs/design; kiln plan 01a1cd8e862e7169a074db3d5fa33f3d,
# steps 12 and 16), built on kiln's one Shards and hyper-raft: its upstream pins kiln's Shards and an older hyper-raft,
# and a recorded change moves that pin to kiln's (vendor/hex/UPSTREAM.md). The pair kiln builds:
# Hex daa36e99 on Shards e82b9403 (and hyper-raft fb74b595), the one Shards revision Hex and kiln both build on. Its
# crates, the two records they include as they build, and the record of what it vendors (its vendor/MANIFEST.toml and
# vendor/patches, which kiln's pins are checked against) with seccompiler, the third-party code only Hex vendors; less
# its copies of what kiln vendors itself (hyper-raft, Shards, cuda-rust, all-smi), the GPU renderer and Firecracker
# sources only its own scripts build, and its docs, benchmarks and CI, which are Hex's.
[projects.hex]
kind = "git"
repository = "https://github.com/hyper-light/hex"
commit = "025aae6d336e2f0513a620dfb89ce4215b35e307"
path = "vendor/hex"
take = [
  "Cargo.toml",
  "LICENSE",
  "bench/competitive/probes/mntns_default.txt",
  "bench/native/guest/records.tsv",
  "clippy.toml",
  "crates",
  "vendor/MANIFEST.toml",
  "vendor/patches",
  "vendor/seccompiler",
]
exclude = ["vendor/patches/firecracker", "vendor/patches/shards-gpu"]
own = ["UPSTREAM.md"]

# cuda-rust (NVIDIA): hex-gpu loads NVML at run time by its CUDA driver loader's policy (library names
# per OS, WSL's own path, the library kept for the process, a library missing told from a symbol
# missing), adapted from cuda-bindings' dyn_load.rs and compiled from this copy by path
# (crates/hex-gpu/src/nvml.rs; docs/design/gpu-telemetry.md G1). cuda-rust binds no NVML: the eight
# NVML calls hex-gpu makes are declared in crates/hex-gpu/src/nvml/sys.rs from NVIDIA's NVML reference.
# Apache-2.0, as is its LICENSE taken beside it; no NOTICE file upstream.
[projects.cuda-rust]
kind = "git"
repository = "https://github.com/NVIDIA/cuda-rust"
commit = "a0a4dc78a20e06ec90827f597e950bdc49f723e2"
path = "vendor/cuda-rust"
take = ["LICENSE", "cuda-bindings/src/dyn_load.rs"]
own = ["UPSTREAM.md"]

# all-smi (Lablup): hex-gpu reads AMD GPUs through amdgpu's sysfs counters on Linux, from all-smi's AMD
# reader's gpu_busy_percent read (its fallback beside libamdgpu_top's ioctls), adapted to read each
# counter with one pread of a file kept open (crates/hex-gpu/src/amd.rs; docs/design/gpu-telemetry.md
# G2); and through ADL on Windows, from all-smi's transcription of AMD's ADL SDK headers (its ADL types
# and entry points) and its PMLog sensor read, cut to what hex-gpu calls (crates/hex-gpu/src/adl.rs;
# G3). Each is compiled from this copy by path. Apache-2.0, as is its LICENSE taken beside it; no
# NOTICE file upstream. AMD's ADL SDK headers it transcribes are MIT (GPUOpen-LibrariesAndSDKs/
# display-library at 84c881cb), cited, not taken.
[projects.all-smi]
kind = "git"
repository = "https://github.com/lablup/all-smi"
commit = "fe479ae675e39475a2eab1cfbb3f5432f705e12b"
path = "vendor/all-smi"
take = [
    "LICENSE",
    "crates/all-smi-amd-plugin/src/reader.rs",
    "src/device/readers/amd_adl/ffi.rs",
    "src/device/readers/amd_adl/sensors.rs",
]
own = ["UPSTREAM.md"]
