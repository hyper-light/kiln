# The oracles' nightly run (G2 step 3; bench/oracles/nightly.sh, bench/oracles/findings.md): random
# databases and queries over the SQLite language's inventory, each query checked by TLP, NoREC, PQS,
# DQP, EET and CERT on Amphora and against SQLite (the reference bench/oracles/sqlite.sh builds), for
# half an hour, the date its seed. Fails when the run finds a wrong answer or a panic; every finding,
# cut down to its smallest form, is printed after the run.
name: oracles
on:
  # 09:00 UTC, 02:00 in the machines' time zone: when nothing else is running.
  schedule: ["0 9 * * *"]
  manual: true
concurrency: { group: "oracles", cancel-in-progress: false }
jobs:
  nightly:
    name: oracles (half an hour, every oracle)
    runs-on: [k8s]
    toolchain: rust
    resources: { cpu: "4", memory: 8Gi }
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: python3, git, curl, openssl and a C compiler (the reference SQLite)
        run: command -v python3 >/dev/null && command -v curl >/dev/null && command -v openssl >/dev/null && command -v cc >/dev/null || { apt-get update && apt-get install -y --no-install-recommends python3 git curl openssl build-essential; }
      - name: toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: the bench, release
        run: cd bench && cargo build --release
      - name: the reference SQLite (3.54.0, the system's options and SQLITE_LIKE_DOESNT_MATCH_BLOBS)
        run: bash bench/oracles/sqlite.sh "$PWD/.oracle-sqlite"
      - name: the night's run
        run: |
          ORACLE_SQLITE="$PWD/.oracle-sqlite/libsqlite3-oracle-3540000.so" bash bench/oracles/nightly.sh bench/target/release/amphora-bench oracle-out
          status=$?
          for f in oracle-out/findings/*.md; do [ -e "$f" ] && { echo "==== $f"; cat "$f"; }; done
          exit $status
