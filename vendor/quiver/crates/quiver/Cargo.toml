[package]
name = "quiver"
description = "Quiver: the topic store: the cornerstone for an event-driven world"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "quiver"
path = "src/main.rs"

[dependencies]
# Waits that wake on a publish, under any executor.
event-listener = "5.4"
# Focal's bus (vendor/focal-bus): each message is kept as its batch, and charged to its memory budget.
focal-bus = "0.1.0"
focal-memory = "0.1.0"
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
quiver-api = { version = "0.1.0", path = "../quiver-api" }

[dev-dependencies]
event-listener = "5.4"
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await", "executor"] }
# T-T2.1.2's builds (tests/ram_store.rs): hyper-durable as a program outside a test takes it.
hyper-block = "0.1.0"
hyper-durable = "0.1.0"
# The bench's open loop, the process's CPU and the load average (benches/fanout.rs), as Focal's
# benches report through it.
hyper-measure = "0.1.0"
trybuild = "1.0"

# The ephemeral class's bench (bench/README.md): `cargo bench -p quiver --bench fanout -- <args>`.
[[bench]]
name = "fanout"
harness = false

[lints]
workspace = true
