[package]
name = "quiver"
description = "Quiver: the topic store: the cornerstone for an event-driven world"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "quiver"
path = "src/main.rs"

[dependencies]
# Focal's bus (vendor/focal-bus): each message is kept as its batch, and charged to its memory budget.
# Every vendored name is pinned exactly: crates.io has unrelated crates under some such names, and a
# newer compatible version there would be chosen over the [patch] (the root Cargo.toml).
focal-bus = "=0.1.0"
focal-memory = "=0.1.0"
# The files a persisted node keeps beside its logs (its run, each part's port), made durable as
# Focal makes every file it installs.
focal-platform = "=0.1.0"
# The persisted class's host (src/persisted): its shard, and the endpoints its members and
# publishers run on, as Focal's bus runs them.
hyper-rt = "=0.1.0"
hyper-rt-transport = "=0.1.0"
hyper-transport = "=0.1.0"
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
quiver-api = { version = "0.1.0", path = "../quiver-api" }

[dev-dependencies]
event-listener = "5.4"
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await", "executor"] }
# T-T2.1.2's builds (tests/ram_store.rs): hyper-durable as a program outside a test takes it.
hyper-block = "=0.1.0"
hyper-durable = "=0.1.0"
trybuild = "1.0"

[lints]
workspace = true
