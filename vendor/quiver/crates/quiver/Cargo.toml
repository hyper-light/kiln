[package]
name = "quiver"
description = "Quiver: the topic store: the cornerstone for an event-driven world"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "quiver"
path = "src/main.rs"

[dependencies]
# Focal's bus (vendor/focal-bus): each message is kept as its batch, and charged to its memory budget.
# Every vendored name is pinned exactly: crates.io has unrelated crates under some such names, and a
# newer compatible version there would be chosen over the [patch] (the root Cargo.toml).
focal-bus = "=0.1.0"
focal-memory = "=0.1.0"
# The files a persisted node keeps beside its logs (its run, each part's port), made durable as
# Focal makes every file it installs.
focal-platform = "=0.1.0"
# The persisted class's host (src/persisted): its shard, and the endpoints its members and
# publishers run on, as Focal's bus runs them.
hyper-rt = "=0.1.0"
hyper-rt-transport = "=0.1.0"
hyper-transport = "=0.1.0"
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
quiver-api = { version = "0.1.0", path = "../quiver-api" }
# The persisted class in a deterministic simulation (`sim`): each member's log on hyper-sim's
# block device.
hyper-block = { version = "=0.1.0", optional = true }
# The planted bug of the simulation's test (`plant-own-log-commit`): hyper-raft's mutant.
hyper-raft = { version = "=0.1.0", optional = true }

[features]
# The persisted class in a deterministic simulation (src/persisted/sim.rs, tests/sim.rs; kiln's
# CP-T2.2 step 6, docs/design/persisted-sim.md): its hosts on hyper-rt's simulation runtime, their
# members' logs on hyper-sim's block device under hyper-log's Waits::Told.
sim = ["dep:hyper-block", "hyper-block/sim", "focal-bus/sim"]
# The simulation's planted bug (tests/sim.rs, AC-T2.2.5's test): every member's group commits what
# its leader's own log holds, before a quorum's flush (`hyper_raft::Mutant::OwnLogCommit`). A test
# build, never a product's.
plant-own-log-commit = ["sim", "dep:hyper-raft", "hyper-raft/mutants", "focal-bus/mutants"]

[dev-dependencies]
event-listener = "5.4"
# Focal's root key files under the system's temporary directory in a test, never where the user
# keeps theirs (focal-seal's `keys_dir`): a node's identities and data directories are sealed.
focal-seal = { version = "=0.1.0", features = ["test-support"] }
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await", "executor"] }
# T-T2.1.2's builds (tests/ram_store.rs): hyper-durable as a program outside a test takes it.
hyper-block = "=0.1.0"
hyper-durable = "=0.1.0"
trybuild = "1.0"

[lints]
workspace = true
