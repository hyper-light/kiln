# Quiver's gate (CLAUDE.md, "Gates") in kiln CI: every push to main and every pull request runs
# scripts/gates.sh in a pod, the macOS and Windows lints included.
name: ci
on:
  push: { branches: [main] }
  pull_request: {}
  manual: true
concurrency: { group: "ci-${{ branch }}", cancel-in-progress: true }
jobs:
  gates:
    name: gates (Linux x86_64; macOS and Windows lints)
    runs-on: [k8s]
    toolchain: rust
    resources: { cpu: "4", memory: 8Gi }
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # A pod sees all of its host's CPUs, whatever it requests: builds and tests are held to its request.
      CARGO_BUILD_JOBS: "4"
      RUST_TEST_THREADS: "4"
    steps:
      - name: python3, its venv and git (the vendor check, and zig for the macOS and Windows lints)
        run: command -v git >/dev/null && python3 -m venv --help >/dev/null 2>&1 || { apt-get update && apt-get install -y --no-install-recommends python3 python3-venv git; }
      - name: toolchain (rust-toolchain.toml, pinned exactly, with the macOS and Windows targets)
        run: rustup show active-toolchain || rustup toolchain install
      - name: gates
        run: bash scripts/gates.sh
