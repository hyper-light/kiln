<!doctype html>
<html lang="en" data-motion="playing">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // iPhone/iPad Safari zooms the page into any focused field whose text is under 16px (kiln focuses
      // the terminal on load). Tell it not to auto-zoom; iOS still lets people pinch to zoom.
      (function () {
        var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (!ios) return;
        var m = document.querySelector('meta[name="viewport"]');
        if (m) m.setAttribute("content", m.getAttribute("content") + ", maximum-scale=1");
      })();
    </script>
    <meta name="theme-color" content="#08090a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="kiln — self-hosted CI/CD for the hyper-light stack" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>kiln</title>
    <style>
      html,body{background:#08090a;color:#ededee;margin:0}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
