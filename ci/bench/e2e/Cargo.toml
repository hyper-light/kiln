# kiln's end-to-end load-balancer bench (LB14; run.py drives it): its own workspace, so it builds in
# seconds without kiln's crates and stays out of kiln's binary. Two programs:
# - kiln-bench-e2e: the open-loop generator (reach socket, direct spawn, HTTP), src/main.rs;
# - e2e-backend: N test backends that answer every request at once (204), src/backend.rs.
# It speaks the reach socket's protocol (crates/kiln/src/reach/local.rs) with copies of its types
# (src/proto.rs), and links no kiln code.
[package]
name = "kiln-bench-e2e"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "kiln-bench-e2e"
path = "src/main.rs"

[[bin]]
name = "e2e-backend"
path = "src/backend.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
exit = "deny"

[profile.release]
codegen-units = 1
