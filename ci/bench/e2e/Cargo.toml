# kiln's open-loop end-to-end generator (ci/bench/README.md, "End to end"): its own workspace, so
# it builds in seconds without kiln's crates and stays out of kiln's binary. It speaks the reach
# socket's protocol (crates/kiln/src/reach/local.rs) with copies of its types (src/proto.rs).
[package]
name = "kiln-bench-e2e"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
exit = "deny"

[profile.release]
codegen-units = 1
