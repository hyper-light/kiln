[env]
# SQLite (rusqlite's bundled libsqlite3-sys) without its memory statistics. With them, every
# allocation SQLite makes takes one lock for the whole process, so connections on different
# threads wait on each other: two in-memory stores built side by side took three to four times one
# (fedora, 2026-10-20). SQLite's own recommended options turn it off (sqlite.org/compile.html,
# SQLITE_DEFAULT_MEMSTATUS); nothing in kiln reads them.
# With SQLite's pre-update hook: the store notes the rows a write touches, for the cluster group's
# entries (crates/kiln/src/store/capture.rs, docs/p2p.md P1).
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_ENABLE_PREUPDATE_HOOK"
# The stack the kiln binary gives its threads (crates/kiln/src/entry.rs, THREAD_STACK: 16 MiB), for
# the test binaries cargo runs too: they never run kiln's main, so the runtime's shards running
# kiln's async work got the 2 MiB a thread has by default, and in a debug build the CI dispatcher's
# handle -> start -> commands -> actions -> queue -> commands overflowed one (frames of 180-764 KiB,
# 2026-10-27). Reserved, not used: pages are touched as needed. A value already set stays.
RUST_MIN_STACK = "16777216"
# aws-lc-sys (crates.io's 0.46.0, under kiln's vendored aws-lc-rs) built as Mantle builds it
# (vendor/aws-lc-rs/UPSTREAM.md; Ada's word, 2026-11-03): no CPU jitter entropy, which costs a
# process 17.6 ms before its first random bytes, and AWS-LC from its own source, never a system one
# found by OPENSSL_DIR or pkg-config. Mantle's third change, a failing hardware RNG read falling
# back to the operating system's, is AWS-LC's C: carried only once aws-lc-sys is vendored.
AWS_LC_SYS_NO_JITTER_ENTROPY = "1"
AWS_LC_SYS_USE_SYSTEM = "0"
