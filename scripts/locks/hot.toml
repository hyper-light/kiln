# The API's hot path (goal 5 of the API runtime program, plan 01a1a59c2aae): the modules every request,
# websocket and runner message runs through. No Mutex, RwLock or Condvar is declared in them outside a
# test build's code, but those `allowed` lists, each with why it's off the hot path; shared state there is
# an owner with messages, an immutable copy swapped in whole (`crate::rcu`), or a copy per shard.
# `python3 scripts/locks.py check` holds the tree to this (CI: .kiln/ci.yaml and .github/workflows/ci.yml),
# and `python3 scripts/test_locks.py` proves it fails on a planted lock.
hot = [
  # HTTP: every request and websocket, kiln's own server and its handlers' entry.
  "crates/kiln-http/src",
  "crates/kiln/src/http/server.rs",
  "crates/kiln/src/http/ws.rs",
  "crates/kiln/src/http/io.rs",
  # TLS on every HTTPS connection: the server's own (`server.https`) and a runner's front door,
  # whose connections are spread across shards (goal 7 step 3's tickets and keys, the front door's
  # settings).
  "crates/kiln/src/http/tls.rs",
  "crates/kiln/src/frontdoor/proxy.rs",
  "crates/kiln/src/api.rs",
  "crates/kiln/src/overload.rs",
  "crates/kiln/src/ui.rs",
  # The HTTP/3 door: POST /api/me/door, and the door's CONNECTs (goal 4 of the browser protocol program).
  "crates/kiln/src/h3door.rs",
  "crates/kiln/src/h3door",
  "crates/kiln/src/authz",
  "crates/kiln/src/mcp/mod.rs",
  "crates/kiln/src/route_latency.rs",
  "crates/kiln/src/shard_health.rs",
  "crates/kiln/src/pool_health.rs",
  "crates/kiln/src/metrics.rs",
  # kiln's own log lines, from whatever thread logs: shards among them (goal 9, plan 01a1a87b2cec step 3).
  "crates/kiln/src/log_lines.rs",
  # Websockets: an agent session's live feed to its viewers, and the pages' sockets.
  "crates/kiln/src/harness/live.rs",
  # Agent sessions' events (every change of a session's info) out of each owner shard to their readers:
  # the events sockets, push and agents.wait (goal 4, plan 01a1a59c2a9c step 5).
  "crates/kiln/src/memory/lanes.rs",
  # The events sockets' feed (W21-R15): every frame the hub emits, pushed from the shard that emits it (an
  # agent session's change from its owner's) and read by every page's socket, numbered so a page resumes.
  "crates/kiln/src/wire/events/feed.rs",
  # Queues bounded in bytes: each session owner's inbox (every runner's update), the net thread's queues to
  # and from the hub, and the rest of kiln's that runners' messages pass through (goal 4, plan 01a1a59c2a9c
  # step 5).
  "crates/kiln/src/memory/queue.rs",
  # Rings: a terminal's output and a live job's log chunks out to their viewers (goal 4, plan 01a1a59c2a9c
  # step 5).
  "crates/kiln/src/memory/ring.rs",
  "crates/kiln/src/harness/broadcast.rs",
  "crates/kiln/src/wire/ui.rs",
  # Runner ingest: the hub, its link to the runners, and the processes each machine has.
  "crates/kiln/src/hub.rs",
  # A runner process's Build, taken in pieces on the hub's loop (goal 9, plan 01a1a87b2cec step 3).
  "crates/kiln/src/hub",
  "crates/kiln/src/net.rs",
  "crates/kiln/src/instances.rs",
  # Agent sessions: the registry every session's update from its runner, every viewer's read and
  # every command to one runs through (each session's copy its shard's, goal 4).
  "crates/kiln/src/harness/registry.rs",
  # Messages waiting for their sessions' inboxes to answer (CP-T3.2): one owner, a wait and its answer as
  # messages (goal 5, plan 01a1a59c2aae, its top goal).
  "crates/kiln/src/harness/answers.rs",
  # Conversation stores' feeds: each batch a runner's store sends the server's and the server's sends its
  # mirrors, and every answer to them (goal 5, plan 01a1a59c2aae, its top goal).
  "crates/kiln/src/convo/feed.rs",
  "crates/kiln/src/convo/mirror.rs",
  # Each machine's agent limit: read as sessions start and as runners say what they hold.
  "crates/kiln/src/harness/limit.rs",
