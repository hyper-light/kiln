  "crates/kiln-bp/src",
  "crates/kiln/src/bp",
  # The protocol over one WebSocket (goal 3 of the browser protocol program): its endpoint, its
  # sockets' task and send path, and the topics' owner.
  "crates/kiln/src/live",
  # What makes them lockless.
  "crates/kiln/src/rcu.rs",
  # Turns with no lock: gates, batons, reads and writes, keyed and once (goal 5, plan 01a1a59c2aae, its top goal).
  "crates/kiln/src/turn.rs",
  # CI (goal 5 step 2): the engine's legs, runs and kept legs, which the hub reads on its runners' job
  # messages; the caches the API's calls and the runs planned read; the modules the API's runs, legs,
  # pools and insights are read through.
  "crates/kiln/src/ci/dispatch.rs",
  "crates/kiln/src/ci/repo_config.rs",
  "crates/kiln/src/ci/routing.rs",
  "crates/kiln/src/ci/environments.rs",
  "crates/kiln/src/ci/results.rs",
  "crates/kiln/src/ci/warm.rs",
  "crates/kiln/src/ci/graphs.rs",
  "crates/kiln/src/ci/verdicts.rs",
  "crates/kiln/src/ci/api.rs",
  "crates/kiln/src/ci/runs_api.rs",
  "crates/kiln/src/ci/runs.rs",
  "crates/kiln/src/ci/pools.rs",
  "crates/kiln/src/ci/insights.rs",
  "crates/kiln/src/reads.rs",
  # Ship's Deploys (goal 5 step 2).
  "crates/kiln/src/ship",
  # The runner process's own side of the runner path (goal 5, plan 01a1a59c2aae, its top goal): a job's
  # steps and their log (`exec.rs`), a harness's and a step's pipes (`os/proc_unix.rs`; Windows'
  # `os/proc_windows.rs` keeps each process's job object behind a lock of its own, so it isn't here), and
  # a terminal's output and keystrokes on every platform (`terminal.rs`, `os/pty_unix.rs`,
  # `os/pty_windows.rs`). Their queues are `crate::memory::queue`'s.
  "crates/kiln/src/exec.rs",
  "crates/kiln/src/os/proc_unix.rs",
  "crates/kiln/src/terminal.rs",
  "crates/kiln/src/os/pty_unix.rs",
  "crates/kiln/src/os/pty_windows.rs",
]

# What waits on event-listener (goal 5 of the API runtime program, plan 01a1a59c2aae, its top goal): its list of
# listeners sits behind a std Mutex every wait, every wait given up and every wake takes, and the census of train 8's
# tree found it the one lock the shards still shared (1.8 ms a second waited with hogs, 2.4 ms at the longest;
# docs/runtime-lab.md). async-lock's locks, semaphores and cells wait on it, and so do the Events kiln held itself:
# none is named in these folders' code, outside a test build's; `crate::turn` (a gate, a baton, a read-write, keyed,
# once) and `crate::rt::Changed` wait with no lock. Nor is an async-channel, whose every send takes that Mutex twice
# and every receive once (main's census16: 2,537 takes a second calm, held when asked 5.75 times a second, waited
# 0.84 ms a second with hogs, 4 ms at the longest): `crate::memory::queue` queues with no lock
# (`memory::queue::answer` for one answer). Nor is a WebSocket split by async-tungstenite (its two halves share a
# std Mutex), but where both halves are the socket's one task's. One that must stay goes under `[[waiting]]` (at,
# name, why), as `allowed` does for the hot path's locks: a file's async-channels as one entry named
# `async_channel`, its splits as one named `split` (`scripts/locks.py`'s `wait_names`). A module only a test build
# compiles (a file of its own declared under `#[cfg(test)]`) isn't read.
waits = [
  "crates/kiln/src",
  "crates/kiln-http/src",
  "crates/kiln-rt/src",
]

