# The API's hot path (goal 5 of the API runtime program, plan 01a1a59c2aae): the modules every request,
# websocket and runner message runs through. No Mutex, RwLock or Condvar is declared in them outside a
# test build's code, but those `allowed` lists, each with why it's off the hot path; shared state there is
# an owner with messages, an immutable copy swapped in whole (`crate::rcu`), or a copy per shard.
# `python3 scripts/locks.py check` holds the tree to this (CI: .kiln/ci.yaml and .github/workflows/ci.yml),
# and `python3 scripts/test_locks.py` proves it fails on a planted lock.
hot = [
  # HTTP: every request and websocket, kiln's own server and its handlers' entry.
  "crates/kiln-http/src",
  "crates/kiln/src/http/server.rs",
  "crates/kiln/src/http/ws.rs",
  "crates/kiln/src/http/io.rs",
  # TLS on every HTTPS connection: the server's own (`server.https`) and a runner's front door,
  # whose connections are spread across shards (goal 7 step 3's tickets and keys, the front door's
  # settings).
  "crates/kiln/src/http/tls.rs",
  "crates/kiln/src/frontdoor/proxy.rs",
  "crates/kiln/src/api.rs",
  "crates/kiln/src/overload.rs",
  "crates/kiln/src/ui.rs",
  "crates/kiln/src/authz",
  "crates/kiln/src/mcp/mod.rs",
  "crates/kiln/src/route_latency.rs",
  "crates/kiln/src/shard_health.rs",
  "crates/kiln/src/pool_health.rs",
  "crates/kiln/src/metrics.rs",
  # Websockets: an agent session's live feed to its viewers, and the pages' sockets.
  "crates/kiln/src/harness/live.rs",
  "crates/kiln/src/harness/broadcast.rs",
  "crates/kiln/src/wire/ui.rs",
  # Runner ingest: the hub, its link to the runners, and the processes each machine has.
  "crates/kiln/src/hub.rs",
  "crates/kiln/src/net.rs",
  "crates/kiln/src/instances.rs",
  # Agent sessions: the registry every session's update from its runner, every viewer's read and
  # every command to one runs through (each session's copy its shard's, goal 4).
  "crates/kiln/src/harness/registry.rs",
  # Each machine's agent limit: read as sessions start and as runners say what they hold.
  "crates/kiln/src/harness/limit.rs",
  # Reach's relay between runners: every relayed frame, one owner taking them in order.
  "crates/kiln/src/reach/relay.rs",
  # A runner's front door with a replica of kiln's records (docs/p2p.md, the peer-to-peer
  # unification's P2): every request it answers from the replica, and the learner behind it.
  "crates/kiln/src/frontdoor/replica.rs",
  "crates/kiln/src/store/learner.rs",
  # The bus the live feeds ride, and the logs.
  "crates/kiln/src/bus.rs",
  "crates/kiln/src/logs.rs",
  # The ship model, and the CI state the API reads.
  "crates/kiln/src/ship.rs",
  "crates/kiln/src/store.rs",
  # What makes them lockless.
  "crates/kiln/src/rcu.rs",
  # CI (goal 5 step 2): the engine's legs, runs and kept legs, which the hub reads on its runners' job
  # messages; the caches the API's calls and the runs planned read; the modules the API's runs, legs,
  # pools and insights are read through.
  "crates/kiln/src/ci/dispatch.rs",
  "crates/kiln/src/ci/repo_config.rs",
  "crates/kiln/src/ci/routing.rs",
  "crates/kiln/src/ci/environments.rs",
  "crates/kiln/src/ci/results.rs",
  "crates/kiln/src/ci/warm.rs",
  "crates/kiln/src/ci/graphs.rs",
  "crates/kiln/src/ci/verdicts.rs",
  "crates/kiln/src/ci/api.rs",
  "crates/kiln/src/ci/runs_api.rs",
  "crates/kiln/src/ci/runs.rs",
  "crates/kiln/src/ci/pools.rs",
  "crates/kiln/src/ci/insights.rs",
  "crates/kiln/src/reads.rs",
  # Ship's Deploys (goal 5 step 2).
  "crates/kiln/src/ship",
]

# kiln-http: a cell per body, upgrade or wait, held by that one object's two ends, no other request's.

[[allowed]]
at = "crates/kiln-http/src/body.rs"
name = "use"
why = "imports the body pipe's cell (state, below)"

[[allowed]]
at = "crates/kiln-http/src/body.rs"
name = "state"
why = "one per body still arriving: its connection feeds it and its reader reads it, both in the connection's task as a rule (a connection's handlers run there); no other request, and no shard but theirs, takes it"

[[allowed]]
at = "crates/kiln-http/src/upgrade.rs"
name = "use"
why = "imports the upgrade's hand-off cell (rx, below)"

[[allowed]]
at = "crates/kiln-http/src/upgrade.rs"
name = "rx"
why = "one per upgraded connection (a WebSocket): its connection hands it over once and its handler takes it once"

[[allowed]]
at = "crates/kiln-http/src/rt.rs"
name = "use"
why = "imports the bridge's cell (shared, below)"

[[allowed]]
at = "crates/kiln-http/src/rt.rs"
name = "shared"
why = "one per wait polled under a foreign waker: its helper task runs on the same shard as its poller, so no other shard ever takes it"

[[allowed]]
at = "crates/kiln-http/src/h1/client.rs"
name = "use"
why = "kiln's HTTP client, not its server: imports its connection's cell (state, below)"

[[allowed]]
at = "crates/kiln-http/src/h1/client.rs"
name = "state"
why = "an outgoing HTTP/1.1 connection's (the UI server's proxy, webhooks, forges): kiln as a client, no request or runner path of the server's"

[[allowed]]
at = "crates/kiln-http/src/h2/client.rs"
name = "use"
why = "kiln's HTTP client, not its server: imports its connection's flag (closed, below)"

[[allowed]]
at = "crates/kiln-http/src/h2/client.rs"
name = "closed"
why = "an outgoing HTTP/2 connection's: kiln as a client, no request or runner path of the server's"

# Signing in: once per sign-in, not per request.

[[allowed]]
at = "crates/kiln/src/api.rs"
name = "PASSWORD_GATE"
why = "a password sign-in's hashing, one at a time (argon2 takes a CPU's worth of memory): taken as a person signs in with a password, never by another route"

[[allowed]]
at = "crates/kiln/src/authz/passkeys.rs"
name = "pending"
why = "passkey sign-in challenges, from one to its answer: taken as a person signs in with a passkey"

[[allowed]]
at = "crates/kiln/src/authz/passkeys.rs"
name = "P"
why = "the static behind pending (above)"

[[allowed]]
at = "crates/kiln/src/authz/passwords.rs"
name = "THROTTLES"
why = "failed password sign-ins by account, to slow guessing: taken as a person signs in with a password"

# A runner's dialer.

[[allowed]]
at = "crates/kiln/src/net.rs"
name = "use"
why = "imports the dialer's last address (last_dial, below)"

[[allowed]]
at = "crates/kiln/src/net.rs"
name = "last_dial"
why = "the address the net thread dialed last (a runner's; the server's net thread doesn't dial), kept across the loops it rebuilds: taken by the net thread alone, never by another thread or a shard"

# The hub.

[[allowed]]
at = "crates/kiln/src/hub.rs"
name = "use"
why = "imports the hub's locks listed below"

[[allowed]]
at = "crates/kiln/src/hub.rs"
name = "handovers"
why = "agent sessions moving between a machine's runner processes (crate::handovers): taken as a runner process is replaced, and on a session's update only when two of a machine's processes both say they hold it"

# Agent sessions' registry: what a session's updates read beside its copy (names, epochs, holders,
# keep-offs, changesets, what machines offer) are copies swapped in whole (crate::rcu); these three
# are off the hot path.

[[allowed]]
at = "crates/kiln/src/harness/registry.rs"
name = "use"
why = "imports the registry's locks listed below"

[[allowed]]
at = "crates/kiln/src/harness/registry.rs"
name = "scanner"
why = "the server machine's own transcripts' scanner, for the history of its past sessions: one scan at a time, on the blocking pool, as a person opens that history; no session's update, viewer or command takes it"

[[allowed]]
at = "crates/kiln/src/harness/registry.rs"
name = "holders_writing"
why = "one write of holders.json at a time, on the blocking pool, as a session changes hands; no shard takes it"

[[allowed]]
at = "crates/kiln/src/harness/registry.rs"
name = "waiting"
why = "messages waiting for their session's inbox to answer (CP-T3.2): taken twice a message, as it's sent to a session and as its inbox's answer comes (an Inbox update, in the hub's loop); never on any other update, a viewer's read or a command"

# A runner's front door answering reads from its replica, and the learners behind it: the peer-to-peer
# unification's (docs/p2p.md, P2: plan 01a1a283e14c), the custody of the cluster group added to them by
# W27-R08 (docs/ci.md, step 12, path f). Listed for their owners to change; those on a request's or a
# message's path say what replaces them (todo).

[[allowed]]
at = "crates/kiln/src/frontdoor/replica.rs"
name = "owners"
why = "P2's: which credentials are the owner's, as the server said, kept a while; one Door serves all of the front door's connections, so every read it answers from the replica takes it"
todo = "a crate::rcu copy, swapped in as the server's answer comes, or one per shard"

[[allowed]]
at = "crates/kiln/src/frontdoor/replica.rs"
name = "stale_until"
why = "P2's: until when the server answers every read, the replica behind; every read the front door answers from the replica takes it"
todo = "an atomic: the instant as milliseconds in an AtomicU64"

[[allowed]]
at = "crates/kiln/src/frontdoor/replica.rs"
name = "idle"
why = "P2's: the front door's kept connections to the server, taken on every request it sends the server"
todo = "a lock-free queue of kept connections (async_channel), or a pool per shard"

[[allowed]]
at = "crates/kiln/src/store/learner.rs"
name = "GLOBAL"
why = "P2's: this process's learner, read (an RwLock's read) on every front-door connection at a runner holding a replica (frontdoor/proxy.rs door_for), written as its learner starts and stops"
todo = "a crate::rcu copy of the Option<Arc<Learner>>, read without a lock"

[[allowed]]
at = "crates/kiln/src/store/learner.rs"
name = "asks"
why = "P2's: questions to the server of where kiln.db stands, taken twice on every read the front door answers from the replica (Learner::current) and once as its answer comes"
todo = "crate::rcu::Pending, the take-once cells the hub's questions to runners use"

[[allowed]]
at = "crates/kiln/src/store/learner.rs"
name = "machines"
why = "P2's, the server's side: each learner's machine by its member, read for every message the cluster group sends a learner (the hub's cluster loop), written as a runner says it holds a replica"
todo = "a crate::rcu copy, read on every group message, swapped in as learners come"

[[allowed]]
at = "crates/kiln/src/store/learner.rs"
name = "joiner"
why = "P2's: the parts of raft messages coming in (a runner's learner's from the server; the server's from its learners), each taken by its one reader of them; no request takes it"

[[allowed]]
at = "crates/kiln/src/store/learner.rs"
name = "periods"
why = "W27-R08's custody of the cluster group (docs/ci.md, step 12, path f), in P2's learners: the log's checkpoints owed to the learners that check them, taken as checkpoints come due, are sent and are checked, not by a request"

[[allowed]]
at = "crates/kiln/src/store/learner.rs"
name = "changes_after"
why = "a test build's fault (entry_changed) only, taken when the chaos config sets it; nothing in a release takes it"
