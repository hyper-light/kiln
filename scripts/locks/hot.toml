why = "one write of holders.json at a time, on the blocking pool, as a session changes hands; no shard takes it"

# Terminals: every session, their names and their list are copies (crate::rcu); a session's figures
# (attached, active, size, title, end) are atomics and copies beside it.

# Conversation stores' mirrors: each feed and the runner process it goes to are read lock-free (crate::rcu,
# arc-swap); which runners keep a copy is chosen under a lock as runners connect (goal 5, plan 01a1a59c2aae,
# its top goal).

[[allowed]]
at = "crates/kiln/src/convo/mirror.rs"
name = "use"
why = "imports the mirrors' choice's lock (chosen, below)"

[[allowed]]
at = "crates/kiln/src/convo/mirror.rs"
name = "chosen"
why = "which runners keep a copy of the conversation store: taken as runners connect or go and the mirrors are picked again (Mirrors::connected, from the hub's mirrors_seen), by telemetry (the stores page, GET /api/conversations/mirrors) and once at start (chosen_machines). Never for a message: a mirror's word (heard), a feed's part and a batch's hand-on read the feeds and their runner processes lock-free. It also keeps feeds being made and let go of to one caller at a time"

[[allowed]]
at = "crates/kiln/src/termsess.rs"
name = "use"
why = "imports a terminal session's screen's lock (state, below)"

[[allowed]]
at = "crates/kiln/src/termsess.rs"
name = "state"
why = "one per terminal session, its screen and backlog. Per output frame one task alone takes it: the session's relay on the server (output, finish), or on a runner the pump of the PTY a Session::detached mirrors. A viewer takes it only as it attaches (its replay and its live feed made together, so they meet with no byte twice or lost) or resizes the terminal (a person's act, the size in order with the output); keystrokes, detaches, the list's reads and other sessions never do. Not made an owner with messages (goal 5, plan 01a1a59c2aae, its top goal), as that changes behaviour: attach() answers at once at its 14 call sites (the API's terminal sockets, accounts, fleet, updates, CD's logs, a runner's own terminals), and through an owner each would wait for the relay's turn, behind up to a full relay of output (4,096 frames, termsess::RELAY) and the relay's own waits (a replay asked of the runner, each keystroke's command); and a Session::detached has no task to own it. Goal 5's census of train 8's tree on fedora (3 calm rounds and 3 with hogs, production's layout): none of kiln's own locks waited, this one among them"

# The live channel's link (docs/wire.md; the ACK/NACK work, 2232eb69457): which runners keep the channel,
# and what each runner's receivers have of each stream, are copies (crate::rcu).

[[allowed]]
at = "crates/kiln/src/wire/link.rs"
name = "use"
why = "imports the runners' receivers' lock (by_runner, below)"

[[allowed]]
at = "crates/kiln/src/wire/link.rs"
name = "by_runner"
why = "each runner's receivers: one of the hub's loops alone takes it, for each item a runner sends and then its answer, in order (one task, so no shard waits on another for it). Each loop has a Links of its own (goal 10, plan 01a1a87b2dae step 4: a session's streams are its owner's shard's session loop's, the rest the control loop's; crate::wire::fan, Hub::links_of), so no lock is taken by two loops; what is said again of them every few seconds by the commands loop, and as a link comes up, is read off the per-stream copies each publishes as it changes them (has), so no other task takes it"

# A runner's front door answering reads from its replica, and the learners behind it: the peer-to-peer
# unification's (docs/p2p.md, P2: plan 01a1a283e14c), the custody of the cluster group added to them by
# W27-R08 (docs/ci.md, step 12, path f). What a request or a group message takes is a copy, an atomic, a
# take-once cell or a lock-free queue (goal 5); these three are off the hot path.

[[allowed]]
at = "crates/kiln/src/store/learner.rs"
name = "joiner"
why = "P2's: the parts of raft messages coming in (a runner's learner's from the server; the server's from its learners), each taken by its one reader of them; no request takes it"

[[allowed]]
at = "crates/kiln/src/store/learner.rs"
name = "periods"
why = "W27-R08's custody of the cluster group (docs/ci.md, step 12, path f), in P2's learners: the log's checkpoints owed to the learners that check them, taken as checkpoints come due, are sent and are checked, not by a request"

[[allowed]]
at = "crates/kiln/src/store/learner.rs"
name = "changes_after"
why = "a test build's fault (entry_changed) only, taken when the chaos config sets it; nothing in a release takes it"
