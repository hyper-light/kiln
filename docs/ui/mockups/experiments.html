<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Experiments · kiln mockup</title>
<link rel="stylesheet" href="assets/fonts.css" />
<link rel="stylesheet" href="assets/kiln.css" />
<link rel="stylesheet" href="assets/mockup.css" />
</head>
<body>
<div class="container-console mk-page">
  <div class="mk-banner">
    <span><b>Mockup</b> · kiln UI design · sample data · P7.1, P7.2</span>
    <nav aria-label="Mockups"><a href="runners.html">Runners</a><a href="agents.html">Agents</a><a href="agentfile.html">Agentfile</a><a href="experiments.html" aria-current="page">Experiments</a></nav>
  </div>
  <div class="af-page" id="page"></div>
</div>
<script src="assets/mockup.js"></script>
<script>
const COLORS = ["#a6c4ed", "#d6a2aa", "#d8cbb0", "#b8d9d2"]; // kiln's chart SERIES; every mark also carries its variant's letter
const KEYS = "ABCD";
const AGENTS = [["reviewer", "reviewer (Claude Code · Opus 5.5)"], ["pr-triage", "pr-triage (Codex · GPT-6.1 Sol mini)"], ["release-notes", "release-notes (Gemini CLI)"]];
const AGENTFILES = [["rust-dev", "rust-dev (yours, v9)"], ["docs-site", "docs-site (yours, v3)"], ["harness-claude", "harness-claude (kiln's)"], ["harness-codex", "harness-codex (kiln's)"]];

/* What each variant really is, for the simulation alone: the page computes every interval from the sessions it makes. */
const TRUTH = {
  "microvm-2-4": { cold: [1910, 80], template: [412, 25], warm: [214, 12], peak: [2.31, 0.1], steady: [1.62, 0.07], cpu: [0.41, 0.05], fail: 0.08, done: 0.82 },
  "microvm-4-8": { cold: [1970, 85], template: [455, 26], warm: [219, 12], peak: [3.02, 0.11], steady: [2.05, 0.08], cpu: [0.43, 0.05], fail: 0.01, done: 0.9 },
  "host": { process: [310, 30], peak: [1.48, 0.12], steady: [1.12, 0.08], cpu: [0.37, 0.05], fail: 0.03, done: 0.86 },
};
const truthOf = (v) => (v.engine === "host" ? TRUTH.host : v.mem === "8" ? TRUTH["microvm-4-8"] : TRUTH["microvm-2-4"]);
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const gauss = ([m, sd]) => { const u = rnd() || 1e-9, v = rnd(); return m + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

const S = {
  tab: "split",
  state: "live", // draft | live | paused | promoted
  name: "reviewer-size",
  target: { kind: "agent", agent: "reviewer", harness: "claude", agentfile: "rust-dev" },
  variants: [
    { agentfile: "rust-dev", engine: "microvm", cpus: "2", mem: "4", weight: 50, current: true },
    { agentfile: "rust-dev", engine: "microvm", cpus: "4", mem: "8", weight: 50 },
  ],
  sessions: [], // {v, kind, start, peak, steady, cpu, failed, done, at, project, runner}
  promoted: null, asking: null, table: false, started: "2 hours ago",
  replay: { session: "s1", reps: 5, picks: [0, 1], state: "done", done: 0 },
};
const LIST = [["reviewer-size", "reviewer split 50/50: 2 vCPU · 4 GiB against 4 vCPU · 8 GiB"], ["codex-vs-claude-start", "pr-triage on harness codex against harness claude", "promoted B · 2 days ago"], ["rust-dev-host-vs-microvm", "reviewer on host against microvm", "promoted B · last week"]];

/* ------------------------------------------------------------ sessions arriving */
function assign() {
  // Each new session gets a variant by weight, and keeps it for its life.
  let r = rnd() * 100, i = 0;
  for (; i < S.variants.length - 1; i++) { r -= S.variants[i].weight; if (r < 0) break; }
  return i;
}
const PROJECTS = ["hyper-light/kiln", "hyper-light/shards", "hyper-light/hex"];
const RUNNERS_ = ["adas-mac-studio-3.local", "adacachy2", "adas-mac-studio.local", "adas-macbook-pro-2.local"];
function arrive(v = S.state === "paused" ? S.variants.findIndex((x) => x.current) : assign()) {
  const t = truthOf(S.variants[v]);
  const kind = S.variants[v].engine === "host" ? "process" : (() => { const r = rnd(); return r < 0.7 ? "warm" : r < 0.9 ? "template" : "cold"; })();
  const failed = rnd() < t.fail;
  S.sessions.push({ v, kind, start: gauss(t[kind]), peak: gauss(t.peak), steady: gauss(t.steady), cpu: gauss(t.cpu), failed, done: !failed && rnd() < t.done, project: PROJECTS[Math.floor(rnd() * 3)], runner: S.variants[v].engine === "host" ? "adacachy" : RUNNERS_[Math.floor(rnd() * 4)], paused: S.state === "paused" });
}
for (let i = 0; i < 96; i++) arrive();

/* ------------------------------------------------------------ intervals from the sessions themselves */
const median = (xs) => { const s = [...xs].sort((a, b) => a - b), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
function medianCI(xs) {
  // A 95% interval of the median from the order statistics (distribution-free), as kiln's bootstrap would give near it.
  const s = [...xs].sort((a, b) => a - b), n = s.length;
  if (n < 3) return null;
  const h = 1.96 * Math.sqrt(n) / 2;
  const lo = s[Math.max(0, Math.floor(n / 2 - h))], hi = s[Math.min(n - 1, Math.ceil(n / 2 + h) - 1)];
  return [lo, median(s), hi];
}
function wilson(k, n) { if (!n) return null; const z = 1.96, p = k / n, d = 1 + (z * z) / n, c = (p + (z * z) / (2 * n)) / d, w = (z * Math.sqrt((p * (1 - p)) / n + (z * z) / (4 * n * n))) / d; return [Math.max(0, c - w) * 100, p * 100, Math.min(1, c + w) * 100]; }
const MEASURES = [
  { id: "cold", m: "Start: cold", unit: "ms", better: "lower", pick: (s) => (s.kind === "cold" && !s.failed ? s.start : null) },
  { id: "template", m: "Start: from its template", unit: "ms", better: "lower", pick: (s) => (s.kind === "template" && !s.failed ? s.start : null) },
  { id: "warm", m: "Start: warm", unit: "ms", better: "lower", pick: (s) => (s.kind === "warm" && !s.failed ? s.start : null) },
  { id: "process", m: "Start: as a process (host)", unit: "ms", better: "lower", pick: (s) => (s.kind === "process" && !s.failed ? s.start : null) },
  { id: "peak", m: "Footprint: peak", unit: "GiB", better: "lower", pick: (s) => (s.failed ? null : s.peak) },
  { id: "steady", m: "Footprint: steady", unit: "GiB", better: "lower", pick: (s) => (s.failed ? null : s.steady) },
  { id: "cpu", m: "Host CPU", unit: "CPU·s a session minute", better: "lower", pick: (s) => (s.failed ? null : s.cpu) },
  { id: "fail", m: "Failures", unit: "% of sessions", better: "lower", rate: (s) => s.failed },
  { id: "done", m: "Session outcome", unit: "% ended done", better: "higher", rate: (s) => s.done },
];
function stats(meas) {
  return S.variants.map((_, i) => {
    const mine = S.sessions.filter((s) => s.v === i && !s.paused);
    if (meas.rate) { const ci = wilson(mine.filter(meas.rate).length, mine.length); return ci && { ci, n: mine.length, k: mine.filter(meas.rate).length }; }
    const xs = mine.map(meas.pick).filter((x) => x !== null);
    const ci = medianCI(xs); return ci && { ci, n: xs.length };
  });
}
function verdict(meas, st) {
  const have = st.map((x, i) => [x, i]).filter(([x]) => x);
  if (have.length < 2) return { w: null, t: have.length ? "one variant has sessions of this kind" : "no sessions of this kind yet" };
  const lower = meas.better === "lower";
  // A winner beats every other variant's whole interval.
  for (const [x, i] of have) if (have.every(([y, j]) => j === i || (lower ? x.ci[2] < y.ci[0] : x.ci[0] > y.ci[2]))) {
    const best = have.filter(([, j]) => j !== i).map(([y]) => y.ci[1]);
    const other = lower ? Math.min(...best) : Math.max(...best);
    const rel = meas.unit.startsWith("%") ? `${Math.abs(x.ci[1] - other).toFixed(0)} points ${lower ? "fewer" : "more"}` : meas.unit === "GiB" ? `${Math.abs(other - x.ci[1]).toFixed(2)} GiB less` : `${Math.abs(Math.round((1 - x.ci[1] / other) * 100))}% ${meas.id.length < 9 && meas.unit === "ms" ? "faster" : "less"}`;
    return { w: i, t: `${KEYS[i]} ${rel}` };
  }
  return { w: null, t: `no clear difference yet (n = ${have.map(([x]) => x.n).join(", ")})` };
}
const fmt = (x, u) => (u === "ms" || u.startsWith("of ") ? String(Math.round(x)) : u.startsWith("%") ? x.toFixed(0) : x.toFixed(2));

/* ------------------------------------------------------------ the page */
const key = (i) => `<span class="ex-key" style="background:${COLORS[i]}" aria-hidden="true">${KEYS[i]}</span>`;
const vLabel = (v) => `${v.agentfile} · ${v.engine}${v.engine === "microvm" ? ` · ${v.cpus} vCPU · ${v.mem} GiB` : ""}`;
const targetLabel = () => (S.target.kind === "agent" ? `agent ${S.target.agent}` : `harness ${S.target.harness} in ${S.target.agentfile}`);
function stateWord() { return { draft: "not started", live: `live · ${S.sessions.length} sessions`, paused: `paused · ${S.sessions.length} sessions`, promoted: `promoted ${KEYS[S.promoted]}` }[S.state]; }

function render() {
  $("#page").innerHTML = `<nav class="eyebrow crumbs" aria-label="Breadcrumb"><span class="spectrum-rule"></span><a>05 / Agents</a><span aria-hidden="true">/</span><span>Experiments</span></nav>
  <h1 class="af-title">Experiments <span class="mk-new">new</span></h1>
  <p class="af-dim af-lead">Split an agent's real sessions between ways of deploying it. Each variant is a microVM deployment (or the host); each session that starts is given one, by its weight, and keeps it for its life. Every measure comes from those sessions. Replay, beside it, runs a recorded session's tool calls against variants, offline. No model is asked anything for an experiment, and no tokens are counted.</p>
  <section class="af-section" aria-label="Yours"><div class="af-head"><h2 class="af-h">Yours</h2><button class="btn btn-secondary btn-xs" data-act="new">New experiment</button></div>
    <ul class="af-rows">${LIST.map(([n, d, s], i) => `<li><div class="af-row"><span class="af-name">${n}</span><span class="af-dim">${i === 0 ? `${esc(targetLabel())} split ${S.variants.map((v) => v.weight).join("/")}` : d}</span><span class="af-acts"><span class="dim mono" style="font-size:10.5px">${i === 0 ? stateWord() : s}</span></span></div></li>`).join("")}</ul></section>
  <section class="af-section" aria-label="${esc(S.name)}">
    <div class="af-head"><h2 class="af-h">${esc(S.name)}</h2><span class="dim mono" style="font-size:10.5px">${stateWord()}</span></div>
    <div class="pt" role="tablist" aria-label="Experiment">${[["split", "Live split", S.sessions.length], ["replay", "Replay"]].map(([id, l, n]) => `<button role="tab" aria-selected="${S.tab === id}" data-tab="${id}">${l}${n ? ` <span class="pt-n">${n}</span>` : ""}</button>`).join("")}</div>
    ${S.tab === "split" ? split() : replay()}
  </section>`;
}

function split() {
  const live = S.state === "live" || S.state === "paused";
  const fixed = S.state !== "draft"; // the target and the variants' deployments are fixed once it starts; weights aren't
  return `<div class="stack mt-3">
    <div class="label">Target</div>
    ${fixed ? `<p class="eng-line"><span class="mono">${esc(targetLabel())}</span>: the sessions of it you start (Mission control, Run, a plan's step) are split. Others' aren't.</p>` : `
    <div class="seg" role="group" aria-label="Target" data-tk><button data-v="agent" aria-pressed="${S.target.kind === "agent"}">An agent</button><button data-v="harness" aria-pressed="${S.target.kind === "harness"}">A harness in an Agentfile</button></div>
    <div class="grid2">${S.target.kind === "agent" ? `<div class="select-field"><label class="field-label" for="ta">Agent</label>${select("ta", AGENTS, S.target.agent, 'data-t="agent"')}</div>` : `<div class="select-field"><label class="field-label" for="th">Harness</label>${select("th", HARNESSES.map((h) => [h.id, h.name]), S.target.harness, 'data-t="harness"')}</div><div class="select-field"><label class="field-label" for="tf">Agentfile</label>${select("tf", AGENTFILES, S.target.agentfile, 'data-t="agentfile"')}</div>`}</div>
    <p class="af-dim">The sessions of it you start (Mission control, Run, a plan's step) are split. Others' aren't.</p>`}

    <div class="label-row hair"><div class="label">Variants and weights</div>${!fixed && S.variants.length < 4 ? `<button class="btn btn-ghost btn-xs" data-act="addv">Add a variant</button>` : ""}</div>
    <div class="ex-arms">${S.variants.map((v, i) => variantCard(v, i, fixed)).join("")}</div>
    <p class="af-dim">${weightsLine()}</p>

    <div class="af-actions">${S.state === "draft" ? `<button class="btn btn-primary btn-sm" data-act="start">Start the split</button><span class="af-dim">From then on, each ${esc(targetLabel())} session that starts gets a variant by these weights.</span>`
      : S.state === "live" ? `<button class="btn btn-secondary btn-sm" data-act="pause">Pause</button><span class="af-dim">Live since ${S.started}. A weight changed now applies to sessions that start from now on.</span>`
      : S.state === "paused" ? `<button class="btn btn-primary btn-sm" data-act="resume">Resume</button><span class="af-dim">Paused: new sessions start on ${KEYS[S.variants.findIndex((x) => x.current)]}, what it runs on now, and aren't counted. Sessions already given a variant keep it.</span>`
      : `<span class="said" data-tone="ok">Promoted ${KEYS[S.promoted]}: ${esc(targetLabel())} starts on ${esc(vLabel(S.variants[S.promoted]))} from now on. The split has ended; its sessions and results are kept.</span>`}</div>

    ${S.state === "draft" ? "" : `
    <div class="label hair">Assigned</div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>Variant</th><th class="num">Weight</th><th class="num">Sessions</th><th class="num hidden sm:table-cell">Share</th><th class="num">Running now</th></tr></thead><tbody>
      ${S.variants.map((v, i) => { const n = S.sessions.filter((s) => s.v === i && !s.paused).length, all = S.sessions.filter((s) => !s.paused).length; return `<tr><td>${key(i)} <span class="cell-mono" style="margin-left:6px">${esc(vLabel(v))}</span>${v.current ? `<span class="cell-sub" style="display:inline;margin-left:6px">current</span>` : ""}</td><td class="num cell-mono">${v.weight}%</td><td class="num cell-mono">${n}</td><td class="num cell-mono hidden sm:table-cell">${all ? Math.round((n / all) * 100) : 0}%</td><td class="num cell-mono">${live ? Math.max(0, Math.round(n / 9)) : 0}</td></tr>`; }).join("")}
    </tbody></table></div>
    <ul class="ex-log" aria-label="Sessions, newest first">${S.sessions.slice(-8).reverse().map((s, j) => `<li>${key(s.v)}<span class="mono">${esc(S.target.agent || S.target.harness)} · ${s.project}</span><span class="dim">${s.failed ? `<span class="fail">failed to start</span>: OOM-killed at ${S.variants[s.v].mem} GiB` : `${s.kind} start ${Math.round(s.start)} ms · ${s.runner}`}${s.paused ? " · paused, not counted" : ""}</span><span class="right dim mono" style="font-size:10.5px">${j === 0 ? "just now" : `${j * 3} min ago`}</span></li>`).join("")}</ul>
    ${results()}`}
  </div>`;
}
function variantCard(v, i, fixed) {
  return `<div class="ex-arm" data-var="${i}">
    <div class="ex-arm-head">${key(i)}<span class="mono" style="font-size:12.5px;color:#e4e5e7">Variant ${KEYS[i]}</span>${v.current ? `<span class="chip">current</span>` : ""}${!fixed && S.variants.length > 2 ? `<button class="btn btn-ghost-danger btn-xs right" data-act="rmv" data-i="${i}">Remove</button>` : ""}</div>
    ${fixed ? `<p class="eng-line mono" style="font-size:12px">${esc(vLabel(v))}</p>` : `
    <div class="select-field"><label class="field-label">Agentfile</label>${select(`vf${i}`, AGENTFILES, v.agentfile, 'data-vk="agentfile"')}</div>
    <div><div class="field-label">Engine</div><div class="seg seg-xs" role="group" aria-label="Variant ${KEYS[i]}'s engine" data-veng="${i}"><button data-v="microvm" aria-pressed="${v.engine === "microvm"}">microvm</button><button data-v="host" aria-pressed="${v.engine === "host"}">host</button></div></div>
    ${v.engine === "microvm" ? `<div class="grid2"><div class="select-field"><label class="field-label">vCPUs</label>${select(`vc${i}`, ["1", "2", "4", "8"].map((x) => [x, x]), v.cpus, 'data-vk="cpus"')}</div><div class="select-field"><label class="field-label">Memory</label>${select(`vm${i}`, ["2", "4", "8", "16"].map((x) => [x, x + " GiB"]), v.mem, 'data-vk="mem"')}</div></div>` : `<p class="af-dim">On the host it runs as a process of the machine, on a runner whose engine is host: its footprint is its process tree's.</p>`}`}
    <div><div class="label-row"><label class="field-label" for="w${i}">Weight</label><span class="mono" style="font-size:12px;color:#e4e5e7" id="wv${i}">${v.weight}%</span></div>
      <input type="range" id="w${i}" min="0" max="100" step="1" value="${v.weight}" data-w="${i}" ${S.state === "promoted" ? "disabled" : ""} style="width:100%;accent-color:${COLORS[i]}" aria-label="Variant ${KEYS[i]}'s weight"></div>
  </div>`;
}
function weightsLine() {
  const sum = S.variants.reduce((a, v) => a + v.weight, 0);
  return `Weights ${S.variants.map((v, i) => `${KEYS[i]} ${v.weight}%`).join(" · ")}, ${sum}% in all: moving one moves the others, in proportion, so they always add up to 100. A variant at 0% takes no new sessions.`;
}
function setWeight(i, w) {
  const others = S.variants.map((_, j) => j).filter((j) => j !== i);
  const rest = 100 - w, was = others.reduce((a, j) => a + S.variants[j].weight, 0);
  S.variants[i].weight = w;
  let given = 0;
  others.forEach((j, k) => {
    const share = k === others.length - 1 ? rest - given : Math.round(was ? (S.variants[j].weight / was) * rest : rest / others.length);
    S.variants[j].weight = Math.max(0, share); given += S.variants[j].weight;
  });
}

function results() {
  const rows = MEASURES.map((m) => ({ m, st: stats(m) })).filter(({ st }) => st.some(Boolean));
  const vs = rows.map(({ m, st }) => verdict(m, st));
  const clear = vs.filter((v) => v.w !== null);
  const by = S.variants.map((_, i) => clear.filter((v) => v.w === i).length);
  return `<div class="label-row hair"><div class="label">Results, from these sessions</div><button class="btn btn-ghost btn-xs" data-act="table">${S.table ? "Show as intervals" : "Show as a table"}</button></div>
    <p class="eng-line">Clear on ${clear.length} of ${rows.length} measures${clear.length ? `: ${by.map((n, i) => (n ? `${n} for ${KEYS[i]}` : "")).filter(Boolean).join(", ")}` : ""}. ${S.state === "live" ? "The intervals narrow as sessions come." : ""}</p>
    ${S.table ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Measure</th>${S.variants.map((_, i) => `<th class="num">${KEYS[i]}: median (95%)</th>`).join("")}<th class="hidden sm:table-cell">Clear?</th></tr></thead><tbody>${rows.map(({ m, st }, j) => `<tr><td style="font-size:12.5px">${m.m}<span class="cell-sub">${m.unit}</span></td>${st.map((x) => `<td class="num cell-mono">${x ? `${fmt(x.ci[1], m.unit)} (${fmt(x.ci[0], m.unit)}–${fmt(x.ci[2], m.unit)})<span class="cell-sub">n = ${x.n}</span>` : "—"}</td>`).join("")}<td class="hidden sm:table-cell" style="font-size:12px">${vs[j].w !== null ? `<span class="ok">${KEYS[vs[j].w]}</span>` : "no"}</td></tr>`).join("")}</tbody></table></div>`
    : rows.map(({ m, st }, j) => measure(m, st, vs[j])).join("")}
    <p class="af-dim">Each interval is 95%: of the median for times, footprints and CPU (from the sessions' own order statistics), and Wilson's for rates. A measure names a winner only where its interval clears every other variant's. Failed starts count as failures and nowhere else.</p>
    <div class="label hair">Decide</div>
    ${S.state === "promoted" ? `<p class="said" data-tone="ok">Promoted ${KEYS[S.promoted]}, by you, just now.</p>`
      : S.asking !== null ? `<div class="confirm" role="group" aria-label="Confirm promoting"><p>Promote <b>${KEYS[S.asking]}</b>? ${esc(targetLabel())} starts on ${esc(vLabel(S.variants[S.asking]))} from now on${S.target.kind === "agent" ? ", as its definition's next version" : ""}, and the split ends. Sessions running on the other variants go on as they are.</p><div class="confirm-actions"><button class="btn btn-primary btn-xs" data-act="promote">Promote ${KEYS[S.asking]}</button><button class="btn btn-ghost btn-xs" data-act="noask">Keep the split</button></div></div>`
      : `<div class="row">${S.variants.map((v, i) => `<button class="btn btn-secondary btn-xs" data-act="ask" data-i="${i}" ${v.current ? "disabled" : ""}>${key(i)} Promote ${KEYS[i]}</button>`).join("")}<span class="dim" style="font-size:12px">Nothing changes until you press one.</span></div>`}`;
}
function measure(m, st, v) {
  const have = st.filter(Boolean);
  const lo = Math.min(...have.map((x) => x.ci[0])), hi = Math.max(...have.map((x) => x.ci[2]));
  const pad = (hi - lo) * 0.15 || 1, a0 = Math.max(0, lo - pad), a1 = hi + pad, pos = (x) => ((x - a0) / (a1 - a0)) * 100;
  return `<div class="ex-measure"><div class="ex-measure-head"><h3>${m.m}</h3><span class="dim mono" style="font-size:10.5px">${m.unit}, ${m.better} is better</span><span class="ex-verdict right" ${v.w !== null ? 'data-tone="win"' : ""}>${v.w !== null ? "✓ " : ""}${v.t}</span></div>
    ${st.map((x, i) => x ? `<div class="ex-ci" title="Variant ${KEYS[i]}: ${fmt(x.ci[1], m.unit)}, 95% interval ${fmt(x.ci[0], m.unit)} to ${fmt(x.ci[2], m.unit)}, n = ${x.n}">${key(i)}<div class="ex-ci-track"><span class="ex-ci-bar" style="left:${pos(x.ci[0])}%;width:${Math.max(1, pos(x.ci[2]) - pos(x.ci[0]))}%;background:${COLORS[i]}"></span><span class="ex-ci-mid" style="left:calc(${pos(x.ci[1])}% - 1px);background:${COLORS[i]}"></span></div><span class="ex-ci-val">${m.rate ? `${x.k} of ${x.n}` : `${fmt(x.ci[1], m.unit)} (${fmt(x.ci[0], m.unit)}–${fmt(x.ci[2], m.unit)})`}<span class="cell-sub" style="display:inline;margin-left:6px">n ${x.n}</span></span></div>` : `<div class="ex-ci">${key(i)}<span class="dim" style="font-size:11.5px">no sessions of this kind</span><span></span></div>`).join("")}
    <div class="ex-axis"><span>${fmt(a0, m.unit)}</span><span>${fmt(a1, m.unit)}</span></div></div>`;
}

/* ------------------------------------------------------------ replay (offline) */
const RECORDED = [["s1", "reviewer · hyper-light/kiln · 12 min ago · 214 tool calls (Read 120, Bash 61, Edit 33)"], ["s2", "reviewer · hyper-light/shards · yesterday · 88 tool calls (Read 51, Bash 30, Edit 7)"], ["s3", "pr-triage · hyper-light/kiln · 2 days ago · 19 tool calls"]];
const REPLAYED = [[[41.2, 43.0, 45.1], [27.6, 28.9, 30.4]], [[52.1, 54.3, 57.0], [55.0, 56.8, 59.2]], [[2.27, 2.33, 2.41], [2.96, 3.04, 3.12]], [[0, 0, 0], [0, 0, 0]]];
function replay() {
  const R = S.replay;
  return `<div class="stack mt-3">
    <p class="eng-line">Run a recorded session's tool calls again, in order, in each variant's microVM, against the project at the session's commit. The model isn't asked: what each call returned that the next one used is played back as recorded. It runs offline, beside the live split, and moves no one's sessions.</p>
    <div class="select-field"><label class="field-label" for="rs">Recorded session</label>${select("rs", RECORDED, R.session, 'data-r="session"')}</div>
    <div><div class="field-label">Against</div><div class="ag-checks">${S.variants.map((v, i) => `<label><input type="checkbox" class="check" data-rpick="${i}" ${R.picks.includes(i) ? "checked" : ""}> ${key(i)} <span class="mono" style="font-size:12px">${esc(vLabel(v))}</span></label>`).join("")}</div></div>
    <div class="grid3"><div><label class="field-label" for="rn">Times each</label><div class="field mono-in"><input id="rn" data-r="reps" value="${R.reps}" inputmode="numeric"></div></div></div>
    <div class="af-actions">${R.state === "running" ? `<div class="grow"><div class="ex-progress"><span style="width:${(R.done / (R.reps * R.picks.length)) * 100}%"></span></div><p class="af-dim mt-2">Replay ${R.done} of ${R.reps * R.picks.length} · interleaved</p></div>` : `<button class="btn btn-primary btn-sm" data-act="replay" ${R.picks.length < 1 ? "disabled" : ""}>Replay</button><span class="af-dim">${R.reps * R.picks.length} replays, interleaved; each boots its variant from cold.</span>`}</div>
    ${R.state === "done" ? `<div class="label hair">Last replay · 214 tool calls · 5 times each · 40 min ago</div>
      ${[["Replay time", "s", "lower"], ["Host CPU", "CPU·s", "lower"], ["Footprint: peak", "GiB", "lower"], ["Calls that went otherwise", "of 214", "lower"]].map(([n, u, b], j) => { const st = R.picks.slice(0, 2).map((i, k) => ({ ci: REPLAYED[j][k], n: 5 })); const v = j === 3 ? { w: null, t: "none: every call returned as recorded" } : verdict({ better: b, unit: u, id: "replay" }, st); return measure({ m: n, unit: u, better: b }, st, v); }).join("")}
      <p class="af-dim">B replays the session in two thirds of A's time: its four vCPUs run the session's cargo builds side by side.</p>` : ""}
  </div>`;
}

/* ------------------------------------------------------------ events */
let timer = null;
function tickOn() { clearInterval(timer); timer = setInterval(() => { if (S.state === "live" || S.state === "paused") { arrive(); if (S.tab === "split" && !document.activeElement?.matches?.("input[type=range]")) render(); } }, 1600); }
$("#page").addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]"); if (tab) { S.tab = tab.dataset.tab; render(); return; }
  const tk = e.target.closest("[data-tk] button"); if (tk) { S.target.kind = tk.dataset.v; render(); return; }
  const ve = e.target.closest("[data-veng] button"); if (ve) { S.variants[Number(ve.parentElement.dataset.veng)].engine = ve.dataset.v; render(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "new") { clearInterval(timer); Object.assign(S, { state: "draft", name: "reviewer-host", tab: "split", sessions: [], promoted: null, asking: null, variants: [{ agentfile: "rust-dev", engine: "microvm", cpus: "4", mem: "8", weight: 80, current: true }, { agentfile: "rust-dev", engine: "host", cpus: "4", mem: "8", weight: 20 }] }); render(); return; }
  if (act === "addv") { S.variants.push({ ...S.variants[S.variants.length - 1], current: false, weight: 0 }); render(); return; }
  if (act === "rmv") { const w = S.variants[Number(b.dataset.i)].weight; S.variants.splice(Number(b.dataset.i), 1); S.variants[0].weight += w; render(); return; }
  if (act === "start") { press(b, 600, () => { S.state = "live"; S.started = "just now"; tickOn(); render(); }); return; }
  if (act === "pause") { press(b, 500, () => { S.state = "paused"; render(); }); return; }
  if (act === "resume") { press(b, 500, () => { S.state = "live"; render(); }); return; }
  if (act === "table") { S.table = !S.table; render(); return; }
  if (act === "ask") { S.asking = Number(b.dataset.i); render(); return; }
  if (act === "noask") { S.asking = null; render(); return; }
  if (act === "promote") { press(b, 700, () => { S.promoted = S.asking; S.asking = null; S.state = "promoted"; clearInterval(timer); render(); }); return; }
  if (act === "replay") { press(b, 400, () => { const R = S.replay; R.state = "running"; R.done = 0; render(); const t = setInterval(() => { R.done++; if (R.done >= R.reps * R.picks.length) { clearInterval(t); R.state = "done"; } if (S.tab === "replay") render(); }, 350); }); return; }
});
$("#page").addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.w !== undefined) { setWeight(Number(t.dataset.w), Number(t.value)); S.variants.forEach((v, i) => { const el = $(`#w${i}`), lab = $(`#wv${i}`); if (el && i !== Number(t.dataset.w)) el.value = v.weight; if (lab) lab.textContent = v.weight + "%"; }); const line = t.closest(".stack").querySelector(".ex-arms + p"); if (line) line.innerHTML = weightsLine(); return; }
});
$("#page").addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.w !== undefined) { render(); return; }
  if (t.dataset.t) { S.target[t.dataset.t] = t.value; render(); return; }
  const card = t.closest("[data-var]"); if (card && t.dataset.vk) { S.variants[Number(card.dataset.var)][t.dataset.vk] = t.value; render(); return; }
  if (t.dataset.rpick !== undefined) { const i = Number(t.dataset.rpick), p = S.replay.picks; t.checked ? p.push(i) : p.splice(p.indexOf(i), 1); p.sort(); render(); return; }
  if (t.dataset.r) { S.replay[t.dataset.r] = t.dataset.r === "reps" ? Math.max(1, Math.min(20, parseInt(t.value, 10) || 5)) : t.value; render(); }
});
render(); tickOn();
</script>
</body>
</html>
