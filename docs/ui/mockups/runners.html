</head>
<body>
<div class="container-console v3 page3" id="page"></div>
<script src="assets/mockup.js"></script>
<script>
/* ------------------------------------------------------------ sample data */
const W = (b, s, seed) => walk(60, b, s, seed);
const R = [
  { id: "e301", name: "adas-macbook-pro-2.local", host: "Adas-MacBook-Pro-2.local", plat: "macos/aarch64", engine: "microvm", can: true, hv: "HVF", cores: 18, memG: 128, cpu: W(26, 8, 3), mem: 25, disk: 58, net: 0.4, starts: [9, 2, 1], vcpu: [2, 18],
    vms: [{ id: "v1", agent: "release-notes", proj: "hyper-light/hex", image: "docs-site v3", start: ["template", 431], up: "41m", state: "idle", cpu: W(4, 3, 11), mem: [1.1, 4], disk: [0.4, 8] }], pools: [], images: [["rust-dev", "rust-dev v8", 1.42, "4m", "ok"], ["harness-claude", "kiln's", 0.61, "2d", "ok"]] },
  { id: "cec3", name: "adas-mac-studio.local", host: "Adas-Mac-Studio-3.local", plat: "macos/aarch64", engine: "microvm", can: true, hv: "HVF", cores: 14, memG: 36, cpu: W(12, 6, 5), mem: 41, disk: 61, net: 1.2, starts: [31, 9, 4], vcpu: [5, 14], override: ["hyper-light/kiln", "host"],
    vms: [{ id: "v2", agent: "reviewer", proj: "hyper-light/kiln", image: "rust-dev v8", start: ["warm", 212], up: "6m", state: "run", cpu: W(38, 18, 7), mem: [2.3, 4], disk: [1.1, 8] }],
    pools: [{ agent: "reviewer", size: "2 vCPU · 4 GiB", warm: 1, of: 2, hits: [7, 9], idle: "1m" }], images: [["rust-dev", "rust-dev v8", 1.42, "4m", "ok"], ["harness-claude", "kiln's", 0.61, "2d", "ok"], ["harness-codex", "kiln's", 0.59, "2d", "ok"]] },
  { id: "b24c", name: "adas-mac-studio-2.local", host: "Adas-Mac-Studio-2.local", plat: "macos/aarch64", engine: "host", can: false, hv: null, why: "HVF denied", whyFull: "Hypervisor.framework refused the VM process (HV_DENIED): shards-vm isn't signed with com.apple.security.hypervisor", cores: 14, memG: 36, cpu: W(13, 5, 9), mem: 21, disk: 74, net: 0.1, starts: [0, 0, 0], vcpu: [0, 14], vms: [], pools: [], images: [] },
  { id: "2768", name: "adas-mac-studio-3.local", host: "Adas-Mac-Studio-4.local", plat: "macos/aarch64", engine: "microvm", can: true, hv: "HVF", cores: 14, memG: 36, cpu: W(29, 10, 13), mem: 74, disk: 66, net: 3.4, starts: [64, 12, 6], vcpu: [9, 14],
    vms: [
      { id: "v3", agent: "reviewer", proj: "hyper-light/kiln", image: "rust-dev v8", start: ["warm", 221], up: "40s", state: "run", cpu: W(62, 20, 17), mem: [3.1, 4], disk: [1.4, 8] },
      { id: "v4", agent: "ci-diagnose", proj: "hyper-light/shards", image: "harness-claude", start: ["warm", 198], up: "2m", state: "idle", cpu: W(6, 4, 19), mem: [1.4, 2], disk: [0.3, 8] },
      { id: "v5", agent: "pr-triage", proj: "hyper-light/kiln", image: "rust-dev v8", start: ["template", 455], up: "18m", state: "paused", cpu: W(1, 1, 23), mem: [1.9, 2], disk: [0.6, 8] },
    ],
    pools: [{ agent: "reviewer", size: "2 vCPU · 4 GiB", warm: 2, of: 3, hits: [41, 47], idle: "40s" }, { agent: "ci-diagnose", size: "2 vCPU · 2 GiB", warm: 1, of: 1, hits: [9, 12], idle: "2m" }, { agent: "pr-triage", size: "1 vCPU · 2 GiB", warm: 0, of: 1, hits: [0, 1], idle: "31m", leaving: true }],
    images: [["rust-dev", "rust-dev v8", 1.42, "4m", "ok"], ["rust-dev", "rust-dev v9", 1.44, "now", "start"], ["harness-claude", "kiln's", 0.61, "2d", "ok"], ["harness-codex", "kiln's", 0.59, "2d", "ok"]] },
  { id: "d132", name: "adas-mac-studio.local-2", host: "Adas-Mac-Studio.local", plat: "macos/aarch64", engine: "microvm", can: true, hv: "HVF", cores: 32, memG: 96, cpu: W(10, 4, 29), mem: 34, disk: 22, net: 0.2, starts: [3, 1, 2], vcpu: [0, 32], vms: [], pools: [], images: [["harness-claude", "kiln's", 0.61, "2d", "ok"]] },
  { id: "4513", name: "adacachy", host: "adacachy", plat: "linux/x86_64", engine: "host", can: true, hv: "KVM", owner: true, cores: 32, memG: 123, cpu: W(15, 8, 31), mem: 27, disk: 93, net: 6.1, starts: [0, 0, 0], vcpu: [0, 32], vms: [], pools: [], images: [] },
  { id: "00aa", name: "adacachy2", host: "adacachy2", plat: "linux/x86_64", engine: "microvm", can: true, hv: "KVM", cores: 32, memG: 123, cpu: W(5, 4, 37), mem: 37, disk: 81, net: 2.2, starts: [22, 6, 3], vcpu: [6, 32],
    vms: [
      { id: "v6", agent: "opus-kiln-12", proj: "hyper-light/kiln", image: "harness-codex", start: ["cold", 1912], up: "14m", state: "run", cpu: W(44, 16, 41), mem: [2.8, 4], disk: [2.2, 8] },
      { id: "v7", agent: "pr-triage", proj: "hyper-light/hex", image: "rust-dev v8", start: ["warm", 205], up: "3m", state: "failed", cpu: W(2, 2, 43), mem: [2.0, 2], disk: [0.5, 8] },
    ],
    pools: [{ agent: "reviewer", size: "2 vCPU · 4 GiB", warm: 1, of: 2, hits: [12, 15], idle: "5m" }], images: [["rust-dev", "rust-dev v8", 1.42, "6m", "ok"], ["rust-dev", "rust-dev v9", 0, "now", "failed"], ["harness-codex", "kiln's", 0.59, "2d", "ok"]] },
];
const S = { open: OPEN.get() || "2768", owner: true, asking: null, ending: null, moving: {}, vmCharts: new Set(), nodeCharts: false, building: false };
const vmState = (v, r) => (S.moving[r.id] && r.engine === "microvm" && v.state !== "stopped" ? "drain" : v.state);
const last = (a) => a[a.length - 1];

/* ------------------------------------------------------------ the fleet */
/** Every table on this page shares one grid: the name, then six slots, then the controls. Like content lines up: name, then kind, then CPU. */
const GRID = (heads, tips = {}) => [{ h: heads[0], name: true }, { h: narrow() ? "" : heads[1], w: narrow() ? 36 : 104, tip: tips[1] }, { h: heads[2], w: 116, c: "h640", tip: tips[2] }, { h: heads[3], w: narrow() ? 52 : 100 }, { h: heads[4], w: 112, c: "h900" }, { h: heads[5], w: 96, c: "h1100" }, { h: heads[6], w: 72, c: "h900" }, { h: "", w: narrow() ? 92 : 154 }];
const START_TIP3 = "Flame: warm · layers: from template · snowflake: cold";
const FLEET = () => GRID(["Runner", "Engine", "VMs", "CPU", "Memory", "Disk", "Warm"]);
function engineCell(r) {
  const m = S.moving[r.id];
  if (m) return `<span class="cr">${st("drain", "Switching: draining")}${icon(m.to, ENGINE_TIP[m.to])}<span class="ell h640">${m.to}</span></span>`;
  if (narrow()) return `<span class="cr"><span class="badge3">${icon(r.engine, ENGINE_TIP[r.engine])}${!r.can ? st("off", r.why) : ""}</span></span>`;
  return `<span class="cr">${icon(r.engine, ENGINE_TIP[r.engine])}<span class="ell">${r.engine}</span>${!r.can ? st("off", r.why) : ""}</span>`;
}
/** One glyph per VM, in its state: the count at a glance. */
function vmMix(r) { return `<span class="gl">${r.vms.map((v) => st(vmState(v, r), `${v.agent} · ${STATES[vmState(v, r)][1]}`)).join("")}</span>`; }
function fleetRow(r) {
  const open = S.open === r.id;
  const memPct = r.mem, warm = r.pools.reduce((a, p) => a + p.warm, 0), of = r.pools.reduce((a, p) => a + p.of, 0);
  return `<tr class="pick" tabindex="0" data-r="${r.id}" aria-expanded="${open}" aria-selected="${open}">${td3(FLEET(), [
    named(r.draining ? "drain" : "ok", r.name, "", r.draining ? "Draining" : `Connected · ${r.host} · ${r.plat} · kiln 0.9.41`),
    engineCell(r),
    r.vms.length ? vmMix(r) : `<span class="dim">0</span>`,
    spark(r.cpu, `${Math.round(last(r.cpu))}%`, "#3987e5", narrow() ? 0 : 40, 16, `rc:${r.id}`),
    ubar(memPct, `${memPct}%`, 36),
    ubar(r.disk, `${r.disk}%`, 36),
    of ? wdots(warm, of) : `<span class="dim">0</span>`,
    `<span class="acts ctl">${ib(r.draining ? "play" : "pause", r.draining ? "Resume" : "Drain", `data-do="${r.draining ? "resume" : "drain"}" data-r="${r.id}"`)}${narrow() ? "" : ib("terminal", "Terminal")}${ib("more", "More", `data-do="rmore" data-r="${r.id}"`)}</span>`,
  ])}</tr>${open ? `<tr><td class="detail" colspan="${shown(FLEET())}">${detail(r)}</td></tr>` : ""}`;
}

/* ------------------------------------------------------------ one runner, in place */
const VMCOLS = () => GRID(["Agent", "Start", "Image", "CPU", "Memory", "Disk", "Up"], { 1: START_TIP3 });
const POOLCOLS = () => GRID(["Agent", "Warm", "Size", "Hits", "Idle", "", ""]);
const IMGCOLS = () => GRID(["Image", "Size", "From", "Age", "", "", ""]);
function detail(r) {
  const m = S.moving[r.id];
  const want = m ? m.to : r.engine;
  const other = r.engine === "microvm" ? "host" : "microvm";
  const checks = r.can
    ? [["microVM", "ok", "virt.microvm: true"], ["Isolation", "ok", `isolation.available: true · ${r.hv}`], ["Host check", "ok", `Shards host_check: usable · ${r.hv} · 2m ago`], ["Image class", r.engine === "microvm" ? "ok" : "idle", "Hex node: shards-image"]]
    : [["microVM", "failed", "virt.microvm: false"], ["Isolation", "failed", `isolation.why_not: ${r.whyFull}`], ["Host check", "failed", "Shards host_check: not usable · HV_DENIED · 4m ago"], ["Image class", "off", "Hex node: no shards-image"]];
  let fr = "";
  if (S.forget === r.id) fr = `<div class="fr">${st("warn")}<span class="lbl hi">Forget ${esc(r.name)}?</span><span class="acts">${ib("check", "Forget", `data-do="forget" data-r="${r.id}"`)}${ib("x", "Keep", 'data-do="noforget"')}</span></div>`;
  else if (S.asking === r.id) fr = `<div class="fr">${st("warn")}<span class="lbl hi">Switch to ${other}?</span><span class="val dim">${r.vms.length ? `${r.vms.length} VM${r.vms.length > 1 ? "s" : ""} drain` : "nothing running"}</span><span class="acts"><button class="b3 p" data-do="switch" data-r="${r.id}">Switch</button><button class="b3 g" data-do="noswitch">Cancel</button></span></div>`;
  else if (m && S.ending === r.id) fr = `<div class="fr">${st("warn")}<span class="lbl hi">End ${m.left.length} session${m.left.length > 1 ? "s" : ""}?</span><span class="val dim">conversations kept</span><span class="acts"><button class="b3 d" data-do="endnow" data-r="${r.id}">End</button><button class="b3 g" data-do="noend">Back</button></span></div>`;
  else if (m) fr = `<div class="fr">${st("drain")}<span class="lbl hi">Draining</span><span class="val dim">${m.left.length} left</span><span class="acts"><button class="b3 d" data-do="askend" data-r="${r.id}">End now</button><button class="b3 g" data-do="cancel" data-r="${r.id}">Cancel</button></span></div>`;
  const used = r.vms.filter((v) => v.state !== "stopped").reduce((a, v) => a + v.mem[1], 0) + r.pools.reduce((a, p) => a + p.warm * parseInt(p.size.split("·")[1]), 0);
  const room = r.engine === "microvm" ? Math.round((used / r.memG) * 100) : 0;
  const tot = r.starts.reduce((a, b) => a + b, 0);
  const warm = r.pools.reduce((a, p) => a + p.warm, 0), of = r.pools.reduce((a, p) => a + p.of, 0);
  return `<div class="ch wrap3">
      <span class="seg-w">${S.owner ? "" : icon("lock", "Needs runners.manage")}<span class="sg3" role="group" aria-label="Engine">${["microvm", "host"].map((e) => `<button data-do="engine" data-e="${e}" data-r="${r.id}" aria-pressed="${want === e}" ${!S.owner || m || (e === "microvm" && !r.can) ? "disabled" : ""} title="${e === "microvm" && !r.can ? esc(r.why) : ENGINE_TIP[e]}">${icon(e)}${e}</button>`).join("")}</span></span>
      <span class="checks3">${checks.map(([l, s, tip]) => `<span title="${esc(tip)}">${st(s, tip)}<span class="lbl">${l}</span></span>`).join("")}</span>
      <span class="acts"><span class="kv3 h640" title="Workspace default · Settings → Runners"><span class="lbl">Default</span><span class="val">microvm</span></span>${r.override ? `<span class="kv3 h1100" title="${esc(`${r.override[0]} asks for ${r.override[1]}`)}">${st("warn", "Project override")}<span class="val">kiln → ${r.override[1]}</span></span>` : ""}</span>
    </div>${fr}
    <div class="sum3 body3">
      <div><span class="lbl">Memory</span><span class="v">${ubar(room, `${used.toFixed(1)}/${r.memG}G`, 56)}</span></div>
      <div><span class="lbl">vCPUs</span><span class="v">${ubar((r.vcpu[0] / r.vcpu[1]) * 100, `${r.vcpu[0]}/${r.vcpu[1]}`, 56)}</span></div>
      <div><span class="lbl">Disk</span><span class="v">${ubar(r.disk, `${r.disk}%`, 56)}</span></div>
      <div><span class="lbl">Network</span><span class="v">${spark(W(r.net, r.net / 2 + 0.2, 51), `${r.net} MB/s`, "#3987e5", 56)}</span></div>
      <div><span class="lbl" title="${START_TIP3}">Starts</span><span class="v">${tot ? starts3(...r.starts) : `<span class="dim">0</span>`}</span></div>
      <div><span class="lbl">Warm</span><span class="v">${of ? wdots(warm, of) : `<span class="dim">0</span>`}</span></div>
    </div>
    <div class="sh"><button class="lbl hi kv3" data-do="nodecharts" aria-expanded="${S.nodeCharts}">${icon("chart")}Telemetry${icon("chev")}</button></div>
    ${S.nodeCharts ? `<div class="charts3">${chart("CPU", [{ name: "CPU", color: "#3987e5", values: r.cpu }], "%")}${chart("Memory", [{ name: "Used", color: "#3987e5", values: W(used, 1.2, 61) }], "G")}${chart("Network", [{ name: "In", color: "#3987e5", values: W(r.net, 0.8, 63) }, { name: "Out", color: "#d95926", values: W(r.net / 2, 0.5, 67) }], "MB/s")}${chart("Start", [{ name: "Warm", color: START_COLORS.warm, values: W(215, 14, 71) }, { name: "Template", color: START_COLORS.template, values: W(440, 30, 73) }], "ms")}</div>` : ""}
    ${r.vms.length ? `<div class="sh"><span class="lbl hi">MicroVMs</span><span class="val dim">${r.vms.length}</span></div>` : ""}
    ${r.vms.length ? `<table class="t3">${th3(VMCOLS())}<tbody>${r.vms.map((v) => vmRow(v, r)).join("")}</tbody></table>` : ""}
    ${r.pools.length ? `<div class="sh"><span class="lbl hi">Pools</span><span class="val dim">${r.pools.length}</span></div>` : ""}
    ${r.pools.length ? `<table class="t3">${th3(POOLCOLS())}<tbody>${r.pools.map((p, i) => `<tr>${td3(POOLCOLS(), [named(p.leaving ? "warn" : "ok", p.agent, `data-peek="agent:${esc(p.agent)}"`, p.leaving ? "Releasing soon" : "Kept"), wdots(p.warm, p.of), `<span class="ell" title="${esc(p.size)}">${esc(p.size.replace(" vCPU · ", "c · ").replace(" GiB", "G"))}</span>`, ubar((p.hits[0] / p.hits[1]) * 100, `${Math.round((p.hits[0] / p.hits[1]) * 100)}%`, 44, "#3987e5"), `<span class="${p.leaving ? "" : "dim"}">${p.idle}</span>`, "", "", `<span class="acts ctl">${ib("x", "Release", `data-do="release" data-r="${r.id}" data-i="${i}" data-tone="danger" data-confirm="Release?"`)}</span>`])}</tr>`).join("")}</tbody></table>` : ""}
    ${r.images.length ? `<div class="sh"><span class="lbl hi">Images</span><span class="val dim">${r.images.length}</span><span class="acts">${r.can ? `<button class="b3" data-do="build" aria-expanded="${S.building}">${icon("build")}Build image</button>` : ""}</span></div>` : r.can ? `<div class="sh"><button class="b3" data-do="build" aria-expanded="${S.building}">${icon("build")}Build image</button></div>` : ""}
    ${S.building && r.can ? `<div class="fr">${sel([["rust-dev", "rust-dev v9"], ["docs-site", "docs-site v3"], ["harness-claude", "harness-claude"]], "rust-dev", 'id="bfrom" aria-label="Agentfile"')}<span class="val dim">${r.plat.startsWith("linux/x86") ? "linux/amd64" : "linux/arm64"}</span><span class="acts"><button class="b3 p" data-do="dobuild" data-r="${r.id}">Build</button><button class="b3 g" data-do="build">Cancel</button></span></div>` : ""}
    ${r.images.length ? `<table class="t3">${th3(IMGCOLS())}<tbody>${r.images.map(([n, from, size, age, s], i) => `<tr>${td3(IMGCOLS(), [named(s === "start" ? "start" : s, n, "", s === "start" ? "Building" : s === "failed" ? "Failed: checksum mismatch, line 13" : "Built"), size ? ubar((size / 1.5) * 100, narrow() ? "" : `${size.toFixed(2)}G`, narrow() ? 28 : 44, "#3987e5") : `<span class="dim">—</span>`, `<span class="ell">${esc(from)}</span>`, `<span class="dim">${age}</span>`, "", "", "", `<span class="acts ctl">${ib("restart", "Build again", `data-do="rebuild" data-r="${r.id}" data-i="${i}"`)}${ib("trash", "Remove", `data-do="rmimg" data-r="${r.id}" data-i="${i}" data-tone="danger" data-confirm="Remove?"`)}</span>`])}</tr>`).join("")}</tbody></table>` : ""}`;
}
function vmRow(v, r) {
  const s = vmState(v, r);
  const charts = S.vmCharts.has(v.id);
  return `<tr tabindex="0" data-vm="${v.id}" data-r="${r.id}">${td3(VMCOLS(), [
    named(s, v.agent, `data-peek="vm:${v.id}"`, `${STATES[s][1]} · ${v.proj}`),
    `<span class="cr">${startIcon(v.start[0])}<span class="h640">${v.start[1] >= 1000 ? (v.start[1] / 1000).toFixed(1) + "s" : v.start[1] + "ms"}</span></span>`,
    `<span class="cr"><span class="ell mid" data-full="${esc(v.image)}" title="${esc(v.image)}">${esc(v.image)}</span></span>`,
    spark(v.cpu, s === "paused" || s === "stopped" ? "0%" : `${Math.round(last(v.cpu))}%`, "#3987e5", 36, 16, `vc:${v.id}`),
    ubar((v.mem[0] / v.mem[1]) * 100, `${v.mem[0]}/${v.mem[1]}G`, 36),
    ubar((v.disk[0] / v.disk[1]) * 100, `${v.disk[0]}G`, 36),
    `<span class="dim">${v.up}</span>`,
    `<span class="acts ctl">${ib("play", "Resume (P)", `data-do="vm-play" data-vm="${v.id}" ${["paused", "stopped", "failed"].includes(v.state) ? "" : "disabled"}`)}${ib("pause", "Pause (P)", `data-do="vm-pause" data-vm="${v.id}" ${["run", "idle"].includes(v.state) ? "" : "disabled"}`)}${ib("restart", "Restart (R)", `data-do="vm-restart" data-vm="${v.id}"`)}${ib("stop", "Stop (S)", `data-do="vm-stop" data-vm="${v.id}" data-tone="danger" data-confirm="Stop?" ${v.state === "stopped" ? "disabled" : ""}`)}${ib("chart", "Telemetry (T)", `data-do="vm-charts" data-vm="${v.id}" aria-expanded="${charts}"`)}</span>`,
  ])}</tr>${charts ? `<tr><td class="detail" colspan="${shown(VMCOLS())}"><div class="charts3">${chart("CPU", [{ name: "CPU", color: "#3987e5", values: v.cpu }], "%")}${chart("Memory", [{ name: "Used", color: "#3987e5", values: W(v.mem[0], 0.3, 81) }], "G")}${chart("Network", [{ name: "In", color: "#3987e5", values: W(0.6, 0.4, 83) }, { name: "Out", color: "#d95926", values: W(0.3, 0.3, 87) }], "MB/s")}</div></td></tr>` : ""}`;
}

/* ------------------------------------------------------------ render, act */
function render() {
  const mv = R.filter((r) => r.engine === "microvm").length, vms = R.reduce((a, r) => a + r.vms.length, 0);
  mockChip(`<span class="sg3" role="group" aria-label="View as">${[["owner", "Owner"], ["viewer", "Viewer"]].map(([v, l]) => `<button data-do="as" data-v="${v}" aria-pressed="${S.owner === (v === "owner")}">${l}</button>`).join("")}</span>`);
  $("#page").innerHTML = `${mockBar("runners")}
    <div class="title3"><h1>Fleet</h1><span class="right"><span class="kv3">${blocks(mv, R.length, "#3987e5", `${mv} of ${R.length} runners run microVMs; ${R.length - mv} run on the host`)}<span class="val">${mv}/${R.length}</span><span class="lbl">microVM</span></span><span class="kv3"><span class="val">${vms}</span><span class="lbl">VMs</span></span></span></div>
    <div class="card3">
      <table class="t3">${th3(FLEET())}<tbody>${R.map(fleetRow).join("")}</tbody></table></div>`;
  liveScan(); fitMiddle();
}
liveStream(2000, () => { R.forEach((r) => { r.cpu.push(Math.max(1, Math.min(99, last(r.cpu) + (Math.random() - 0.5) * 8))); r.cpu.shift(); r.vms.forEach((v) => { if (v.state === "run" || v.state === "idle") { v.cpu.push(Math.max(0, Math.min(99, last(v.cpu) + (Math.random() - 0.5) * 10))); v.cpu.shift(); } }); }); },
  (k) => { const [kind, id] = k.split(":"); if (kind === "rc") { const r = R.find((x) => x.id === id); return r && spark(r.cpu, `${Math.round(last(r.cpu))}%`, "#3987e5", narrow() ? 0 : 40, 16, k); } const [v] = VM(id); return v && spark(v.cpu, ["paused", "stopped"].includes(v.state) ? "0%" : `${Math.round(last(v.cpu))}%`, "#3987e5", 36, 16, k); });
onBand(() => render());
onOpenChange((id) => { S.open = id; render(); });
const VM = (id) => { for (const r of R) { const v = r.vms.find((x) => x.id === id); if (v) return [v, r]; } return [null, null]; };
function vmDo(id, what, el) {
  const [v, r] = VM(id); if (!v) return;
  const next = { "vm-play": "run", "vm-pause": "paused", "vm-restart": "start", "vm-stop": "stopped", play: "run", pause: "paused", restart: "start", stop: "stopped" }[what];
  if (!next) return;
  const was = v.state;
  press(el, 450, () => { v.state = next; if (next === "paused") toast(`Paused ${v.agent}`, () => { v.state = was; render(); }); if (next === "start") setTimeout(() => { v.state = "run"; v.up = "0s"; render(); }, 1100); render(); const at = $(`[data-peek="vm:${id}"]`); if ($("#peek3") && at) peekAt(at); else $("#peek3")?.remove(); });
}
function switchTo(r, to) {
  if (!r.vms.filter((v) => v.state !== "stopped").length) { r.engine = to; if (to === "host") r.pools = []; render(); return; }
  S.moving[r.id] = { to, left: r.vms.filter((v) => v.state !== "stopped").map((v) => v.id) }; render();
  const tick = () => { const m = S.moving[r.id]; if (!m) return; const id = m.left.shift(); const v = r.vms.find((x) => x.id === id); if (v) v.state = "stopped"; if (!m.left.length) { delete S.moving[r.id]; r.engine = to; if (to === "host") r.pools = []; r.vms = r.vms.filter((x) => x.state !== "stopped"); } render(); if (S.moving[r.id]) setTimeout(tick, 9000); };
  setTimeout(tick, 9000);
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-do]");
  const row = e.target.closest("tr.pick");
  if (!b && row && !e.target.closest("button,a,input,select,[data-peek]")) { S.asking = null; S.open = S.open === row.dataset.r ? null : row.dataset.r; setOpen(S.open, render); return; }
  if (!b || b.closest("#peek3")) return;
  const d = b.dataset.do, r = R.find((x) => x.id === b.dataset.r);
  if (d === "as") { S.owner = b.dataset.v === "owner"; S.asking = null; render(); return; }
  if (d === "engine") { if (b.dataset.e !== r.engine) { S.asking = r.id; render(); } return; }
  if (d === "noswitch") { S.asking = null; render(); return; }
  if (d === "switch") { press(b, 500, () => { S.asking = null; switchTo(r, r.engine === "microvm" ? "host" : "microvm"); }); return; }
  if (d === "askend") { S.ending = r.id; render(); return; }
  if (d === "noend") { S.ending = null; render(); return; }
  if (d === "cancel") { delete S.moving[r.id]; r.vms.forEach((v) => { if (v.state === "drain") v.state = "run"; }); render(); return; }
  if (d === "endnow") { press(b, 600, () => { const m = S.moving[r.id]; delete S.moving[r.id]; S.ending = null; r.engine = m.to; r.vms = []; if (m.to === "host") r.pools = []; render(); }); return; }
  if (d === "drain" || d === "resume") { press(b, 400, () => { r.draining = d === "drain"; if (r.draining) toast(`Draining ${r.name}`, () => { r.draining = false; render(); }); render(); }); return; }
  if (d === "rmore") { menu(b, [{ icon: "terminal", label: "Terminal", run: () => {} }, { icon: "chart", label: "Insights", run: () => {} }, { icon: "trash", label: "Forget", danger: true, run: () => { S.forget = r.id; S.open = r.id; render(); } }]); return; }
  if (d === "forget") { press(b, 500, () => { R.splice(R.indexOf(r), 1); S.forget = null; S.open = null; setOpen(null, render); }); return; }
  if (d === "noforget") { S.forget = null; render(); return; }
  if (d === "nodecharts") { S.nodeCharts = !S.nodeCharts; render(); return; }
  if (d === "release") { press(b, 400, () => { r.pools.splice(Number(b.dataset.i), 1); render(); }); return; }
  if (d === "build") { S.building = !S.building; render(); return; }
  if (d === "dobuild") { press(b, 500, () => { S.building = false; r.images.unshift(["rust-dev", $("#bfrom").selectedOptions[0].textContent, 0, "now", "start"]); render(); setTimeout(() => { r.images[0][4] = "ok"; r.images[0][2] = 1.44; r.images[0][3] = "1m"; render(); }, 2600); }); return; }
  if (d === "rebuild") { press(b, 400, () => { const im = r.images[Number(b.dataset.i)]; im[4] = "start"; render(); setTimeout(() => { im[4] = "ok"; im[2] = im[2] || 1.44; im[3] = "now"; render(); }, 2200); }); return; }
  if (d === "rmimg") { press(b, 400, () => { r.images.splice(Number(b.dataset.i), 1); render(); }); return; }
  if (d === "vm-charts") { const id = b.dataset.vm; S.vmCharts.has(id) ? S.vmCharts.delete(id) : S.vmCharts.add(id); render(); return; }
  if (d.startsWith("vm-")) { vmDo(b.dataset.vm, d, b); return; }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.open && !$("#pal")?.open) { const id = S.open; S.open = null; setOpen(null, render); $(`tr.pick[data-r="${id}"]`)?.focus(); return; }
  const row = e.target.closest?.("tr[data-vm], tr.pick"); if (!row || e.metaKey || e.ctrlKey) return;
  if (row.matches("tr.pick") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); S.open = S.open === row.dataset.r ? null : row.dataset.r; setOpen(S.open, render); $(`tr.pick[data-r="${row.dataset.r}"]`)?.focus(); return; }
  if (!row.dataset.vm) return; const [v] = VM(row.dataset.vm); const k = e.key.toLowerCase();
  const map = { p: v.state === "paused" ? "vm-play" : "vm-pause", r: "vm-restart", s: "vm-stop", t: "vm-charts" };
  if (!map[k]) return; e.preventDefault();
  const btn = $(`[data-do="${map[k]}"][data-vm="${v.id}"]`, row); btn?.click();
});
/* Peek: an agent named on a VM or pool row, its status and controls, acting in place. */
peekHtml = (id) => {
  const [kind, x] = id.split(":");
  if (kind === "vm") { const [v, r] = VM(x); if (!v) return ""; const s = vmState(v, r); return `<div class="ch">${st(s)}<span class="name">${esc(v.agent)}</span><span class="val dim ell">${esc(v.proj)}</span></div><div class="sum3"><div><span class="lbl">CPU</span><span class="v">${spark(v.cpu, `${Math.round(last(v.cpu))}%`, "#3987e5", 40)}</span></div><div><span class="lbl">Memory</span><span class="v">${ubar((v.mem[0] / v.mem[1]) * 100, `${v.mem[0]}/${v.mem[1]}G`, 36)}</span></div><div><span class="lbl">Start</span><span class="v">${startIcon(v.start[0])}<span class="val">${v.start[1]}ms</span></span></div><div><span class="lbl">Up</span><span class="v val">${v.up}</span></div></div><div class="sh">${peekCtl(s === "drain" ? "run" : s, x)}<span class="acts">${ib("open", "Open chat")}</span></div>`; }
  if (kind === "agent") return `<div class="ch">${st("ok")}<span class="name">${esc(x)}</span><span class="val dim">claude · Opus 5.5</span></div><div class="sum3"><div><span class="lbl">Sessions</span><span class="v">${stack([{ v: 3, color: "#0ca30c", tip: "Running" }, { v: 1, color: "#a6b2c6", tip: "Paused" }], 40, "4")}</span></div><div><span class="lbl">Starts</span><span class="v">${spark(W(5, 3, 91), "47", "#3987e5", 40)}</span></div></div><div class="sh">${ib("play", "Run", 'data-do="run"')}<span class="acts">${ib("open", "Open in Agents")}</span></div>`;
  return "";
};
peekAct = (id, what, el) => { const [kind, x] = id.split(":"); if (kind === "vm" && (what === "play" || what === "pause")) vmDo(x, what, el); };
/* ⌘K: the page's own actions first, then everywhere's. */
paletteItems = () => fromOps([
  ["sessions.pause", "reviewer · adas-mac-studio-3.local", () => { const [v] = VM("v3"); v.state = "paused"; render(); }, "MicroVMs"],
  ["sessions.restart", "pr-triage · adacachy2", () => { const [v] = VM("v7"); v.state = "run"; render(); }, "MicroVMs"],
  ["runners.engine", "adas-mac-studio.local → host", () => { S.open = "cec3"; S.asking = "cec3"; setOpen("cec3", render); }, "Runners"],
  ["runners.drain", "adacachy2", () => { R.find((r) => r.id === "00aa").draining = true; render(); }, "Runners"],
  ["images.build", "rust-dev v9 · adacachy2", () => { S.building = true; S.open = "00aa"; setOpen("00aa", render); }, "Images"],
  ["agentdefs.run", "reviewer", () => { location.href = "agents.html?open=reviewer"; }, "Agents"],
  ["experiments.start", "pr-triage", () => { location.href = "agents.html?open=pr-triage"; }, "Agents"],
]);
render();
</script>
