<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rust-dev · Agentfiles · kiln mockup</title>
<link rel="stylesheet" href="assets/fonts.css" />
<link rel="stylesheet" href="assets/kiln.css" />
<link rel="stylesheet" href="assets/mockup.css" />
<style>
  /* The text, with its line numbers; a line Shards refuses is marked in the gutter as you type. */
  .ed3 { display: grid; grid-template-columns: auto minmax(0, 1fr); border-top: 1px solid var(--rule); }
  .gut3 { margin: 0; padding: 12px 8px 12px var(--edge); color: #4d5059; text-align: right; user-select: none; overflow: hidden; }
  .gut3 b { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-weight: 400; height: calc(var(--v) * var(--lh)); }
  .gut3 b[data-bad] { color: #fab219; }
  .ed3 .code3 { padding-left: 8px; min-height: 0; height: 640px; }
  @media (max-width: 1099px) { .ed3 .code3 { height: 420px; } }
</style>
</head>
<body>
<div class="container-console v3 page3" id="page"></div>
<script src="assets/mockup.js"></script>
<script>
/* ------------------------------------------------------------ the model the structure edits; the text is made from it and read back */
const BASE = "buildpack-deps:trixie-scm@sha256:4f34e1d673fdb65371de9f88bdd32c4e30152fe692b35604aef5c0b3c0e6da10";
const PINS = { claude: ["2.1.311", "2.1.298"], codex: ["0.68.0", "0.67.1"], devin: ["2026.11.11-b912975"], gemini: ["0.12.0"], opencode: ["1.5.7"], goose: ["1.59.0"], amp: ["0.167.2"], antigravity: ["1.5.2"], cursor: ["2.2.7"], pi: ["3000.12.43"] };
const GOOD = "9f2c55d0b7a1e3c48d26f0a9b1c7e5d3f8a2b6c4d0e9f1a3b5c7d9e1f3a5e41a";
let M = {
  other: ["RUN apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config"],
  harnesses: [
    { id: "claude", version: "2.1.311", source: { kind: "path", path: "./claude-2.1.311-${TARGETARCH}-gnu" }, model: "claude-opus-5-5", signin: "home", egress: [...harnessOf("claude").egress] },
    { id: "codex", version: "0.68.0", source: { kind: "https", url: "https://releases.example.dev/codex/0.68.0/codex-linux-${TARGETARCH}.tar.gz", sha256: GOOD, cred: "RELEASES_BEARER", redirects: [] }, model: "gpt-6.1-sol", signin: "home", egress: [...harnessOf("codex").egress] },
  ],
  agents: [{ name: "reviewer", harness: "claude", skills: ["kiln-ci-review", "rust-style", "no-panics"], mcp: [["github", "https://api.githubcopilot.com/mcp/"]], volumes: ["/home/agent/.cargo"], def: 4, sync: "ok" }, { name: "pr-triage", harness: "codex", skills: [], mcp: [], volumes: [], def: 2, sync: "differs" }],
};
let kept = structuredClone(M);
const S = { v: 8, open: OPEN.get() || "codex", hist: null, remote: { v: 9, line: "NETWORK … codex-out: + chatgpt.com" }, clash: false, name: "rust-dev", problems: [] };
const HIST = [[6, "reviewer's skills"], [7, "pr-triage added"], [8, "codex from a tarball"]];

function sourceLine(h) {
  const s = h.source;
  if (s.kind === "path") return `HARNESS ${h.id} FROM ${s.path}`;
  if (s.kind === "git") return `HARNESS ${h.id} FROM git+${s.scheme}://${s.repo}#${s.ref}${s.subdir ? ":" + s.subdir : ""}`;
  if (s.kind === "s3") return `HARNESS ${h.id} --endpoint=${s.endpoint} --region=${s.region}${s.pathStyle ? " --path-style" : ""}${s.versionId ? " --version-id=" + s.versionId : ""}${s.sha256 ? " --checksum=sha256:" + s.sha256 : ""} FROM s3://${s.bucket}/${s.key}`;
  return `HARNESS ${h.id}${s.sha256 ? ` --checksum=sha256:${s.sha256}` : ""}${s.redirects.map((r) => " --redirect=" + r).join("")} FROM ${s.url}`;
}
function textOf(m) {
  const L = [`ARG BASE=${BASE}`, "FROM ${BASE}", "ARG TARGETARCH", ...m.other, ""];
  for (const h of m.harnesses) {
    L.push(sourceLine(h), `LABEL kiln.harness.${h.id}.model=${h.model || "default"}`, `LABEL kiln.harness.${h.id}.sign-in=${h.signin === "home" ? "home" : "secret:" + h.signin}`);
    if (h.egress.length) L.push(`NETWORK ${h.egress.map((e) => `--egress=${e}`).join(" ")} ${h.id}-out FOR ${h.id}`, `EXPOSE --harnesses=${h.id} 443/tcp AS egress FOR ${h.id}-out`, `CONNECT ${h.id} WITH ${h.id} ON ${h.id}-out`);
    L.push(`VOLUME --target-kind=harness /home/${h.id} FOR ${h.id}`, "");
  }
  for (const a of m.agents) {
    L.push(`AGENT ${a.name} FROM ./agents/${a.name}`, `ATTACH ${a.name} FOR ${a.harness}`, ...a.skills.map((s) => `SKILL ./skills/${s} FOR ${a.name}`), ...a.mcp.map(([n, u]) => `MCP ${n} FROM ${u} FOR ${a.name}`), ...a.volumes.map((v) => `VOLUME --target-kind=agent ${v} FOR ${a.name}`), "");
  }
  return L.join("\n").trimEnd() + "\n";
}
/** The text read back: the lines the structure shows; the rest stays as written. What Shards would refuse comes back with its line. */
function parse(text) {
  const m = { other: [], harnesses: [], agents: [] }, problems = [];
  const H = (id) => m.harnesses.find((h) => h.id === id), A = (n) => m.agents.find((a) => a.name === n);
  text.split("\n").forEach((raw, i) => {
    const l = raw.trim(); let x;
    if (!l || l.startsWith("#") || /^ARG (BASE|TARGETARCH)/.test(l) || /^FROM \$\{BASE\}/.test(l)) return;
    if ((x = l.match(/^HARNESS (\S+)(.*?) FROM (\S+)$/))) {
      const [, id, flags, src] = x; const prev = M.harnesses.find((h) => h.id === id);
      if (!harnessOf(id)) { problems.push([i + 1, `unknown harness ${id}`]); return; }
      const f = (k) => (flags.match(new RegExp(`--${k}=(\\S+)`)) || [])[1];
      let source;
      if (src.startsWith("git+")) { const g = src.match(/^git\+(https|ssh):\/\/([^#]+)#([^:]+)(?::(.+))?$/) || []; source = { kind: "git", scheme: g[1] || "https", repo: g[2] || "", ref: g[3] || "", subdir: g[4] || "", cred: prev?.source.cred || "" }; }
      else if (src.startsWith("s3://")) { const s = src.slice(5); source = { kind: "s3", bucket: s.split("/")[0], key: s.split("/").slice(1).join("/"), endpoint: f("endpoint") || "", region: f("region") || "", pathStyle: /--path-style/.test(flags), versionId: f("version-id") || "", sha256: (f("checksum") || "").replace("sha256:", ""), keyId: prev?.source.keyId || "", secretKey: prev?.source.secretKey || "" }; }
      else if (/^https?:/.test(src)) { source = { kind: "https", url: src, sha256: (f("checksum") || "").replace("sha256:", ""), cred: prev?.source.cred || "", redirects: [...flags.matchAll(/--redirect=(\S+)/g)].map((r) => r[1]) }; if (!/^[0-9a-f]{64}$/.test(source.sha256)) problems.push([i + 1, "tarball needs --checksum=sha256"]); }
      else source = { kind: "path", path: src };
      const vm = src.match(/(\d+\.\d+\.\d+)/);
      m.harnesses.push({ id, version: vm ? vm[1] : prev?.version || PINS[id][0], source, model: "", signin: "home", egress: [] }); return;
    }
    if ((x = l.match(/^LABEL kiln\.harness\.(\S+)\.model=(\S+)$/)) && H(x[1])) { H(x[1]).model = x[2] === "default" ? "" : x[2]; return; }
    if ((x = l.match(/^LABEL kiln\.harness\.(\S+)\.sign-in=(?:secret:)?(\S+)$/)) && H(x[1])) { H(x[1]).signin = x[2]; return; }
    if ((x = l.match(/^NETWORK (.*) (\S+)-out FOR (\S+)$/)) && H(x[3])) { H(x[3]).egress = [...x[1].matchAll(/--egress=(\S+)/g)].map((e) => e[1]); return; }
    if (/^(EXPOSE --harnesses=|CONNECT )/.test(l) || /^VOLUME --target-kind=harness /.test(l)) return;
    if ((x = l.match(/^AGENT (\S+) FROM/))) { const prev = M.agents.find((a) => a.name === x[1]); m.agents.push({ name: x[1], harness: "", skills: [], mcp: [], volumes: [], def: prev?.def ?? null, sync: prev?.sync ?? "none" }); return; }
    if ((x = l.match(/^ATTACH (\S+) FOR (\S+)$/)) && A(x[1])) { A(x[1]).harness = x[2]; return; }
    if ((x = l.match(/^SKILL \.\/skills\/(\S+) FOR (\S+)$/)) && A(x[2])) { A(x[2]).skills.push(x[1]); return; }
    if ((x = l.match(/^MCP (\S+) FROM (\S+) FOR (\S+)$/)) && A(x[3])) { A(x[3]).mcp.push([x[1], x[2]]); return; }
    if ((x = l.match(/^VOLUME --target-kind=agent (\S+) FOR (\S+)$/)) && A(x[2])) { A(x[2]).volumes.push(x[1]); return; }
    if (/^[A-Z]+ /.test(l)) m.other.push(raw); else problems.push([i + 1, "not an instruction"]);
  });
  return { m, problems };
}

/* ------------------------------------------------------------ builds on save, per runner (P4.5) */
const RUNNERS = [["adas-macbook-pro-2.local", "linux/arm64", true], ["adas-mac-studio.local", "linux/arm64", true], ["adas-mac-studio-3.local", "linux/arm64", true], ["adas-mac-studio.local-2", "linux/arm64", true], ["adacachy2", "linux/amd64", true], ["adas-mac-studio-2.local", "linux/arm64", false, "HVF denied"], ["adacachy", "linux/amd64", true]];
const B = Object.fromEntries(RUNNERS.map(([n, , ok], i) => [n, !ok ? { s: "none" } : n === "adacachy2" ? { s: "failed", age: "4m" } : n === "adas-mac-studio.local-2" ? { s: "start", step: 6 } : { s: "ok", digest: "7c1e0b9a44d2", age: "4m", took: ["3m12s", "2m58s", "3m05s"][i] ?? "3m" }]));
const WORDS = "Shards refused the build at line 13 (HARNESS codex): the download for linux/amd64 has SHA-256 4b07e1a9c3d5…, and --checksum=sha256:9f2c55d0b7a1… names another.";
function runBuilds() {
  const codex = M.harnesses.find((h) => h.id === "codex"); const fixed = !codex || codex.source.kind !== "https" || codex.source.sha256 !== GOOD;
  RUNNERS.forEach(([n, , ok], i) => { if (!ok) return; B[n] = { s: "queued" }; let step = 0;
    setTimeout(function tick() { step += 1 + (i % 3); if (n === "adacachy2" && !fixed && step >= 4) { B[n] = { s: "failed", age: "now" }; draw(); return; } if (step >= 9) { B[n] = { s: "ok", digest: (S.v * 7919).toString(16).padStart(12, "e"), age: "now", took: `${2 + (i % 2)}m${10 + i * 7}s` }; draw(); return; } B[n] = { s: "start", step }; draw(); setTimeout(tick, 600); }, 400 + i * 250); });
  draw();
}

/* ------------------------------------------------------------ the structure */
/** Every table in the structure shares one grid: the name, three slots, the controls. */
const AG = (h) => [{ h: h[0], name: true }, { h: h[1], w: 84, c: "h640" }, { h: h[2], w: narrow() ? 104 : 150 }, { h: h[3], w: 92, c: "h900" }, { h: "", w: 64 }];
const HCOLS = () => AG(["Harness", "Version", "Source", "Model"]);
const ACOLS = () => AG(["Agent", "Harness", "Skills · MCP", "Definition"]);
const GCOLS = () => AG(["Who", "Port", "To", "Kind"]);
const VOLS = () => AG(["Path", "Kind", "For", ""]);
const BCOLS = () => AG(["Runner", "Platform", "Build", "Age"]);
const srcText = (s) => (s.kind === "path" ? s.path : s.kind === "git" ? `${s.repo}#${s.ref}` : s.kind === "s3" ? `s3://${s.bucket}/${s.key}` : s.url.replace(/^https:\/\//, ""));
const originOf = (h) => { const s = h.source; try { if (s.kind === "https") return new URL(s.url.replace("${TARGETARCH}", "arm64")).host + ":443"; if (s.kind === "git") return s.scheme === "ssh" ? s.repo.replace(/^git@/, "").split("/")[0] + ":22" : s.repo.split("/")[0] + ":443"; if (s.kind === "s3" && s.endpoint) return new URL(s.endpoint).host + ":443"; } catch {} return ""; };
const credSel = (k, v, none) => sel([["", none], ...SECRETS.map((n) => [n, `${n} · user`])], v, `data-src="${k}" aria-label="${k}"`);
function sourceForm(h) {
  const s = h.source; const f = (label, k, v, ph = "") => `<div class="f"><span class="lbl">${label}</span><input class="in3" data-src="${k}" value="${esc(v)}" placeholder="${esc(ph)}" aria-label="${label}"></div>`;
  const kinds = `<div class="f wide"><span class="lbl">Source</span><span class="sg3" role="group" aria-label="Source">${[["path", "folder"], ["git", "git"], ["s3", "bucket"], ["https", "archive"]].map(([k, ic]) => `<button data-kind="${k}" aria-pressed="${s.kind === k}" title="${SOURCE_TIP[k]}">${icon(ic)}${k}</button>`).join("")}</span></div>`;
  let fields = "";
  if (s.kind === "path") fields = f("Path", "path", s.path);
  if (s.kind === "git") fields = `<div class="f"><span class="lbl">Over</span>${sel([["https", "https"], ["ssh", "ssh"]], s.scheme, 'data-src="scheme"')}</div>${f("Repository", "repo", s.repo)}${f("Ref", "ref", s.ref, "tag, branch or commit")}${f("Folder", "subdir", s.subdir, "whole repository")}<div class="f"><span class="lbl">${s.scheme === "ssh" ? "SSH key" : "Token"}</span>${credSel("cred", s.cred, "none")}</div>`;
  if (s.kind === "s3") fields = `${f("Bucket", "bucket", s.bucket)}${f("Key", "key", s.key)}${f("Endpoint", "endpoint", s.endpoint)}${f("Region", "region", s.region)}${f("Version", "versionId", s.versionId, "ETag + SHA-256")}${f("SHA-256", "sha256", s.sha256)}<div class="f"><span class="lbl">Key ID</span>${credSel("keyId", s.keyId, "none")}</div><div class="f"><span class="lbl">Secret key</span>${credSel("secretKey", s.secretKey, "none")}</div>`;
  if (s.kind === "https") fields = `${f("URL", "url", s.url)}<div class="f"><span class="lbl">SHA-256</span><input class="in3" data-src="sha256" value="${esc(s.sha256)}" aria-invalid="${!/^[0-9a-f]{64}$/.test(s.sha256)}" aria-label="SHA-256"></div><div class="f"><span class="lbl">Sign-in</span>${credSel("cred", s.cred, "none")}</div>${f("Redirects", "redirects", s.redirects.join(","), "none")}`;
  const models = harnessOf(h.id).models;
  return `<div class="form3">${kinds}${fields}
    <div class="f"><span class="lbl">Version</span>${s.kind === "path" ? sel(PINS[h.id].map((v, i) => [v, i ? `${v} · kept` : v]), h.version, 'data-hk="version"') : `<span class="val" style="height:28px;display:flex;align-items:center">${esc(h.version)}</span>`}</div>
    <div class="f"><span class="lbl">Model</span>${sel(models.length ? models : [["", "default"]], h.model, 'data-hk="model"')}</div>
    <div class="f"><span class="lbl">Sign-in</span>${sel([["home", "your sign-in · home"], ...SECRETS.map((n) => [n, `${n} · user`])], h.signin, 'data-hk="signin"')}</div>
    <div class="f wide"><span class="lbl">Egress</span><span class="chips3">${h.egress.map((e) => `<span class="chip3"><span class="val">${esc(e)}</span><button data-rmeg="${esc(e)}" title="Remove" aria-label="Remove ${esc(e)}">${icon("x", "", 12)}</button></span>`).join("")}<input class="in3" data-addeg placeholder="host:port" aria-label="Add a host" style="width:160px"></span></div>
  </div>`;
}
function harnessRow(h) {
  const open = S.open === h.id; const origin = originOf(h);
  return `<tr class="pick" tabindex="0" data-h="${h.id}" aria-expanded="${open}" aria-selected="${open}">${td3(HCOLS(), [
    named(B.adacachy2.s === "failed" && h.id === "codex" ? "failed" : "ok", h.id, "", B.adacachy2.s === "failed" && h.id === "codex" ? "Build failed on adacachy2" : "Builds", `${icon(h.signin === "home" ? "home" : "key", h.signin === "home" ? "Your sign-in, in your HOME" : `${h.signin} · user`, 12)}<span class="dim" title="${esc(h.egress.join(" · ") || "No egress")}">${icon("out", "", 12)}</span><span class="dim">${h.egress.length}</span>`),
    `<span class="ell">${esc(h.version)}</span>`,
    `<span class="cr">${icon(SOURCE_ICON[h.source.kind], SOURCE_TIP[h.source.kind])}<span class="ell mid" title="${esc(srcText(h.source))}${origin ? ` · fetches from ${esc(origin)} alone` : ""}" data-full="${esc(srcText(h.source))}">${esc(srcText(h.source))}</span></span>`,
    `<span class="ell">${esc(modelName(h.id, h.model))}</span>`,
    `<span class="acts ctl">${ib("edit", "Edit (↵)", `data-do="open" data-h="${h.id}"`)}${ib("trash", "Remove", `data-do="rmh" data-h="${h.id}" data-tone="danger" data-confirm="Remove?"`)}</span>`,
  ])}</tr>${open ? `<tr><td class="detail" colspan="${shown(HCOLS())}">${sourceForm(h)}</td></tr>` : ""}`;
}
function draw() {
  const free = HARNESSES.filter((h) => !M.harnesses.some((x) => x.id === h.id));
  const grants = [...M.harnesses.flatMap((h) => h.egress.map((e) => [h.id, e.split(":")[0], e.split(":")[1], "egress"])), ...M.agents.flatMap((a) => a.mcp.map(([n, u]) => [a.name, parseAddress(u).host, "443", "MCP"])), ...M.harnesses.filter(originOf).map((h) => [`${h.id} build`, originOf(h).split(":")[0], originOf(h).split(":")[1], "fetch"])];
  const vols = [...M.harnesses.map((h) => [`/home/${h.id}`, h.id, "home"]), ...M.agents.flatMap((a) => a.volumes.map((v) => [v, a.name, "agent"]))];
  const built = RUNNERS.filter(([n, , ok]) => ok && B[n].s === "ok").length, can = RUNNERS.filter((r) => r[2]).length;
  const dirty = JSON.stringify(M) !== JSON.stringify(kept) || S.name !== "rust-dev";
  const hist = S.hist ? (() => { const [v, what] = HIST.find((h) => h[0] === S.hist); return `<div class="fr">${icon("history")}<span class="lbl hi">v${v}</span><span class="val dim ell">${esc(what)}</span><span class="acts">${v === S.v ? `<span class="lbl">current</span>` : `<button class="b3" data-do="restore" data-v="${v}">Restore</button>`}${ib("x", "Close", 'data-do="nohist"')}</span></div>`; })() : "";
  const clash = S.clash ? diffBlock(`v${S.remote.v} saved meanwhile`, "you, in another tab", [["codex egress", "chatgpt.com", "chatgpt.com, chat.openai.com"]], [["clashmine", "Keep mine"], ["clashtheirs", `Take v${S.remote.v}`]]) : "";
  const differs = M.agents.filter((a) => a.sync === "differs").map((a) => diffBlock(`${a.name} differs from its definition`, `definition v${a.def}`, [["model", "gpt-6.1-sol", "gpt-6.1-sol-mini"]], [["synctext", "Keep this text"], ["syncdef", `Take definition v${a.def}`]], a.name)).join("");
  $("#page").innerHTML = `${mockBar("agentfile")}
    <div class="title3"><h1>${esc(S.name)}</h1><span class="right"><span class="kv3"><span class="val">v${S.v}</span><span class="lbl">version</span></span><span class="kv3 h640"><span class="val">${M.harnesses.length}</span><span class="lbl">harnesses</span></span><span class="kv3 h640"><span class="val">${M.agents.length}</span><span class="lbl">agents</span></span></span></div>
    <div class="bar-row"><span class="lbl">Name</span><input class="in3" id="nm" value="${esc(S.name)}" aria-label="Name" style="width:180px"><span class="kv3 h640" title="${S.problems.length ? esc(S.problems.map(([l, w]) => `line ${l}: ${w}`).join(" · ")) : "agentfiles_check"}">${st(S.problems.length ? "warn" : "ok")}<span class="val">${S.problems.length ? `line ${S.problems[0][0]}` : "0 problems"}</span></span>
      <span class="right"><button class="b3 g" data-do="discard" ${dirty ? "" : "disabled"}>Discard</button><button class="b3 p" data-do="save" ${dirty && !S.problems.length ? "" : "disabled"} title="Saves over v${S.v}">${icon("check")}Save</button></span></div>
    <div class="split3">
      <div class="card3">
        <div class="ch"><span class="lbl hi">Structure</span><span class="acts"><span class="lbl h640">v${S.v}</span><span class="vd3">${HIST.map(([v, what]) => `<button data-do="hist" data-v="${v}" aria-current="${v === S.v}" title="v${v} · ${esc(what)}" aria-label="v${v}"></button>`).join("")}</span></span></div>${hist}${clash}
        <div class="sh"><span class="lbl hi">Harnesses</span><span class="val dim">${M.harnesses.length}</span><span class="acts">${sel(free.map((h) => [h.id, h.id]), free[0]?.id ?? "", 'id="addh" aria-label="Harness to add"')}${ib("plus", "Add harness", 'data-do="addh"')}</span></div>
        <table class="t3" data-grid="f">${th3(HCOLS())}<tbody>${M.harnesses.map(harnessRow).join("")}</tbody></table>
        <div class="sh"><span class="lbl hi">Agents</span><span class="val dim">${M.agents.length}</span></div>
        <table class="t3" data-grid="f">${th3(ACOLS())}<tbody>${M.agents.map((a) => `<tr>${td3(ACOLS(), [named(a.sync === "differs" ? "warn" : "ok", a.name, "", a.sync === "differs" ? "Differs from its definition" : "In step with its definition"), `<span class="ell">${a.harness}</span>`, `${a.skills.length} · ${a.mcp.length}`, a.def ? `v${a.def}` : `<span class="dim">—</span>`, `<span class="acts ctl">${ib("open", "Open in Agents")}</span>`])}</tr>`).join("")}</tbody></table>
        ${differs}
        <div class="sh"><span class="lbl hi">Grants</span><span class="val dim">${grants.length}</span></div>
        <table class="t3" data-grid="f">${th3(GCOLS())}<tbody>${grants.map(([w, to, port, kind]) => `<tr>${td3(GCOLS(), [{ lead: icon("out", "Out"), body: `<span class="cr"><span class="ell">${esc(w)}</span></span>` }, port, `<span class="cr"><span class="ell mid" data-full="${esc(to)}" title="${esc(to)}">${esc(to)}</span></span>`, `<span class="dim">${kind}</span>`, ""])}</tr>`).join("")}</tbody></table>
        <div class="sh"><span class="lbl hi">Volumes</span><span class="val dim">${vols.length}</span></div>
        <table class="t3" data-grid="f">${th3(VOLS())}<tbody>${vols.map(([p, f, k]) => `<tr>${td3(VOLS(), [{ lead: icon("folder", "Volume"), body: `<span class="cr"><span class="ell mid" data-full="${esc(p)}" title="${esc(p)}">${esc(p)}</span></span>` }, `<span class="dim">${k}</span>`, `<span class="ell">${esc(f)}</span>`, "", ""])}</tr>`).join("")}</tbody></table>
        <div class="sh"><span class="lbl hi">Builds</span><span class="val dim">${built}/${can}</span></div>
        <table class="t3" data-grid="f">${th3(BCOLS())}<tbody>${RUNNERS.map(([n, p, ok, why]) => { const b = B[n]; const state = { ok: "ok", start: "start", queued: "start", failed: "failed", none: "off" }[b.s];
          const cell = b.s === "ok" ? ubar(100, b.took, 44, "#0ca30c") : b.s === "start" ? ubar((b.step / 9) * 100, `${b.step}/9`, 44, "#3987e5") : b.s === "queued" ? ubar(0, "queued", 44) : b.s === "failed" ? `<span class="u" title="${esc(WORDS)}"><span class="u-t" style="width:44px"><i style="width:100%;background:#d03b3b"></i></span><span class="ell">checksum</span></span>` : `<span class="dim" title="${esc(why)}">—</span>`;
          return `<tr>${td3(BCOLS(), [named(state, n, "", b.s === "none" ? why : b.digest ? `image ${b.digest}` : undefined), `<span class="dim">${p.replace("linux/", "")}</span>`, cell, `<span class="dim">${b.age || ""}</span>`, `<span class="acts ctl">${ok ? ib("restart", "Build again", `data-do="rebuild" data-r="${n}"`) : ""}${b.s === "failed" ? ib("copy", "Copy Shards' words", 'data-do="copywords"') : ""}</span>`])}</tr>`; }).join("")}</tbody></table>
      </div>
      <div class="card3 sticky"><div class="ch"><span class="lbl hi">Text</span><span class="acts">${st(S.problems.length ? "warn" : "ok", S.problems.length ? S.problems.map(([l, w]) => `line ${l}: ${w}`).join(" · ") : "Shards: no problems")}<span class="val">${S.problems.length ? `line ${S.problems[0][0]}` : "0 problems"}</span></span></div>
        <div class="ed3"><pre class="gut3" id="gut" aria-hidden="true"></pre><textarea class="code3" id="text" spellcheck="false" aria-label="${esc(S.name)}'s Agentfile"></textarea></div></div>
    </div>`;
  $("#text").value = textOf(M); gutter(); liveScan(); refit();
}
function gutter() { const n = $("#text").value.split("\n").length; const bad = new Map(S.problems); $("#gut").innerHTML = Array.from({ length: n }, (_, i) => bad.has(i + 1) ? `<b data-bad title="${esc(bad.get(i + 1))}">${st("warn", bad.get(i + 1))}${i + 1}</b>` : `<b>${i + 1}</b>`).join(""); $("#gut").scrollTop = $("#text").scrollTop; }
draw = ((inner) => () => { const t = $("#text"); const at = t ? [t.selectionStart, t.scrollTop, document.activeElement === t] : null; inner(); if (at && at[2]) { const n = $("#text"); n.focus(); n.selectionStart = n.selectionEnd = at[0]; n.scrollTop = at[1]; } })(draw);
onBand(() => draw());

/* ------------------------------------------------------------ edit in place; the text follows, and back */
const H = (id) => M.harnesses.find((h) => h.id === id);
document.addEventListener("click", (e) => {
  const kind = e.target.closest("[data-kind]"); const row = e.target.closest("tr.pick");
  if (kind) { const h = H(S.open); const k = kind.dataset.kind; if (h.source.kind === k) return; h.source = k === "path" ? { kind: "path", path: `./${h.id}-${h.version}-\${TARGETARCH}` } : k === "git" ? { kind: "git", scheme: "ssh", repo: `git@github.com/hyper-light/${h.id}-fork`, ref: `v${h.version}`, subdir: "dist", cred: "GH_DEPLOY_KEY" } : k === "s3" ? { kind: "s3", bucket: "agent-builds", key: `${h.id}/${h.version}/${h.id}-\${TARGETARCH}.tar.gz`, endpoint: "https://mantle.lan:9000", region: "local", pathStyle: true, versionId: "", sha256: "", keyId: "MANTLE_ACCESS_KEY_ID", secretKey: "MANTLE_SECRET_ACCESS_KEY" } : { kind: "https", url: `https://releases.example.dev/${h.id}/${h.version}/${h.id}-\${TARGETARCH}.tar.gz`, sha256: "", cred: "", redirects: [] }; S.problems = parse(textOf(M)).problems; draw(); return; }
  const rm = e.target.closest("[data-rmeg]"); if (rm) { const h = H(S.open); h.egress = h.egress.filter((x) => x !== rm.dataset.rmeg); draw(); return; }
  const b = e.target.closest("[data-do]");
  if (!b && row && !e.target.closest("button,input,select")) { S.open = S.open === row.dataset.h ? null : row.dataset.h; setOpen(S.open, draw); return; }
  if (!b || b.closest("#pal")) return; const d = b.dataset.do;
  if (d === "open") { S.open = S.open === b.dataset.h ? null : b.dataset.h; setOpen(S.open, draw); return; }
  if (d === "rmh") { M.harnesses = M.harnesses.filter((h) => h.id !== b.dataset.h); draw(); return; }
  if (d === "addh") { const id = $("#addh").value; if (!id) return; M.harnesses.push({ id, version: PINS[id][0], source: { kind: "path", path: `./${id}-${PINS[id][0]}-\${TARGETARCH}` }, model: harnessOf(id).models[0]?.[0] ?? "", signin: "home", egress: [...harnessOf(id).egress] }); S.open = id; setOpen(id, draw); return; }
  if (d === "hist") { S.hist = Number(b.dataset.v); draw(); return; }
  if (d === "nohist") { S.hist = null; draw(); return; }
  if (d === "restore") { press(b, 500, () => { S.v += 1; HIST.push([S.v, `v${b.dataset.v} restored`]); S.hist = null; draw(); }); return; }
  if (d === "discard") { M = structuredClone(kept); S.name = "rust-dev"; S.problems = []; draw(); return; }
  if (d === "save") { press(b, 600, () => { if (S.remote) { S.clash = true; draw(); return; } commit(); }); return; }
  if (d === "clashmine" || d === "clashtheirs") { press(b, 500, () => { S.v = S.remote.v; HIST.push([S.remote.v, "saved elsewhere"]); if (d === "clashtheirs") { M.harnesses.find((h) => h.id === "codex")?.egress.push("chat.openai.com:443"); } S.remote = null; S.clash = false; commit(); }); return; }
  if (d === "synctext" || d === "syncdef") { press(b, 400, () => { const ag = M.agents.find((x) => x.name === b.dataset.ag); ag.sync = "ok"; if (d === "synctext") ag.def += 1; draw(); toast(d === "synctext" ? `${ag.name}'s definition is now v${ag.def}` : `Took definition v${ag.def}`); }); return; }
  if (d === "sync") { press(b, 400, () => { M.agents.find((a) => a.name === b.dataset.ag).sync = "ok"; draw(); }); return; }
  if (d === "rebuild") { press(b, 400, () => { B[b.dataset.r] = { s: "queued" }; draw(); setTimeout(() => { B[b.dataset.r] = b.dataset.r === "adacachy2" && H("codex")?.source.sha256 === GOOD ? { s: "failed", age: "now" } : { s: "ok", digest: "8d2f11c0a9b4", age: "now", took: "2m51s" }; draw(); }, 1500); }); return; }
  if (d === "copywords") { navigator.clipboard?.writeText(WORDS).catch(() => {}); toast("Copied"); return; }
});
function commit() { S.v += 1; HIST.push([S.v, "saved here"]); kept = structuredClone(M); toast(`Saved v${S.v}`); runBuilds(); }
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "nm") { S.name = t.value.trim(); $('[data-do="save"]').disabled = false; return; }
  if (t.id === "text") { clearTimeout(t._k); t._k = setTimeout(() => { const { m, problems } = parse(t.value); S.problems = problems; if (!problems.length) M = m; draw(); }, 300); gutter(); return; }
  const h = H(S.open); if (!h) return;
  if (t.dataset.src) { const k = t.dataset.src; h.source[k] = k === "redirects" ? t.value.split(",").map((x) => x.trim()).filter(Boolean) : t.value.trim(); if (k === "sha256") t.setAttribute("aria-invalid", String(!/^[0-9a-f]{64}$/.test(t.value.trim()))); const vm = srcText(h.source).match(/(\d+\.\d+\.\d+)/); if (vm && h.source.kind !== "path") h.version = vm[1]; S.problems = parse(textOf(M)).problems; $("#text").value = textOf(M); gutter(); return; }
  if (t.dataset.hk) { h[t.dataset.hk] = t.value; if (t.dataset.hk === "version") h.source.path = `./${h.id}-${t.value}-\${TARGETARCH}`; draw(); }
});
document.addEventListener("keydown", (e) => { if (e.target.matches?.("[data-addeg]") && e.key === "Enter") { const v = e.target.value.trim(); if (/^[a-z0-9.-]+:\d+$/i.test(v)) { H(S.open).egress.push(v); draw(); } else e.target.setAttribute("aria-invalid", "true"); } if (e.key === "Escape" && S.open && !e.target.matches?.("input,select,textarea")) { S.open = null; setOpen(null, draw); } if (e.key === "Enter" && e.target.matches?.("tr.pick")) { S.open = S.open === e.target.dataset.h ? null : e.target.dataset.h; setOpen(S.open, draw); } });
document.addEventListener("scroll", (e) => { if (e.target.id === "text") $("#gut").scrollTop = e.target.scrollTop; }, true);
onOpenChange((id) => { S.open = id; draw(); });
paletteItems = () => fromOps([
  ["agentfiles.update", "rust-dev", () => $('[data-do="save"]')?.click(), "Agentfiles"],
  ["images.build", "rust-dev · adacachy2", () => { B.adacachy2 = { s: "queued" }; draw(); }, "Images"],
  ["agentdefs.run", "reviewer", () => { location.href = "agents.html?open=reviewer"; }, "Agents"],
]);
draw();
