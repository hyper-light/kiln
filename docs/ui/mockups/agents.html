<style>
  /* A definition's values on its open row: each one a value until pressed, then its own control, in place. */
  .defs3 { display: grid; gap: 12px 24px; padding: 12px var(--edge) 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 148px), 1fr)); }
  .defs3 > div { display: grid; gap: 6px; min-width: 0; }
  .defs3 > div.wide { grid-column: 1 / -1; }
  .defs3 .pv { display: flex; align-items: center; gap: 6px; min-width: 0; height: 28px; border-radius: 6px; text-align: left; }
  .defs3 .pv:not(:disabled):hover { color: #fff; }
  .defs3 .pv:not(:disabled):hover .ic.pen { opacity: 1; }
  .defs3 .pv .ic.pen { opacity: 0; }
  .defs3 .pv > .val { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .defs3 .ed { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .defs3 .ed > .sel3, .defs3 .ed > .in3 { flex: 1 1 auto; width: 0; }
  .vdots { display: inline-flex; align-items: center; gap: 4px; }
  .vdots button { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #8b8e97; padding: 0; }
  .vdots button[aria-current="true"] { background: #d4d6dc; border-color: #d4d6dc; }
  .vdots button:hover { border-color: #fff; }
  .v3 input.wr { width: 52px; flex: none; }
</style>

<body>
<div class="container-console v3 page3" id="page"></div>
<script src="assets/mockup.js"></script>
<script>
/* ------------------------------------------------------------ sample data */
const W = (b, s, seed) => walk(60, b, s, seed);
const AGENTFILES = [["rust-dev", "rust-dev v8"], ["docs-site", "docs-site v3"], ["harness-claude", "harness-claude"], ["harness-codex", "harness-codex"], ["harness-gemini", "harness-gemini"]];
const TOOLS = ["CI", "Deploys", "Agents", "Plans", "Research", "Machines", "Search"];
const SKILLS = ["kiln-ci-review", "kiln-ci-diagnose", "kiln-ci-performance", "rust-style", "no-panics"];
const sess = (id, title, proj, runner, engine, start, up, state, cpu, mem, variant, ver) => ({ id, title, proj, runner, engine, start, up, state, cpu: W(cpu, cpu / 2 + 2, id.length * 7 + cpu), mem, variant, ver });
const A = [
  { id: "reviewer", own: true, remote: { v: 5, by: "you, in another tab", field: "model", value: "claude-sonnet-5-5" }, harness: "claude", model: "claude-opus-5-5", agentfile: "rust-dev", instr: "Review the change against AGENTS.md; findings with file and line.", tools: ["CI", "Agents", "Search"], mcp: ["github"], skills: ["kiln-ci-review", "rust-style", "no-panics"], limit: "45m", v: 4,
    hist: [[1, "copied from ci-review"], [2, "limit 45m"], [3, "skill no-panics"], [4, "model Opus 5.5"]], starts: W(6, 4, 3),
    sessions: [sess("s1", "Review the top diff of my stack", "hyper-light/kiln", "adas-mac-studio-3.local", "microvm", ["warm", 221], "40s", "run", 62, [3.1, 4], 0, 4), sess("s2", "Review shards #4512", "hyper-light/shards", "adas-mac-studio.local", "microvm", ["warm", 212], "6m", "run", 38, [2.3, 4], 1, 4), sess("s3", "Second look at D263", "hyper-light/shards", "adacachy2", "microvm", ["template", 455], "22m", "paused", 2, [1.9, 4], 0, 3)],
    exp: { name: "reviewer-size", state: "live", variants: [{ agentfile: "rust-dev", engine: "microvm", cpus: 2, mem: 4, weight: 50, current: true }, { agentfile: "rust-dev", engine: "microvm", cpus: 4, mem: 8, weight: 50 }] } },
  { id: "pr-triage", own: true, harness: "codex", model: "gpt-6.1-sol-mini", agentfile: "rust-dev", instr: "Label and route new pull requests.", tools: ["CI"], mcp: [], skills: [], limit: "10m", v: 2, conflict: true,
    hist: [[1, "new"], [2, "limit 10m"]], starts: W(3, 3, 5),
    sessions: [sess("s4", "Triage hex #88", "hyper-light/hex", "adacachy2", "microvm", ["warm", 205], "3m", "failed", 2, [2, 2]), sess("s5", "Triage kiln #1201", "hyper-light/kiln", "adas-mac-studio-3.local", "microvm", ["template", 455], "18m", "paused", 1, [1.9, 2])] },
  { id: "release-notes", own: true, harness: "gemini", model: "", agentfile: "docs-site", instr: "Notes from landed diffs.", tools: [], mcp: [], skills: [], limit: "", v: 1, hist: [[1, "new"]], starts: W(1, 1, 7),
    sessions: [sess("s6", "Notes for v0.9.41", "hyper-light/hex", "adas-macbook-pro-2.local", "microvm", ["template", 431], "41m", "idle", 4, [1.1, 4])] },
  { id: "about-terse", own: true, replaces: "about", harness: "claude", model: "claude-sonnet-5-5", agentfile: "harness-claude", instr: "Explain the code in three lines.", tools: ["Search"], mcp: [], skills: [], limit: "2m", v: 1, hist: [[1, "copied from about"]], starts: W(9, 6, 9), sessions: [] },
];
const KILN = [
  ...HARNESSES.map((h) => ({ id: h.id, kind: "harness", harness: h.id, model: h.models[0]?.[0] ?? "", agentfile: `harness-${h.id}`, starts: W(1, 1, h.id.length), sessions: [] })),
  ...[["ci-diagnose", "claude", "claude-sonnet-5-5"], ["ci-review", "claude", "claude-sonnet-5-5"], ["ci-performance", "codex", "gpt-6.1-sol"], ["ci-migrate", "claude", "claude-opus-5-5"], ["ci-author", "claude", "claude-sonnet-5-5"], ["ci-secrets", "claude", "claude-sonnet-5-5"], ["ci-runners", "codex", "gpt-6.1-sol"]].map(([id, h, m]) => ({ id, kind: "skill", harness: h, model: m, agentfile: `harness-${h}`, starts: W(2, 2, id.length * 3), sessions: id === "ci-diagnose" ? [sess("s7", "Why did kiln-ci #771 fail", "hyper-light/shards", "adas-mac-studio-3.local", "microvm", ["warm", 198], "2m", "idle", 6, [1.4, 2])] : [] })),
  ...[["about", "claude-sonnet-5-5"], ["ask", "claude-sonnet-5-5"], ["review", "claude-opus-5-5"], ["attach", "claude-sonnet-5-5"]].map(([id, m]) => ({ id, kind: "ui", harness: "claude", model: m, agentfile: "harness-claude", starts: W(4, 4, id.length * 5), sessions: [], replacedBy: id === "about" ? "about-terse" : null })),
];
KILN.forEach((k) => (k.kiln = true));
const ADHOC = { id: "adhoc", adhoc: true, name: "Ad hoc", sessions: [sess("s8", "Fix the flaky lane test", "hyper-light/kiln", "adacachy2", "microvm", ["cold", 1912], "14m", "run", 44, [2.8, 4]), sess("s9", "Port the docs", "hyper-light/hex", "adacachy", "host", ["process", 310], "1h", "idle", 3, [0.6, 2])] };

/* An experiment's sessions, made up as they come: every interval is computed from them. */
const TRUTH = [{ warm: [214, 12], cold: [1910, 80], template: [412, 25], peak: [2.31, 0.1], steady: [1.62, 0.07], cpu: [0.41, 0.05], fail: 0.08, done: 0.82 }, { warm: [219, 12], cold: [1970, 85], template: [455, 26], peak: [3.02, 0.11], steady: [2.05, 0.08], cpu: [0.43, 0.05], fail: 0.01, done: 0.9 }];
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const gauss = ([m, sd]) => m + sd * Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(2 * Math.PI * rnd());
const XS = []; // {v, kind, start, peak, steady, cpu, failed, done}
function arrive(e, force) { const v = force ?? (rnd() * 100 < e.variants[0].weight ? 0 : 1); const t = TRUTH[v]; const r = rnd(); const kind = r < 0.7 ? "warm" : r < 0.9 ? "template" : "cold"; const failed = rnd() < t.fail; XS.push({ v, kind, start: gauss(t[kind]), peak: gauss(t.peak), steady: gauss(t.steady), cpu: gauss(t.cpu), failed, done: !failed && rnd() < t.done }); }
for (let i = 0; i < 96; i++) arrive(A[0].exp, i === 5 ? 1 : i % 2);
const medCI = (xs) => { const s = [...xs].sort((a, b) => a - b), n = s.length; if (n < 3) return null; const h = (1.96 * Math.sqrt(n)) / 2; const med = n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; return [s[Math.max(0, Math.floor(n / 2 - h))], med, s[Math.min(n - 1, Math.ceil(n / 2 + h) - 1)]]; };
const wilson = (k, n) => { if (!n) return null; const z = 1.96, p = k / n, d = 1 + (z * z) / n, c = (p + (z * z) / (2 * n)) / d, w = (z * Math.sqrt((p * (1 - p)) / n + (z * z) / (4 * n * n))) / d; return [Math.max(0, c - w) * 100, p * 100, Math.min(1, c + w) * 100]; };
const MEAS = [
  { id: "warm", h: "Warm start", unit: "ms", lower: true, pick: (x) => (x.kind === "warm" && !x.failed ? x.start : null), f: (v) => `${Math.round(v)}ms` },
  { id: "template", h: "Template start", unit: "ms", lower: true, pick: (x) => (x.kind === "template" && !x.failed ? x.start : null), f: (v) => `${Math.round(v)}ms` },
  { id: "cold", h: "Cold start", unit: "ms", lower: true, pick: (x) => (x.kind === "cold" && !x.failed ? x.start : null), f: (v) => `${(v / 1000).toFixed(2)}s` },
  { id: "peak", h: "Peak", unit: "G", lower: true, pick: (x) => (x.failed ? null : x.peak), f: (v) => `${v.toFixed(2)}G` },
  { id: "steady", h: "Steady", unit: "G", lower: true, pick: (x) => (x.failed ? null : x.steady), f: (v) => `${v.toFixed(2)}G` },
  { id: "cpu", h: "CPU", unit: "", lower: true, pick: (x) => (x.failed ? null : x.cpu), f: (v) => `${v.toFixed(2)}` },
  { id: "fail", h: "Failed", unit: "%", lower: true, rate: (x) => x.failed, f: (v) => `${v.toFixed(0)}%` },
  { id: "done", h: "Done", unit: "%", lower: false, rate: (x) => x.done, f: (v) => `${v.toFixed(0)}%` },
];
function measure(m) {
  const per = [0, 1].map((v) => { const mine = XS.filter((x) => x.v === v); if (m.rate) return wilson(mine.filter(m.rate).length, mine.length); return medCI(mine.map(m.pick).filter((x) => x !== null)); });
  const lo = Math.min(...per.filter(Boolean).map((c) => c[0])), hi = Math.max(...per.filter(Boolean).map((c) => c[2])), pad = (hi - lo) * 0.1 || 1;
  let win = null; if (per[0] && per[1]) { if (m.lower ? per[0][2] < per[1][0] : per[0][0] > per[1][2]) win = 0; else if (m.lower ? per[1][2] < per[0][0] : per[1][0] > per[0][2]) win = 1; }
  return { per, axis: [Math.max(0, lo - pad), hi + pad], win };
}

/* ------------------------------------------------------------ page state */
const S = { filter: "yours", open: OPEN.get() || "reviewer", editing: null, run: null, ran: null, charts: new Set(), allMeas: false, promote: null, hist: null, asking: null, newRow: false, setup: null, replay: null, saved: null };
const byId = (id) => [...A, ...KILN, ADHOC].find((a) => a.id === id);
const allSessions = () => [...A, ...KILN, ADHOC].flatMap((a) => a.sessions.map((s) => [s, a]));
const SES = (id) => allSessions().find(([s]) => s.id === id) || [null, null];

/* ------------------------------------------------------------ the list */
/** Every table on this page shares one grid: the name, six slots, then the controls; alike things share a slot. */
const G = (heads, tips = {}, o = {}) => [{ h: heads[0], name: true }, { h: heads[1], w: 96, c: "h640", tip: tips[1] }, { h: heads[2], w: 124, c: "h900", tip: tips[2] }, { h: heads[3], w: narrow() ? 64 : 124, tip: tips[3], c: o.narrowHide3 ? "h640" : "" }, { h: heads[4], w: 124, c: "h640", tip: tips[4] }, { h: heads[5], w: 120, c: "h1100", tip: tips[5] }, { h: heads[6], w: 112, c: "h1100", tip: tips[6] }, ...(o.noCtl ? [] : [{ h: "", w: narrow() ? 136 : 154 }])];
const START_TIP3 = "Flame: warm · layers: from template · snowflake: cold";
const LIST = () => G(["Agent", "Harness", "Model", narrow() ? "Live" : "Sessions", "Starts", "Split", ""]);
/** A value on the row itself that edits in place when its row is open: the row's own cell, never a copy in the block. */
function rowField(a, k, shownValue) {
  if (S.editing === `${a.id}:${k}`) return editor(a, k);
  if (S.open !== a.id || a.kiln) return `<span class="ell">${esc(shownValue)}</span>`;
  return `<button class="pv" data-edit="${k}" data-a="${a.id}" title="Change">${`<span class="val ell">${esc(shownValue)}</span>`}${icon("edit").replace('class="ic"', 'class="ic pen"')}</button>`;
}
function aggregate(a) { const s = a.sessions.map((x) => x.state); return s.includes("failed") ? "failed" : s.includes("run") ? "run" : s.includes("paused") ? "paused" : s.length ? "idle" : "stopped"; }
const glyphs = (a) => (a.sessions.length ? `<span class="gl">${a.sessions.slice(0, 5).map((s) => st(s.state, `${s.title} · ${STATES[s.state][1]}`)).join("")}</span>` : `<span class="dim">0</span>`);
function agentRow(a) {
  const open = S.open === a.id;
  const name = a.adhoc ? "Ad hoc" : a.id;
  const extra = a.kiln ? icon("lock", a.kind === "ui" ? "kiln's · its UI starts it" : `kiln's · one per ${a.kind}`, 12) : a.replaces ? icon("swap", `Replaces kiln's ${a.replaces} for you`, 12) : a.conflict ? st("warn", "Differs from its Agentfile") : "";
  const rep = a.replacedBy ? icon("swap", `You use ${a.replacedBy} instead`, 12) : "";
  const e = a.exp;
  const cells = [
    a.adhoc ? { lead: icon("adhoc", "Sessions started without a definition"), body: `<span class="cr"><span class="ell">Ad hoc</span></span>` } : named(aggregate(a), name, "", undefined, `${extra}${rep}`),
    a.adhoc ? "" : rowField(a, "harness", a.harness),
    a.adhoc ? "" : rowField(a, "model", modelName(a.harness, a.model)),
    glyphs(a),
    a.starts ? spark(a.starts, String(Math.round(a.starts.reduce((x, y) => x + y, 0))), "#3987e5", 36) : "",
    e ? stack(e.variants.map((v, i) => ({ v: v.weight, color: SERIES4[i], tip: `Variant ${KEYS[i]}` })), 40, e.variants.map((v) => v.weight).join("/")) : "",
    "",
    a.adhoc ? `<span class="acts ctl">${ib("play", "Run", "disabled")}${ib("pause", "Pause all (P)", `data-do="pauseall" data-a="adhoc"`)}${ib("restart", "Restart all (R)", `data-do="restartall" data-a="adhoc"`)}${ib("stop", "Stop all (S)", 'data-do="stopall" data-a="adhoc" data-tone="danger" data-confirm="Stop all?"')}${ib("more", "More", 'data-do="adhocmore"')}</span>` : `<span class="acts ctl">${ib("play", "Run (⌘↵)", `data-do="run" data-a="${a.id}"`)}${ib("pause", "Pause all (P)", `data-do="pauseall" data-a="${a.id}" ${a.sessions.some((s) => s.state === "run" || s.state === "idle") ? "" : "disabled"}`)}${ib("restart", "Restart all (R)", `data-do="restartall" data-a="${a.id}" ${a.sessions.length ? "" : "disabled"}`)}${ib("stop", "Stop all (S)", `data-do="stopall" data-a="${a.id}" data-tone="danger" data-confirm="Stop all?" ${a.sessions.length ? "" : "disabled"}`)}${ib("more", "More", `data-do="amore" data-a="${a.id}"`)}</span>`,
  ];
  return `<tr class="pick" tabindex="0" data-a="${a.id}" aria-expanded="${open}" aria-selected="${open}">${td3(LIST(), cells)}</tr>${open ? `<tr><td class="detail" colspan="${shown(LIST())}">${expanded(a)}</td></tr>` : ""}`;
}

/* ------------------------------------------------------------ an agent, open in place */
function prop(a, k, label, display, cls = "") {
  const ro = a.kiln || a.adhoc;
  if (S.editing === `${a.id}:${k}`) return `<div class="${cls}"><span class="lbl">${label}</span>${editor(a, k)}</div>`;
  return `<div class="${cls}"><span class="lbl">${label}</span><button class="pv${cls.includes("prose") ? " prose" : ""}" data-edit="${k}" data-a="${a.id}" ${ro ? "disabled" : ""} title="${ro ? "kiln's · copy to change" : "Change"}">${display}${ro ? "" : icon("edit").replace('class="ic"', 'class="ic pen"')}</button></div>`;
}
function editor(a, k) {
  const ok = `${ib("check", "Save (↵)", `data-do="save" data-a="${a.id}" data-k="${k}"`)}${ib("x", "Cancel (esc)", 'data-do="noedit"')}`;
  if (k === "harness") return `<span class="ed">${sel(HARNESSES.map((h) => [h.id, h.id]), a.harness, 'id="edv"')}${ok}</span>`;
  if (k === "model") { const ms = harnessOf(a.harness).models; return `<span class="ed">${sel(ms.length ? ms : [["", "default"]], a.model, 'id="edv"')}${ok}</span>`; }
  if (k === "agentfile") return `<span class="ed">${sel(AGENTFILES, a.agentfile, 'id="edv"')}${ok}</span>`;
  if (k === "limit") return `<span class="ed"><input class="in3" id="edv" data-check="limit" value="${esc(a.limit)}" placeholder="none">${ok}</span>`;
  if (k === "instr") return `<span class="ed"><input class="in3" id="edv" value="${esc(a.instr)}">${ok}</span>`;
  if (k === "tools") return `<span class="ed"><span class="chips3">${TOOLS.map((t) => `<label class="chip3"><input type="checkbox" class="check" data-tool="${t}" ${a.tools.includes(t) ? "checked" : ""}>${t}</label>`).join("")}<span class="chip3">${icon("plus")}<span class="val">MCP</span></span></span>${ok}</span>`;
  if (k === "skills") return `<span class="ed"><span class="chips3">${SKILLS.map((t) => `<label class="chip3"><input type="checkbox" class="check" data-skill="${t}" ${a.skills.includes(t) ? "checked" : ""}><span class="val">${t}</span></label>`).join("")}</span>${ok}</span>`;
  return "";
}
const SCOLS = () => G(["Session", "Start", "Project", "CPU", "Memory", "Runner", "Version"], { 1: START_TIP3, 6: "The definition version it started on, and its variant" }, { narrowHide3: true });
function sessionRow(s, a) {
  return `<tr tabindex="0" data-s="${s.id}">${td3(SCOLS(), [
    named(s.state, s.title, `data-peek="session:${s.id}"`),
    `<span class="cr">${icon(s.engine, ENGINE_TIP[s.engine])}${startIcon(s.start[0])}<span>${s.start[1] >= 1000 ? (s.start[1] / 1000).toFixed(1) + "s" : s.start[1] + "ms"}</span></span>`,
    `<span class="ell">${esc(s.proj)}</span>`,
    spark(s.cpu, s.state === "paused" || s.state === "stopped" ? "0%" : `${Math.round(s.cpu[s.cpu.length - 1])}%`, "#3987e5", narrow() ? 0 : 36, 16, `sc:${s.id}`),
    ubar((s.mem[0] / s.mem[1]) * 100, `${s.mem[0]}/${s.mem[1]}G`, 36),
    `<span class="cr"><span class="ell mid" data-peek="runner:${esc(s.runner)}" tabindex="0" title="${esc(s.runner)}" data-full="${esc(s.runner)}">${esc(s.runner)}</span></span>`,
    `<span class="cr">${s.ver ? `<span class="${s.ver === a.v ? "" : "dim"}" title="${s.ver === a.v ? "Current version" : `Started on v${s.ver}; new sessions get v${a.v}`}">v${s.ver}</span>` : `<span class="dim">—</span>`}${s.variant !== undefined && a.exp ? key3(s.variant) : ""}</span>`,
    ctl(s.state, s.id, true),
  ])}</tr>`;
}
const VCOLS = () => G(["Variant", "Weight", "Sessions", "Warm start", "Peak", "CPU", "Failed"], {}, { narrowHide3: true });
function expRows(a) {
  const e = a.exp; const n = [0, 1].map((v) => XS.filter((x) => x.v === v).length); const tot = n[0] + n[1];
  const cell = (m, i) => expCell(a, i, m.id, `ex:${i}:${m.id}`);
  const lead = (v, i) => (v.current ? key3(i).replace('class="key3"', 'class="key3" data-current').replace(`title="Variant ${KEYS[i]}"`, `title="Variant ${KEYS[i]} · current"`) : key3(i));
  const promote = S.promote !== null ? `<div class="fr">${icon("crown")}<span class="lbl hi">Promote ${KEYS[S.promote]}?</span><span class="val dim ell h640">${esc(depl(e.variants[S.promote]))}</span><span class="acts"><button class="b3 p" data-do="promote" data-a="${a.id}">Promote</button><button class="b3 g" data-do="nopromote">Cancel</button></span></div>` : "";
  return `<div class="sh">${icon("split", "Experiment")}<span class="lbl hi">${esc(e.name)}</span>${st(e.state === "live" ? "run" : e.state === "paused" ? "paused" : "stopped", e.state)}<span class="val dim h640">${tot} sessions</span><span class="acts">${staged(a) ? `${stack(staged(a).map((w, i) => ({ v: w, color: SERIES4[i], tip: `Variant ${KEYS[i]} · staged` })), 64, staged(a).join("/")).replace('class="stk"', 'class="stk hatch"')}<button class="b3 p" data-do="applysplit" data-a="${a.id}">Apply</button><button class="b3 g" data-do="dropsplit">Discard</button>` : stack(e.variants.map((v, i) => ({ v: v.weight, color: SERIES4[i], tip: `Variant ${KEYS[i]} · split v${e.ver || 1}` })), narrow() ? 40 : 64, narrow() ? undefined : `${e.variants.map((v) => v.weight).join("/")} · v${e.ver || 1}`)}${e.state === "promoted" ? "" : ib(e.state === "live" ? "pause" : "play", e.state === "live" ? "Pause split" : "Resume split", `data-do="expstate" data-a="${a.id}"`)}${ib("replay", "Replay a session", `data-do="replay" data-a="${a.id}" aria-expanded="${Boolean(S.replay)}"`)}</span></div>${promote}
