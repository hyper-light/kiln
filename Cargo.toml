[workspace]
resolver = "3"
members = ["crates/*"]
# Turso (the conversation store's engine) is vendored with its own workspace: vendor/turso/UPSTREAM.md.
exclude = ["vendor/turso"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hyper-light/kiln"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
exit = "deny"
type_complexity = "allow"

# Debug builds hash with optimized SHA-256. A server hashes its own (debug: over a GiB) binary as
# it starts, on one of its shards, and the content store hashes every chunk: unoptimized, that alone
# kept test servers from answering within a minute on a loaded machine.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
