[workspace]
resolver = "3"
members = ["crates/*"]
# Turso (the conversation store's engine) is vendored with its own workspace: vendor/turso/UPSTREAM.md.
exclude = ["vendor/turso"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hyper-light/kiln"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
exit = "deny"
type_complexity = "allow"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

# A runner hashes its own binary when it starts (`updates::own_binary`): a debug build's is over a
# gigabyte, which sha2 unoptimized takes 27 s over (48 MB/s), optimized 1.7 s.
[profile.dev.package.sha2]
opt-level = 3
