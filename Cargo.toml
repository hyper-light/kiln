[workspace]
resolver = "3"
members = ["crates/*"]
# Turso (the conversation store's engine) is vendored with its own workspace: vendor/turso/UPSTREAM.md;
# so are Quiver, Focal's bus, hyper-raft, vorpal, aws-lc-rs, Mantle, Shards and Hex (vendor/MANIFEST.toml),
# each a workspace of its own.
exclude = ["vendor/turso", "vendor/quiver", "vendor/focal-bus", "vendor/hyper-raft", "vendor/vorpal", "vendor/aws-lc-rs", "vendor/mantle", "vendor/shards", "vendor/hex", "bench/kilndb", "bench/http"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hyper-light/kiln"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
exit = "deny"
type_complexity = "allow"

# Debug builds keep line tables (backtraces say file and line) but not full debug info: kiln's
# test binaries were 1.3-2 GB each, about 130 GB written per `cargo test --workspace`, and several
# gates at once stalled a whole file system's syncs (docs/headroom.md, 2026-10-26).
[profile.dev]
debug = "line-tables-only"

# Debug builds hash with optimized SHA-256. A server hashes its own (debug: over a GiB) binary as
# it starts, on one of its shards, and the content store hashes every chunk: unoptimized, that alone
# kept test servers from answering within a minute on a loaded machine.
[profile.dev.package.sha2]
opt-level = 3

# SQLite (the store's engine, built from C by rusqlite's libsqlite3-sys) optimized in dev and test
# builds too: unoptimized, a store's migrations alone took a scratch hub 75 ms; optimized, about 20
# (every test that opens a store, CP-M2's test timings among them).
[profile.dev.package.libsqlite3-sys]
opt-level = 2

# kiln's own crate in debug and test builds keeps line tables only (backtraces keep their files and
# lines): with full debug info its library is one archive past 4 GiB (5.4 GB on Windows with observe
# merged), and the COFF archive format MSVC's linker reads addresses members with 32 bits, so it
# refuses the library (LNK4003) and nothing of kiln links there.
[profile.dev.package.kiln]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

# What kiln vendors, each name pointed at its one copy (vendor/MANIFEST.toml; docs/vendoring.md,
# "Products and [patch]"): Quiver, Focal's bus, and hyper-raft's shared crates, which kiln takes too.
[patch.crates-io]
# aws-lc-rs at the release kiln takes, with Mantle's changes (vendor/aws-lc-rs/UPSTREAM.md).
aws-lc-rs = { path = "vendor/aws-lc-rs/aws-lc-rs" }
focal-bus = { path = "vendor/focal-bus/crates/focal-bus" }
focal-memory = { path = "vendor/focal-bus/crates/focal-memory" }
focal-platform = { path = "vendor/focal-bus/crates/focal-platform" }
hyper-block = { path = "vendor/hyper-raft/crates/hyper-block" }
hyper-durable = { path = "vendor/hyper-raft/crates/hyper-durable" }
hyper-liveness = { path = "vendor/hyper-raft/crates/hyper-liveness" }
hyper-log = { path = "vendor/hyper-raft/crates/hyper-log" }
hyper-measure = { path = "vendor/hyper-raft/crates/hyper-measure" }
hyper-quic = { path = "vendor/hyper-raft/crates/hyper-quic" }
hyper-raft = { path = "vendor/hyper-raft/crates/hyper-raft" }
# hyper-rt is kiln's own code: its runtime, crates/kiln-rt, taken from hyper-raft's crate at the
# revision vendored here (crates/kiln-rt/ORIGIN.md). Every crate kiln builds that names hyper-rt builds
# on it: kiln's by this patch; the vendored ones that take it by path, by their recorded changes
# (vendor/hyper-raft/UPSTREAM.md, vendor/mantle/UPSTREAM.md).
hyper-rt = { path = "crates/kiln-rt" }
hyper-rt-transport = { path = "vendor/hyper-raft/crates/hyper-rt-transport" }
hyper-seal = { path = "vendor/hyper-raft/crates/hyper-seal" }
hyper-swim = { path = "vendor/hyper-raft/crates/hyper-swim" }
hyper-timing = { path = "vendor/hyper-raft/crates/hyper-timing" }
hyper-transport = { path = "vendor/hyper-raft/crates/hyper-transport" }
# Hex, the runtime kiln's harness microVMs run under (vendor/hex), and Shards, those microVMs (vendor/shards), at
# kiln's one Shards revision (docs/shards.md): the crates kiln names, each at its copy, as their own root manifests
# point them; with what Hex vendors itself (seccompiler, its OCI seccomp profiles' compiler) and Shards' copy of
# QuickJS's C, which kiln's rquickjs builds too (vendor/shards/UPSTREAM.md).
hex-node = { path = "vendor/hex/crates/hex-node" }
rquickjs-sys = { path = "vendor/shards/vendor/rquickjs-sys" }
seccompiler = { path = "vendor/hex/vendor/seccompiler" }
shards-agentfile = { path = "vendor/shards/crates/agentfile" }
shards-api = { path = "vendor/shards/crates/api" }
shards-image = { path = "vendor/shards/crates/image" }
quiver = { path = "vendor/quiver/crates/quiver" }
quiver-api = { path = "vendor/quiver/crates/quiver-api" }
# vorpal, the search across a change (docs/ci.md W26-R07): its crates, the tree-sitter runtime it
# carries and the grammars kiln takes, each name at its copy under vendor/vorpal, as vorpal's own
# root manifest points them.
vorpal-core = { path = "vendor/vorpal/crates/core" }
vorpal-kg = { path = "vendor/vorpal/crates/kg" }
vorpal-language = { path = "vendor/vorpal/crates/language" }
vorpal-outline = { path = "vendor/vorpal/crates/outline" }
tree-sitter = { path = "vendor/vorpal/vendor/tree-sitter" }
tree-sitter-bash = { path = "vendor/vorpal/grammars/tree-sitter-bash" }
tree-sitter-c = { path = "vendor/vorpal/grammars/tree-sitter-c" }
tree-sitter-cpp = { path = "vendor/vorpal/grammars/tree-sitter-cpp" }
tree-sitter-css = { path = "vendor/vorpal/grammars/tree-sitter-css" }
tree-sitter-go = { path = "vendor/vorpal/grammars/tree-sitter-go" }
tree-sitter-html = { path = "vendor/vorpal/grammars/tree-sitter-html" }
tree-sitter-java = { path = "vendor/vorpal/grammars/tree-sitter-java" }
tree-sitter-javascript = { path = "vendor/vorpal/grammars/tree-sitter-javascript" }
tree-sitter-json = { path = "vendor/vorpal/grammars/tree-sitter-json" }
tree-sitter-md = { path = "vendor/vorpal/grammars/tree-sitter-md" }
tree-sitter-python = { path = "vendor/vorpal/grammars/tree-sitter-python" }
tree-sitter-rust = { path = "vendor/vorpal/grammars/tree-sitter-rust" }
tree-sitter-toml-ng = { path = "vendor/vorpal/grammars/tree-sitter-toml-ng" }
tree-sitter-typescript = { path = "vendor/vorpal/grammars/tree-sitter-typescript" }
tree-sitter-yaml = { path = "vendor/vorpal/grammars/tree-sitter-yaml" }
