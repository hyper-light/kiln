{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kiln.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kiln.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
{{- if .Values.jobServiceAccount.create }}
---
# Identity for job pods: no RBAC bindings, token not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.jobServiceAccount.name }}
  namespace: {{ include "kiln.jobsNamespace" . }}
  labels:
    {{- include "kiln.labels" . | nindent 4 }}
  {{- with .Values.jobServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
