{{- if not .Values.adminToken.existingSecret }}
{{- $name := include "kiln.adminSecretName" . }}
{{- $key := .Values.adminToken.secretKey }}
{{- $token := "" }}
{{- if .Values.adminToken.value }}
{{- $token = .Values.adminToken.value | b64enc }}
{{- else }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $token = index $existing.data $key }}
{{- else }}
{{- $token = randAlphaNum 48 | b64enc }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kiln.labels" . | nindent 4 }}
  annotations:
    # keep the admin token across uninstall/reinstall
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $token | quote }}
{{- end }}
