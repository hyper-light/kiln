{{- if .Values.rbac.create }}
# The server (kube-rs, in-cluster config) manages job pods and their per-job secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kiln.fullname" . }}-jobs
  namespace: {{ include "kiln.jobsNamespace" . }}
  labels:
    {{- include "kiln.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kiln.fullname" . }}-jobs
  namespace: {{ include "kiln.jobsNamespace" . }}
  labels:
    {{- include "kiln.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kiln.fullname" . }}-jobs
subjects:
  - kind: ServiceAccount
    name: {{ include "kiln.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
