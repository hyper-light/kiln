{{- if .Values.rbac.create }}
# The server (kube-rs, in-cluster config) manages job pods and their per-job secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kiln.fullname" . }}-jobs
  namespace: {{ include "kiln.jobsNamespace" . }}
  labels:
    {{- include "kiln.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kiln.fullname" . }}-jobs
  namespace: {{ include "kiln.jobsNamespace" . }}
  labels:
    {{- include "kiln.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kiln.fullname" . }}-jobs
subjects:
  - kind: ServiceAccount
    name: {{ include "kiln.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Settings → Updates: restart kiln's own Deployment onto the image now on the nodes (a rollout
# restart, as `kubectl rollout restart` does). Only this Deployment, only get and patch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kiln.fullname" . }}-self
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kiln.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{ include "kiln.fullname" . }}]
    verbs: [get, patch]
  # The guard of kiln's own deploy reads the new version's pods: their restarts, and kiln's report
  # of itself on each.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kiln.fullname" . }}-self
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kiln.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kiln.fullname" . }}-self
subjects:
  - kind: ServiceAccount
    name: {{ include "kiln.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if ne (.Values.rbac.deployments | default "none") "none" }}
---
# Deployments (docs/cd.md): read every object to compare what runs with git; with "write", also
# apply and delete them, as Argo CD's application controller does.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kiln.fullname" . }}-deployments
  labels:
    {{- include "kiln.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    {{- if eq .Values.rbac.deployments "write" }}
    verbs: ["*"]
    {{- else }}
    verbs: [get, list, watch]
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kiln.fullname" . }}-deployments
  labels:
    {{- include "kiln.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kiln.fullname" . }}-deployments
subjects:
  - kind: ServiceAccount
    name: {{ include "kiln.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
