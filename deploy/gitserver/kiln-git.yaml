# In-cluster read-only git server that ArgoCD pulls the kiln repo from while the repo has no
# public remote. Applied by deploy/cluster/bootstrap.sh (not by ArgoCD: it is the source ArgoCD
# reads from). Repo URL inside the cluster:
#   http://kiln-git.kiln-git.svc.cluster.local/kiln.git
apiVersion: v1
kind: Namespace
metadata:
  name: kiln-git
  labels:
    app.kubernetes.io/part-of: kiln
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kiln-git
  namespace: kiln-git
  labels:
    app.kubernetes.io/name: kiln-git
spec:
  accessModes: [ReadWriteOnce]
  # local-path (storage-provisioner-rancher) pins the volume to a node, so a rescheduled
  # pod finds its data. Change/remove for other clusters.
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiln-git
  namespace: kiln-git
  labels:
    app.kubernetes.io/name: kiln-git
    app.kubernetes.io/part-of: kiln
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kiln-git
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiln-git
        app.kubernetes.io/part-of: kiln
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git
          image: kiln-git:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: KILN_GIT_REPOS
              value: kiln
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /kiln.git/info/refs?service=git-upload-pack
              port: http
            periodSeconds: 10
          livenessProbe:
            # exercises nginx -> fcgiwrap -> git-http-backend end to end
            httpGet:
              path: /kiln.git/info/refs?service=git-upload-pack
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: repos
              mountPath: /srv/git
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: repos
          persistentVolumeClaim:
            claimName: kiln-git
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kiln-git
  namespace: kiln-git
  labels:
    app.kubernetes.io/name: kiln-git
spec:
  selector:
    app.kubernetes.io/name: kiln-git
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
