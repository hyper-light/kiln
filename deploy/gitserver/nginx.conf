# Read-only git smart HTTP (protocol v0/v1/v2) for http://<svc>/<repo>.git
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;
    client_max_body_size  0;
    server_tokens off;

    server {
        listen 8080 default_server;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # /<name>.git/info/refs, /<name>.git/git-upload-pack, /<name>.git/HEAD, objects/...
        location ~ ^/[A-Za-z0-9._-]+\.git(/.*)?$ {
            fastcgi_pass unix:/tmp/fcgiwrap.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME     /usr/libexec/git-core/git-http-backend;
            fastcgi_param GIT_PROJECT_ROOT    /srv/git;
            fastcgi_param GIT_HTTP_EXPORT_ALL "";
            fastcgi_param PATH_INFO           $uri;
            # git >= 2.18 reads protocol v2 negotiation from this header
            fastcgi_param GIT_PROTOCOL        $http_git_protocol;
            fastcgi_buffering off;
            fastcgi_read_timeout 600s;
        }

        location / {
            return 404;
        }
    }
}
