# Namespaces for the kiln stack (ArgoCD app `kiln-namespaces`, sync wave -2).
apiVersion: v1
kind: Namespace
metadata:
  name: kiln
  labels:
    app.kubernetes.io/part-of: kiln
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Job pods: build toolchain images often run as root, so `baseline`, not `restricted`.
apiVersion: v1
kind: Namespace
metadata:
  name: kiln-jobs
  labels:
    app.kubernetes.io/part-of: kiln
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
---
# node-exporter needs hostNetwork/hostPID/hostPath → privileged.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: kiln
    pod-security.kubernetes.io/enforce: privileged
