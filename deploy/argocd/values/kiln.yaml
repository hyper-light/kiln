# kiln chart overrides for the minikube dev cluster (layered on deploy/helm/kiln/values.yaml).

image:
  repository: kiln
  tag: dev                  # loaded into every node by `minikube image load kiln:dev`
  pullPolicy: IfNotPresent

# Created by deploy/cluster/bootstrap.sh; ArgoCD cannot use the chart's lookup-based generator.
adminToken:
  existingSecret: kiln-admin
  secretKey: token

namespaces:
  createJobs: false         # owned by the `kiln-namespaces` ArgoCD app

persistence:
  storageClass: local-path  # pinned to one node; survives pod reschedules
  size: 20Gi

# minikube's default `standard` hostpath class accepts ReadWriteMany; each node ends up with
# its own directory, which is exactly what a build cache wants.
cache:
  storageClass: standard
  accessModes: [ReadWriteMany]
  size: 100Gi

config:
  kubernetes:
    max_pods: 64

# kiln's own repository is on GitHub: its CI follows it there, like every hyper-light repository's
# (Argo CD still deploys from the in-cluster git server). Registered here because the repository
# was first added pointing at the in-cluster server, and discovery leaves names it already has.
extraConfig: |
  [[repos]]
  name = "hyper-light/kiln"
  clone_url = "https://github.com/hyper-light/kiln.git"

# Bare-metal agents outside the cluster: <minikube node IP>:30070/TCP and :30071/UDP
# (deploy/cluster/expose-lan.sh forwards host ports 7070/7071 to these for LAN machines).
externalService:
  enabled: true
  type: NodePort
  nodePorts:
    http: 30070
    quic: 30071
    webrtc: 30072

# WebRTC to live pages' viewers (docs/previews.md, "WebRTC"): UDP 7072 in the pod, its NodePort
# forwarded from this host's 7072/udp (`KILN_LAN_WEBRTC=1 deploy/cluster/expose-lan.sh up`), and
# viewers told this host's LAN and Tailscale addresses. Out of reach, they stay on their sockets.
ports:
  webrtc: 7072
webrtcAdvertise:
  - 192.168.1.77:7072
  - 100.107.111.49:7072

metrics:
  serviceMonitor:
    enabled: true
    skipCapabilityCheck: true   # sync waves guarantee the CRDs exist first
  prometheusRule:
    enabled: true
    skipCapabilityCheck: true
  dashboards:
    enabled: true

# This host (adacachy) forwards :7070/tcp and :7071/udp to the kiln NodePorts
# (deploy/cluster/expose-lan.sh), so agents on the LAN — and the UI join command — use it.
# Update if the host LAN address changes.
publicURL: http://192.168.1.77:7070
quicAdvertise: 192.168.1.77:7071
