# Values for the official argo-cd Helm chart (installed by deploy/cluster/bootstrap.sh):
#   helm upgrade --install argocd argo-cd --repo https://argoproj.github.io/argo-helm \
#     --version 10.10.2 -n argocd --create-namespace -f deploy/argocd/bootstrap/argocd-values.yaml
# Small single-replica footprint for a dev cluster.

global:
  domain: argocd.localhost

configs:
  params:
    # TLS is pointless behind `kubectl port-forward`; serve plain HTTP.
    server.insecure: true
  cm:
    # poll git every 60s (push.sh also triggers an immediate refresh)
    timeout.reconciliation: 60s
    timeout.reconciliation.jitter: 10s
    # Restore Application health assessment (removed from ArgoCD 1.8) so sync waves in the
    # app-of-apps wait for each child Application to become Healthy.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

dex:
  enabled: false
notifications:
  enabled: false

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
server:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
repoServer:
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 512Mi }
applicationSet:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
