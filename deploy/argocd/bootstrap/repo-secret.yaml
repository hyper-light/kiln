# Declarative ArgoCD repository registration (makes the repo visible under Settings → Repositories).
# Rendered by bootstrap.sh with __REPO_URL__ substituted. Public repos (in-cluster git server,
# or a public GitHub repo) need no credentials. For a private GitHub repo add
#   username: <anything>   password: <fine-grained PAT with Contents: read>
apiVersion: v1
kind: Secret
metadata:
  name: repo-kiln
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  name: kiln
  url: __REPO_URL__
