# Trial only, never on main: this branch's run is superseded by g9-tests-try4 and try5; this one only takes its group, so the
# queued run before it is cancelled.
name: g9-tests-try3

on:
  push:
    branches: [g9-tests-try3]

permissions:
  contents: read

concurrency:
  group: g9-tests-try3
  cancel-in-progress: true

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - run: echo "superseded by g9-tests-try4 and try5"
