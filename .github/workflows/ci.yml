# CI: the UI is built once and embedded into every Rust build (rust-embed reads ui/dist).
# Linux runs clippy and the tests; macOS and Windows check that kiln builds (clippy covers the
# tests' code too) on their native toolchains, and Windows runs the priority checks only Windows
# itself can answer (goal 3 step 1, goal 8 step 4).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # ui/dist comes from the `ui` job.
  KILN_SKIP_UI_BUILD: "1"
  # aws-lc-sys on x86_64 Windows: use the assembly objects shipped in the crate instead of NASM.
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci --no-audit --no-fund
      # The app, its tests and its mock server, against the wire types made from Rust
      # (ui/src/api/wire, held to the Rust by `cargo test -p kiln wire::ts`).
      - name: Typecheck
        working-directory: ui
        run: npm run typecheck
      - name: Lint
        working-directory: ui
        run: npm run lint
      - name: Test
        working-directory: ui
        run: npm test
      - name: Build
        working-directory: ui
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 7

  linux:
    name: linux (clippy, tests)
    needs: ui
    runs-on: ubuntu-latest
    env:
      # Line tables are the debug info a test's backtrace needs, at far less memory: kiln's crate
      # takes 7 GiB and more to compile (as .kiln/ci.yaml's rust job builds it).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy -p kiln --all-targets --locked -- -D warnings
      # Built apart, the library as its tests first, then the rest: kiln's crate compiled twice at
      # once (the library, and the library as its tests) ran the runner's 16 GB out, and GitHub shut
      # the runner down mid-build.
      - name: Build the library's tests
        run: cargo test -p kiln --locked --lib --no-run
      - name: Tests
        run: cargo test -p kiln --locked

  build:
    name: ${{ matrix.os }} (clippy, build)
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        shell: bash
        run: cargo clippy -p kiln --all-targets --locked -- -D warnings
      - name: Build
        shell: bash
        run: cargo build -p kiln --locked

  # Goal 3 step 1 and goal 8 step 4, on Windows itself (the `build` job only builds there, and the
  # release's Windows binary is cross-built with zig): the compute pool's threads run below normal,
  # read back by GetThreadPriority (kiln-rt's compute tests); agents' and CI steps' job objects run
  # what's in them below normal at the least CPU weight, with very low memory and I/O priority, and
  # the server runs above normal, each read back from Windows (kiln's g8_s4 tests). Only those
  # tests, and no UI: kiln's tests build without ui/dist.
  windows-priority:
    name: windows (priority checks)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: build
        name: Build the tests
        run: |
          cargo test -p hyper-rt --locked --test compute --test compute_beside --test compute_wait --no-run 2>&1 | tee "$RUNNER_TEMP/build.txt"
          cargo test -p kiln --locked --lib --no-run 2>&1 | tee -a "$RUNNER_TEMP/build.txt"
      - id: compute
        name: The compute pool's threads run below normal (goal 3 step 1)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: cargo test -p hyper-rt --locked --test compute --test compute_beside --test compute_wait -- --nocapture 2>&1 | tee "$RUNNER_TEMP/compute.txt"
      - id: jobs
        name: Job objects below normal, the server above normal (goal 8 step 4)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: cargo test -p kiln --locked --lib -- os::contain::tests::g8_s4 --nocapture 2>&1 | tee "$RUNNER_TEMP/jobs.txt"
      # A run's logs take a GitHub sign-in to read; its annotations don't. What each test step said
      # (its last 150 lines) and a failed build (150 from its first error), without cargo's
      # progress, each as one annotation.
      - name: Report
        if: ${{ always() }}
        env:
          OUTCOMES: build=${{ steps.build.outcome }} compute=${{ steps.compute.outcome }} jobs=${{ steps.jobs.outcome }}
        run: |
          set +e +o pipefail
          for said in $OUTCOMES; do
            step=${said%%=*} outcome=${said#*=}
            out="$RUNNER_TEMP/$step.txt"
            if [ ! -s "$out" ] || { [ "$step" = build ] && [ "$outcome" != failure ]; }; then continue; fi
            plain=$(sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\r$//' "$out" | grep -v -E '^ *(Compiling|Blocking|Downloaded|Downloading|Updating|Locking|Finished) ')
            text=$(printf '%s\n' "$plain" | sed -n '/^error/,$p' | head -n 150)
            if [ "$step" != build ] || [ -z "$text" ]; then text=$(printf '%s\n' "$plain" | tail -n 150); fi
            level=notice
            if [ "$outcome" != success ]; then level=error; fi
            echo "::$level title=$step $outcome::$(printf '%s\n' "$text" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')"
          done
