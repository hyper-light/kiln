# Trial only, never on main (goal 11, plan 01a1a87b2e56 step 1): the lab's realistic profile, calm, against a
# release kiln built here with its symbols, the server's memory sampled through each round (smaps, glibc's
# malloc_info, a jemalloc heap profile), the results summarized and committed to the branch g11-memory-results.
name: g11-memory-try

on:
  push:
    branches: [g11-memory-try]

permissions:
  contents: write

concurrency:
  group: g11-memory-try
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  KILN_UI_SERVER: "off"

jobs:
  lab:
    name: lab memory (realistic, calm)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Room (disk, swap, ptrace for gdb)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 16G /mnt/g11-swap && sudo chmod 600 /mnt/g11-swap && sudo mkswap /mnt/g11-swap && sudo swapon /mnt/g11-swap || true
          sudo sysctl -w kernel.yama.ptrace_scope=0
          sudo apt-get update -qq && sudo apt-get install -y -qq libjemalloc2 gdb binutils > /dev/null
          ls -la /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
          df -h / /mnt; free -g; nproc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI
        working-directory: ui
        run: npm ci --no-audit --no-fund --loglevel=error && npm run build
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build (release, symbols kept)
        timeout-minutes: 200
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
          CARGO_TARGET_DIR: /mnt/target
        run: |
          sudo mkdir -p /mnt/target /mnt/lab && sudo chown "$USER" /mnt/target /mnt/lab
          cargo build --locked --release -p kiln -p kiln-lab --bin kiln --bin kiln-lab -j 3 2>&1 | grep -v -E '^ *(Compiling|Downloaded|Downloading) ' | tail -40
          ls -la /mnt/target/release/kiln /mnt/target/release/kiln-lab
          nm -n -C --defined-only /mnt/target/release/kiln | awk '$2 ~ /^[tTwW]$/' > /mnt/lab/syms.txt
          readelf -lW /mnt/target/release/kiln > /mnt/lab/segments.txt
          readelf -SW /mnt/target/release/kiln > /mnt/lab/sections.txt
      - name: Lab rounds
        timeout-minutes: 90
        env:
          G11_KILN: /mnt/target/release/kiln
          G11_JEMALLOC_LIB: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
        run: |
          set +e
          L=/mnt/target/release/kiln-lab W=$GITHUB_WORKSPACE/.github/g11/kiln-wrap.sh
          chmod +x .github/g11/*.sh
          for spec in "glibc G11_GDB=1" "arena2 G11_GDB=1 MALLOC_ARENA_MAX=2" "jeprof G11_JEMALLOC=1" "jemalloc G11_JEMALLOC=2"; do
            set -- $spec; label=$1; shift
            args=(); for e in "$@"; do args+=(--env "$e"); done
            echo "=== $label $(date -u +%T) $(free -m | awk '/Mem/ {print $7 " MB available"}')"
            timeout 1500 "$L" run --kiln "$W" --label "$label" --profile realistic --rounds 1 --keep "${args[@]}" --out "/mnt/lab/$label" > "/mnt/lab/$label.stdout" 2> "/mnt/lab/$label.stderr"
            echo "exit $? $(date -u +%T)"; tail -3 "/mnt/lab/$label.stderr"
          done
      - name: Summarize and commit
        if: ${{ always() }}
        run: |
          set +e
          R=$RUNNER_TEMP/results; mkdir -p "$R"
          for d in /mnt/lab/*/; do
            label=$(basename "$d"); mkdir -p "$R/$label"
            python3 -I .github/g11/summarize.py "$d" /mnt/lab/syms.txt /mnt/lab/segments.txt > "$R/$label/summary.txt" 2>&1
            cp "$d/run.json" "$d/report.md" "$R/$label/" 2>/dev/null
            for m in "$d"/mem/*/; do
              r=$R/$label/mem/$(basename "$m"); mkdir -p "$r"
              cp "$m"/rss.csv "$m"/env.txt "$m"/sampler.log "$m"/smaps.index "$m"/malloc.index "$r/" 2>/dev/null
              last=$(tail -1 "$m/smaps.index" 2>/dev/null | cut -d' ' -f1); [ -n "$last" ] && gzip -c "$m/smaps.$last" > "$r/smaps.last.gz"
              xml=$(ls -t "$m"/malloc-*.xml 2>/dev/null | head -1); [ -n "$xml" ] && gzip -c "$xml" > "$r/malloc.last.xml.gz"
              heap=$(ls -t "$m"/jeprof.*.heap 2>/dev/null | head -1); [ -n "$heap" ] && gzip -c "$heap" > "$r/jeprof.last.heap.gz"
            done
            for s in "$d"/rounds/*/; do tail -200 "$s/server.log" > "$R/$label/server-$(basename "$s").log.txt" 2>/dev/null; done
            cp "/mnt/lab/$label.stderr" "$R/$label/lab.stderr.txt" 2>/dev/null
          done
          cp /mnt/lab/sections.txt /mnt/lab/segments.txt "$R/" 2>/dev/null
          echo "${{ github.sha }}" > "$R/COMMIT"
          cd "$RUNNER_TEMP" && git init -q out && cd out && cp -r "$R" results
          git config user.name "kiln g11 lab" && git config user.email "g11-lab@users.noreply.github.com"
          git add results && git commit -q -m "g11 lab results for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/g11-memory-results
          for f in "$R"/*/summary.txt; do
            echo "::notice title=$(basename "$(dirname "$f")")::$(head -n 150 "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')"
          done
