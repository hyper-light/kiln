# Trial only, never on main (goal 11, plan 01a1a87b2e56): goal 11's parts checked on macOS (clippy of kiln and
# kiln-lab, kiln built with the mimalloc feature and run), and on Linux the session_resident test with the
# conversation store and without it. Results go to the branch g11-memory-checks4-results.
name: g11-memory-checks4

on:
  push:
    branches: [g11-memory-checks4]

permissions:
  contents: write

concurrency:
  group: g11-memory-checks4
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  KILN_UI_SERVER: "off"

jobs:
  macos:
    name: macos (clippy, the mimalloc build)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Clippy, and the mimalloc build run
        run: |
          set +e
          R=$RUNNER_TEMP/mac; mkdir -p "$R"
          cargo clippy -p kiln -p kiln-lab --all-targets --locked -- -D warnings > "$R/clippy.txt" 2>&1; echo "clippy exit $?" | tee -a "$R/summary.txt"
          cargo clippy -p kiln --features mimalloc --locked -- -D warnings > "$R/clippy-mimalloc.txt" 2>&1; echo "clippy mimalloc exit $?" | tee -a "$R/summary.txt"
          cargo build -p kiln --features mimalloc --locked > "$R/build-mimalloc.txt" 2>&1; echo "build mimalloc exit $?" | tee -a "$R/summary.txt"
          ./target/debug/kiln --version > "$R/run-mimalloc.txt" 2>&1; echo "run mimalloc exit $?" | tee -a "$R/summary.txt"
          cat "$R/run-mimalloc.txt" >> "$R/summary.txt"
          cargo test --locked -p kiln --lib -- g11 shard_health ui:: memory:: > "$R/lib-tests.txt" 2>&1; echo "lib tests exit $?" | tee -a "$R/summary.txt"
          grep -E "^(error|warning)|^test result" "$R"/clippy*.txt "$R"/build-mimalloc.txt "$R"/lib-tests.txt | grep -v "focal-memory\|fetch_update" | head -60 >> "$R/summary.txt"
          echo "${{ github.sha }}" > "$R/COMMIT"
          cd "$RUNNER_TEMP" && git init -q out && cd out && mkdir results && cp "$R/summary.txt" "$R/COMMIT" results/
          for f in clippy clippy-mimalloc build-mimalloc lib-tests; do grep -v -E '^ *(Compiling|Checking|Downloaded|Downloading) ' "$R/$f.txt" | tail -200 > "results/$f.txt"; done
          git config user.name "kiln g11 lab" && git config user.email "g11-lab@users.noreply.github.com"
          git add results && git commit -q -m "g11 macos checks for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/g11-memory-checks4-mac
          grep -q "clippy exit 0" "$R/summary.txt" && grep -q "clippy mimalloc exit 0" "$R/summary.txt" && grep -q "run mimalloc exit 0" "$R/summary.txt" && grep -q "lib tests exit 0" "$R/summary.txt"

  resident:
    name: linux (session_resident, with and without the conversation store)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /mnt/target && sudo chown "$USER" /mnt/target
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: session_resident
        env:
          CARGO_TARGET_DIR: /mnt/target
        run: |
          set +e
          R=$RUNNER_TEMP/res; mkdir -p "$R"
          cargo test --locked -p kiln --test session_resident -- --nocapture > "$R/on.txt" 2>&1; echo "store on exit $?" | tee -a "$R/summary.txt"
          G11_RESIDENT_CONVERSATIONS=off cargo test --locked -p kiln --test session_resident -- --nocapture > "$R/off.txt" 2>&1; echo "store off exit $?" | tee -a "$R/summary.txt"
          grep -h -E "g11 resident|^test result|panicked|^error" "$R/on.txt" "$R/off.txt" >> "$R/summary.txt"
          echo "${{ github.sha }}" > "$R/COMMIT"
          cd "$RUNNER_TEMP" && git init -q out && cd out && mkdir results && cp "$R/summary.txt" "$R/COMMIT" results/ && tail -60 "$R/on.txt" > results/on.txt && tail -60 "$R/off.txt" > results/off.txt
          git config user.name "kiln g11 lab" && git config user.email "g11-lab@users.noreply.github.com"
          git add results && git commit -q -m "g11 resident for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/g11-memory-checks4-resident
