# Release: build kiln for every supported platform and publish a GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0      # the tag must match the workspace version
#   Actions → release → Run workflow              # a draft release for v<workspace version>
#
# Assets of release v<version>, for each target:
#   kiln-<version>-<target>.tar.gz | .zip   the binary plus README, for people
#   kiln-<version>-<target>[.exe]           the bare binary: what a server's /dl/kiln/<target>
#                                           redirects to, and what install.sh / install.ps1 fetch
#   SHA256SUMS                              sha256 of every asset above
#
# Only the built-in GITHUB_TOKEN is used. The UI is built once and embedded in every binary.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft (its tag v<version> is made when it is published)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # ui/dist comes from the `ui` job.
  KILN_SKIP_UI_BUILD: "1"
  # aws-lc-sys on x86_64 Windows: use the assembly objects shipped in the crate instead of NASM.
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Workspace version (and tag check)
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then echo "::error::no version in [workspace.package]"; exit 1; fi
          # A binary redirects agents to the assets of release v<its version>, so they must agree.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 7

  build:
    name: build ${{ matrix.target }}
    needs: [version, ui]
    strategy:
      fail-fast: false
      matrix:
        # Everything is cross-built on Linux with zig (ci/release/build.sh, the same script kiln's
        # own release pipeline runs): static musl for Linux, the GNU ABI for Windows, and macOS
        # against ci/release/macos-stubs. No macOS, Windows or ARM hosted runners are needed.
        target:
          - aarch64-apple-darwin
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: |
          # The MSVC prebuilt-NASM objects aren't for this cross build.
          unset AWS_LC_SYS_PREBUILT_NASM
          ci/release/build.sh "$TARGET"
      - name: Check the binary
        run: |
          exe=""; case "$TARGET" in *windows*) exe=".exe" ;; esac
          bin="dist/kiln-$TARGET$exe"
          file "$bin"
          case "$TARGET" in
            *linux-musl)
              # Job pods copy this binary into arbitrary images: it must not need a loader.
              if readelf -l "$bin" | grep -q INTERP; then echo "::error::$bin is not static"; exit 1; fi ;;
          esac
          if [ "$TARGET" = x86_64-unknown-linux-musl ]; then "$bin" --version; fi
      - name: Package
        run: |
          exe=""; case "$TARGET" in *windows*) exe=".exe" ;; esac
          name="kiln-$VERSION-$TARGET"
          mkdir -p "pkg/$name" out
          cp "dist/kiln-$TARGET$exe" "pkg/$name/kiln$exe"
          cp README.md "pkg/$name/"
          cp "dist/kiln-$TARGET$exe" "out/$name$exe"
          cd pkg
          case "$TARGET" in
            *windows*) zip -qr "../out/$name.zip" "$name" ;;
            *) tar -czf "../out/$name.tar.gz" "$name" ;;
          esac
          ls -l ../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: |
          sha256sum -- kiln-* > SHA256SUMS
          cat SHA256SUMS
      - name: Release
        working-directory: out
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            # A re-run: replace the assets of the existing release.
            gh release upload "$tag" --clobber -- *
            exit 0
          fi
          args=(--title "kiln $VERSION" --generate-notes)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            args+=(--target "$GITHUB_SHA")
            if [ "$DRAFT" = true ]; then args+=(--draft); fi
          else
            args+=(--verify-tag)
          fi
          gh release create "$tag" "${args[@]}" -- *
