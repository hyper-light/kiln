# Trial only, never on main (goal 10, plan 01a1a87b2dae step 2): the sealed chunks packer and lazy digests (goal 10 step 3); before: the reads kept in memory (plans, goal
# stacks, the store's change counts), on goal 5's g5-lockless-hotpath: kiln's tests for what they touch,
# and clippy of kiln for Linux, on GitHub's runners (adacachy's disk is short).
name: g10-pack-try

on:
  push:
    branches: [g10-pack-try]

permissions:
  contents: read

concurrency:
  group: g10-pack-try
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  KILN_UI_SERVER: "off"

jobs:
  survivors:
    name: the process tests, ${{ matrix.side }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { side: this branch, ref: "" }
          - { side: main 29fa3f34d62, ref: 29fa3f34d62132e8669b4520885fe6da7967bfda }
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - name: Room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          nproc; free -g; df -h /
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: The three alone, then their modules
        run: |
          cargo test --locked -p kiln --lib -j 2 -- --exact harness::host::tests::what_a_session_left_running_is_taken_back_over_after_a_restart harness::survivors::tests::a_harness_started_while_a_look_goes_on_is_never_left_running harness::survivors::tests::what_a_session_started_is_found_under_it_or_by_its_mark_until_it_is_stopped
          cargo test --locked -p kiln --lib -j 2 -- harness::survivors:: harness::host::
