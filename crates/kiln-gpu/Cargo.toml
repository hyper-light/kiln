[package]
name = "kiln-gpu"
description = "Retained GPU telemetry, ported from Hex: NVIDIA NVML, Linux amdgpu and Windows ADL"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = "2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
cap = { version = "0.1.2", features = ["stats"] }
tempfile = "3.27.0"

[lints]
workspace = true
