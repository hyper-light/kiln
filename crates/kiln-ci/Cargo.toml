[package]
name = "kiln-ci"
description = "kiln's CI core: expressions, workflows, planning and scheduling, as pure code with no clock, disk or network (docs/ci.md)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
regex = "1"
aho-corasick = "1.1.5"
base64 = "0.23.1"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
yaml-rust2 = "0.13"
# Time zones for schedules (W03-R10), with the tz database built in so every host decides alike.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
fancy-regex = "0.19.2"
# Lockfiles for SBOMs (W18-R03).
toml = "1.1.8"
# Identities' certificate chains, checked (W27-R01): parsing and signatures, the same crates and
# backend the kiln crate's CA uses.
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
aws-lc-rs = "1.18.2"

[dev-dependencies]
anyhow = "1.0.104"
proptest = "1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }

[[bench]]
name = "expr"
harness = false

[lints]
workspace = true
