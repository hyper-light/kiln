[package]
name = "kiln-obs"
description = "kiln's observability engine: columnar time series, logs and events, the query language, monitors' rules (docs/observe.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = "2.0.21"
# std's own SwissTable, already in kiln's tree: its `HashTable` keeps every key in the store's
# arenas, no allocation a key.
hashbrown = { version = "0.17.1", default-features = false }
# Series fingerprints (`batch::fingerprint`): stable across builds and nodes, already in kiln's tree.
sha2 = "0.11.1"
# Replication (`docs/observe.md` §5): the store is a hyper-durable state machine on a hyper-log
# group, at the revision the rest of kiln pins.
hyper-raft = { git = "https://github.com/hyper-light/hyper-raft", rev = "767627fb9b15e9912aa4accb2d92db2d9518d6b1" }
hyper-durable = { git = "https://github.com/hyper-light/hyper-raft", rev = "767627fb9b15e9912aa4accb2d92db2d9518d6b1" }
hyper-log = { git = "https://github.com/hyper-light/hyper-raft", rev = "767627fb9b15e9912aa4accb2d92db2d9518d6b1" }
hyper-block = { git = "https://github.com/hyper-light/hyper-raft", rev = "767627fb9b15e9912aa4accb2d92db2d9518d6b1" }

[dev-dependencies]
tempfile = "3.27.0"
# Only to measure LZ4 against deflate (benches/lz4.rs); kiln has it already.
flate2 = "1.1.10"
hyper-measure = { git = "https://github.com/hyper-light/hyper-raft", rev = "767627fb9b15e9912aa4accb2d92db2d9518d6b1" }

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "lz4"
harness = false

[[bench]]
name = "logs"
harness = false

[[bench]]
name = "group"
harness = false

[[bench]]
name = "otlp"
harness = false

[lints]
workspace = true
