[package]
name = "kiln-cd"
description = "kiln's deployment engine: render, compare and sync applications, as a state machine with no clock, disk or network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
lz4_flex = "0.14.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[lints]
workspace = true
