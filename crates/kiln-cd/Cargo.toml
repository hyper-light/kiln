[package]
name = "kiln-cd"
description = "kiln's deployment engine: render, compare and sync applications, as a state machine with no clock, disk or network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hyper-raft = "=0.1.0"
hyper-durable = "=0.1.0"
hyper-log = "=0.1.0"
hyper-block = "=0.1.0"
parking_lot = "0.12.5"
anyhow = "1.0.104"
base64 = "0.23.1"
glob = "0.3.4"
lz4_flex = "0.14.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tar = "0.4.46"
toml = "1.1.8"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
futures = "0.3.34"
tracing = "0.1.44"
# Argo CD's health checks are gopher-lua's Lua: 5.1 with 5.2's goto. Lua 5.2 is that (doubles only, goto),
# built from source (zig cross-builds it like any C); 5.1's table.getn and unpack are shimmed.
mlua = { version = "0.12.2", features = ["lua52", "vendored", "send", "serde"] }

[dependencies.mimalloc]
version = "0.1"
optional = true
default-features = false

[features]
# The benchmark binary's allocator, to measure what the allocator costs (`--features mimalloc`).
mimalloc = ["dep:mimalloc"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
