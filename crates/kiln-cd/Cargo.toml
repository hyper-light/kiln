[package]
name = "kiln-cd"
description = "kiln's deployment engine: render, compare and sync applications, as a state machine with no clock, disk or network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
glob = "0.3.4"
lz4_flex = "0.14.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tar = "0.4.46"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dependencies.mimalloc]
version = "0.1"
optional = true
default-features = false

[features]
# The benchmark binary's allocator, to measure what the allocator costs (`--features mimalloc`).
mimalloc = ["dep:mimalloc"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
