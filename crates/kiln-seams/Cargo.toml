[package]
name = "kiln-seams"
description = "The seams kiln reaches every product through (Clock, Spawn, Records, Bus, Blobs, Secrets, Artifacts, Sandbox, Placement, HarnessPort, Forge, Search): each trait, its simulator, and the conformance suite every implementation passes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
event-listener = "5.4.2"
futures = "0.3.34"
hex = "0.4.3"
parking_lot = "0.12.5"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = "0.3.55"
x509-parser = "0.18.1"
zeroize = "1.9.1"

[lints]
workspace = true
