[package]
name = "kiln"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hyper-transport = { git = "https://github.com/hyper-light/hyper-raft", rev = "767627fb9b15e9912aa4accb2d92db2d9518d6b1" }
hyper-rt = { git = "https://github.com/hyper-light/hyper-raft", rev = "767627fb9b15e9912aa4accb2d92db2d9518d6b1" }
hyper-rt-transport = { git = "https://github.com/hyper-light/hyper-raft", rev = "767627fb9b15e9912aa4accb2d92db2d9518d6b1" }
hyper-quic = { git = "https://github.com/hyper-light/hyper-raft", rev = "767627fb9b15e9912aa4accb2d92db2d9518d6b1", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
glob = "0.3.4"
hex = "0.4.3"
mime_guess = "2.0.5"
nix = { version = "0.31.3", features = ["signal", "process", "fs", "user", "term", "feature", "hostname", "net"] }
parking_lot = "0.12.5"
portable-pty = "0.9.0"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }
postcard = { version = "1.1.3", features = ["alloc"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
x509-parser = "0.18.1"
tar = "0.4.46"
hmac = "0.13.0"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
async-channel = "2.5.0"
async-broadcast = "0.7.2"
event-listener = "5.4.2"
webpki-roots = "1.0.9"
flate2 = "1.1.10"
async-tungstenite = { version = "0.35.0", default-features = false, features = ["handshake"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
async-lock = "3.4.2"
rustix = { version = "1.1", features = ["process"] }
filedescriptor = "0.8"
argon2 = "0.6"
rpassword = "7"
socket2 = { version = "0.6.5", features = ["all"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
