[package]
name = "kiln-http"
description = "kiln's HTTP: HTTP/1.1 and HTTP/2, server and client, on hyper-rt (no tokio, no hyper)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# kiln's runtime, by name: the root manifest's [patch.crates-io] points hyper-rt at crates/kiln-rt,
# kiln's own copy of hyper-raft's (crates/kiln-rt/ORIGIN.md; docs/vendoring.md).
hyper-rt = "=0.1.0"
bytes = "1.12.1"
futures-channel = "0.3.34"
futures-core = "0.3.34"
futures-io = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
httparse = "1.10.1"
memchr = "2.8.3"
tracing = "0.1.44"

[dev-dependencies]
futures = "0.3.34"
http-body-util = "0.1.5"

[lints]
workspace = true
