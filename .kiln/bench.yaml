# Benchmarks on real hardware. `exclusive: true` makes the bench job the sole occupant of its
# agent, so nothing else perturbs the measurement; `noise` is independent work that must wait.
name: bench
on:
  push: { branches: [main], paths: ["crates/**"] }
  manual: true
jobs:
  quic-transport:
    name: QUIC transport bench (hardware)
    runs-on: [baremetal, bench]
    exclusive: true
    timeout-minutes: 30
    steps:
      - name: build (release)
        run: cargo test --release --locked -p kiln --no-run
      - name: hyper-transport agent⇄server round trips
        run: |
          for i in 1 2 3 4 5; do
            start=$(date +%s.%N)
            cargo test --release --locked -p kiln net::tests -- --quiet 2>&1 | grep -E "test result"
            python3 -c "import sys,time; print(f\"run $i: {time.time()-float(sys.argv[1]):.3f} s\")" "$start"
          done
      - name: hardware
        run: nproc && grep -m1 "model name" /proc/cpuinfo && free -h | head -2
  ci-bench:
    # The CI engine's performance targets (docs/ci.md §1.5, W22-AC08): a miss fails the step; a
    # result more than 10 % worse than its history fails the job (W16's interval rule).
    name: CI engine targets (hardware)
    runs-on: [baremetal, bench]
    exclusive: true
    timeout-minutes: 60
    bench-gate: { metric: "ci.bench.*", max-regression: 10%, same-fingerprint: true, action: fail }
    steps:
      - name: build (release)
        run: cargo build --release --locked -p kiln
      - name: kiln ci bench
        run: target/release/kiln ci bench --out target/ci-bench.json
  noise:
    # The bench's own machine: the point is that it waits for the exclusive bench there.
    runs-on: [baremetal, bench]
    steps:
      - run: echo "independent work; must not overlap the exclusive bench"; sleep 5
