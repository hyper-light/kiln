# Benchmarks on real hardware. `exclusive: true` makes the bench job the sole occupant of its
# agent, so nothing else perturbs the measurement; `noise` is independent work that must wait.
name: bench
on:
  push: { branches: [main], paths: ["crates/**"] }
  manual: true
# One bench run at a time per event and branch (W25): the newest push waits for the run under way
# and replaces an older one waiting, so a backlog comes down to the newest commit, and a person's
# manual run isn't dropped for a push.
concurrency: { group: "bench-${{ event }}-${{ branch }}", cancel-in-progress: false }
jobs:
  quic-transport:
    name: QUIC transport bench (hardware)
    # Any open Linux machine that builds kiln (its steps read /proc and GNU date): v1 places it on
    # the runner meeting `requires` with the most room, and `exclusive` keeps that runner its own.
    runs-on: [baremetal]
    requires: ["os == linux", "tools has cargo", "tools has python3"]
    exclusive: true
    timeout-minutes: 30
    steps:
      - name: build (release)
        run: cargo test --release --locked -p kiln --no-run
      - name: hyper-transport agent⇄server round trips
        run: |
          for i in 1 2 3 4 5; do
            start=$(date +%s.%N)
            cargo test --release --locked -p kiln net::tests -- --quiet 2>&1 | grep -E "test result"
            python3 -c "import sys,time; print(f\"run $i: {time.time()-float(sys.argv[1]):.3f} s\")" "$start"
          done
      - name: hardware
        run: nproc && grep -m1 "model name" /proc/cpuinfo && free -h | head -2
  ci-bench:
    # The CI engine's performance targets (docs/ci.md §1.5, W22-AC08): a miss fails the step; a
    # result more than 10 % worse than its history fails the job (W16's interval rule).
    # Any open Linux or macOS machine that builds kiln; `same-fingerprint` compares a result only
    # with earlier ones from the same hardware, wherever the bench lands.
    name: CI engine targets (hardware)
    runs-on: [baremetal]
    requires: ["os in [linux, macos]", "tools has cargo"]
    exclusive: true
    timeout-minutes: 60
    bench-gate: { metric: "ci.bench.*", max-regression: 10%, same-fingerprint: true, action: fail }
    steps:
      - name: build (release)
        # A Mac runner's launchd PATH has none of the usual tools in it.
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && cargo build --release --locked -p kiln
      - name: kiln ci bench
        run: target/release/kiln ci bench --out target/ci-bench.json
  noise:
    # The `bench`-labelled runner: it waits there whenever an exclusive bench holds that runner.
    runs-on: [baremetal, bench]
    steps:
      - run: echo "independent work; must not overlap the exclusive bench"; sleep 5
