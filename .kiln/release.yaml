# kiln ships itself. One Linux runner cross-builds every platform's binary with zig
# (ci/release/build.sh) and leaves them as this job's artifacts; the server keeps them (`[updates]`)
# as what each platform's runners upgrade to, and serves them at /dl/kiln/<target>, so remote
# upgrades and `install.sh` / `install.ps1` work on Linux, macOS and Windows with nothing but this
# server. Start it from Settings → Updates (Build every platform), or by pushing a v* tag.
# ci/release/publish.sh still hands dist/ to another server by hand.
name: release
on:
  tag: { branches: ["v*"] }
  manual: true
concurrency: { group: release, cancel-in-progress: false }
jobs:
  binaries:
    name: build every platform
    # A Linux machine with rustup, python3 and node: the server's own runner. Release builds are
    # CPU-bound; nothing else should share the machine meanwhile.
    runs-on: [baremetal, local]
    exclusive: true
    timeout-minutes: 90
    steps:
      - name: ui
        run: npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui build
      - name: build
        run: ci/release/build.sh
    artifacts: ["dist/*"]
