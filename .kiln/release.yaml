# kiln ships itself: every push to main builds every platform's binary, all at once, each on a
# machine of its own platform where there is one (ci/release/build.sh): Linux and Windows on the
# server's own Linux machine, macOS natively on a Mac. Each job leaves its binaries as artifacts;
# the server keeps them (`[updates]`) as what each platform's runners upgrade to once it runs that
# commit, and serves them at /dl/kiln/<target>, so remote upgrades and `install.sh` /
# `install.ps1` work on Linux, macOS and Windows with nothing but this server. A server running a
# commit with no binaries yet builds it again itself (System → Builds: Build every platform),
# and a v* tag builds too. The build under way always finishes (W25): a newer push to the branch
# waits for it and replaces an older push still waiting, and a server's own build of its commit (a
# manual run) does the same among manual builds only, so pushes coming faster than a Mac builds
# can't keep the commit the server runs from ever having all its binaries. v1's
# `cancel-in-progress` is one boolean for the group, so tag builds queue the same way.
# ci/release/publish.sh still hands dist/ to another server by hand.
name: release
on:
  push: { branches: [main] }
  tag: { branches: ["v*"] }
  manual: true
concurrency: { group: "release-${{ event }}-${{ branch }}", cancel-in-progress: false }
jobs:
  linux:
    name: Linux (x86-64, ARM64)
    # Any open Linux machine with rustup, python3 and node (W25): v1 places it on the runner
    # meeting `requires` with the most room; build.sh adds its own rust targets and pinned zig,
    # and packs the Shards each binary carries (ci/shards/pack.sh, docs/shards.md).
    runs-on: [baremetal]
    requires: ["os == linux", "tools has cargo", "tools has python3", "tools has node"]
    timeout-minutes: 90
    steps:
      # One UI build per ui/ tree for ci, release and image (docs/ci.md W28-R77): this step's text,
      # memo and place among memo steps are the same in every job that builds the UI, so is its key
      # (W28-R70), and the first job to reach it builds it while the others wait and take it
      # (W28-R72). The PATH line is for a Mac's launchd service, whose PATH has no tools in it.
      - name: ui
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && npm ci --prefix ui --no-audit --no-fund && KILN_UI_SERVER=off npm run --prefix ui build
      # One x86_64-unknown-linux-musl build per commit for release and the image (W28-R78): the
      # same text and memo in both, after the shared UI step; its commit named, as the binary
      # embeds it (KILN_COMMIT).
      - name: x86_64 musl
        run: KILN_COMMIT=$KILN_SHA nice -n 10 ci/release/build.sh x86_64-unknown-linux-musl
      - name: aarch64 musl
        run: nice -n 10 ci/release/build.sh aarch64-unknown-linux-musl
    artifacts: ["dist/*"]

  # The Shards kiln's Windows binary carries (docs/shards.md), packed on Windows: Shards builds and
  # tests its Windows binaries with MSVC on Windows (its .github/workflows/release.yml), which a
  # Linux machine has no toolchain for. Like macOS's build waiting for a Mac, Windows's waits for
  # a Windows machine. Its steps run in Git Bash, found beside git: `shell: bash` would take
  # whichever bash.exe Windows finds first, WSL's in System32 among them.
  shards-windows:
    name: Shards for Windows (x86-64), on Windows
    runs-on: [baremetal, windows]
    requires: ["os == windows", "arch == x86_64", "tools has cargo", "tools has git"]
    timeout-minutes: 90
    steps:
      - name: pack
        shell: powershell
        run: |
          $git = Split-Path (Get-Command git -ErrorAction Stop).Source
          $bash = @('..\bin\bash.exe', '..\usr\bin\bash.exe', '..\..\bin\bash.exe') | ForEach-Object { Join-Path $git $_ } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bash) { throw "no Git Bash beside git ($git)" }
          & $bash ci/shards/pack.sh x86_64-pc-windows-msvc
      - uses: kiln/upload@v1
        with:
          name: shards-x86_64-pc-windows-msvc
          path: target/shards-carried/x86_64-pc-windows-msvc

  windows:
    name: Windows (x86-64, cross-built)
    needs: [shards-windows]
    runs-on: [baremetal]
    requires: ["os == linux", "tools has cargo", "tools has python3", "tools has node"]
    timeout-minutes: 90
    steps:
      # One UI build per ui/ tree for ci, release and image (docs/ci.md W28-R77): this step's text,
      # memo and place among memo steps are the same in every job that builds the UI, so is its key
      # (W28-R70), and the first job to reach it builds it while the others wait and take it
      # (W28-R72). The PATH line is for a Mac's launchd service, whose PATH has no tools in it.
      - name: ui
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && npm ci --prefix ui --no-audit --no-fund && KILN_UI_SERVER=off npm run --prefix ui build
      # Where kiln's build finds the Shards it carries for the target it is cross-built as
      # (x86_64-pc-windows-gnu; crates/kiln/build.rs).
      - uses: kiln/download@v1
        with:
          name: shards-x86_64-pc-windows-msvc
          path: target/shards-carried/x86_64-pc-windows-gnu
      - name: build
        run: nice -n 10 ci/release/build.sh x86_64-pc-windows-msvc
    artifacts: ["dist/*"]

  macos:
    name: macOS (ARM64), on a Mac
    # Apple silicon only: kiln doesn't run on Intel Macs. Built with the Mac's own toolchain and
    # SDK, so on a Mac whose runner finds them: on one whose service's PATH lacks node (node from
    # nvm, kiln installed before it, as on the Mac Studios) `npm` isn't found and the build fails
    # at once (2026-10-24). Both engines route by `requires`. Its runners build kiln themselves
    # meanwhile, if this hasn't started (crate::fleet).
    runs-on: [baremetal, macos]
    requires: ["os == macos", "arch == aarch64", "tools has cargo", "tools has node"]
    timeout-minutes: 90
    steps:
      # One UI build per ui/ tree for ci, release and image (docs/ci.md W28-R77): this step's text,
      # memo and place among memo steps are the same in every job that builds the UI, so is its key
      # (W28-R70), and the first job to reach it builds it while the others wait and take it
      # (W28-R72). The PATH line is for a Mac's launchd service, whose PATH has no tools in it.
      - name: ui
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && npm ci --prefix ui --no-audit --no-fund && KILN_UI_SERVER=off npm run --prefix ui build
      - name: build
        run: nice -n 10 ci/release/build.sh aarch64-apple-darwin
    artifacts: ["dist/*"]
