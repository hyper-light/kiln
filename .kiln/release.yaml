# kiln ships itself: every push to main builds every platform's binary, all at once, each on a
# machine of its own platform where there is one (ci/release/build.sh): Linux and Windows on the
# server's own Linux machine, macOS natively on a Mac. Each job leaves its binaries as artifacts;
# the server keeps them (`[updates]`) as what each platform's runners upgrade to once it runs that
# commit, and serves them at /dl/kiln/<target>, so remote upgrades and `install.sh` /
# `install.ps1` work on Linux, macOS and Windows with nothing but this server. A server running a
# commit with no binaries yet builds it again itself (System → Builds: Build every platform),
# and a v* tag builds too. The build under way always finishes (W25): a newer push to the branch
# waits for it and replaces an older push still waiting, and a server's own build of its commit (a
# manual run) does the same among manual builds only, so pushes coming faster than a Mac builds
# can't keep the commit the server runs from ever having all its binaries. v1's
# `cancel-in-progress` is one boolean for the group, so tag builds queue the same way.
# ci/release/publish.sh still hands dist/ to another server by hand.
name: release
on:
  push: { branches: [main] }
  tag: { branches: ["v*"] }
  manual: true
concurrency: { group: "release-${{ event }}-${{ branch }}", cancel-in-progress: false }
jobs:
  linux:
    name: Linux (x86-64, ARM64)
    # A Linux machine with rustup, python3 and node: the server's own runner.
    runs-on: [baremetal, local]
    timeout-minutes: 90
    steps:
      - name: ui
        run: npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui build
      - name: build
        run: nice -n 10 ci/release/build.sh x86_64-unknown-linux-musl aarch64-unknown-linux-musl
    artifacts: ["dist/*"]

  windows:
    name: Windows (x86-64, cross-built)
    runs-on: [baremetal, local]
    timeout-minutes: 90
    steps:
      - name: ui
        run: npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui build
      - name: build
        run: nice -n 10 ci/release/build.sh x86_64-pc-windows-msvc
    artifacts: ["dist/*"]

  macos:
    name: macOS (ARM64), on a Mac
    # Apple silicon only: kiln doesn't run on Intel Macs. Built with the Mac's own toolchain and
    # SDK, so on a Mac whose runner finds them: on one whose service's PATH lacks node (node from
    # nvm, kiln installed before it, as on the Mac Studios) `npm` isn't found and the build fails
    # at once (2026-10-24). Both engines route by `requires`. Its runners build kiln themselves
    # meanwhile, if this hasn't started (crate::fleet).
    runs-on: [baremetal, macos]
    requires: ["os == macos", "arch == aarch64", "tools has cargo", "tools has node"]
    timeout-minutes: 90
    steps:
      # A launchd service's PATH has none of the usual tools in it.
      - name: ui
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui build
      - name: build
        run: nice -n 10 ci/release/build.sh aarch64-apple-darwin
    artifacts: ["dist/*"]
