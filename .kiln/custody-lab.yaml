# Custody's hand-overs that need more than a gate's build (crates/kiln/tests/transfers.rs and
# custody.rs; docs/ci.md W27-R08, W27-AC05): a blue/green upgrade's and the replant's (a release
# build: the upgrade downloads the server's own kiln, and a debug one is larger than kiln serves),
# and those with runners from before signed hand-overs and the two failures played again (a test
# build's faults). A gate runs the rest of both files; this runs all of them nightly.
name: custody-lab
on:
  schedule: ["41 3 * * *"]
  manual: true
jobs:
  custody:
    name: custody's hand-overs (release, faults)
    runs-on: [baremetal, linux]
    timeout-minutes: 60
    steps:
      - name: transfers.rs and custody.rs (release, chaos)
        run: cargo test --release --locked -p kiln --features chaos --test transfers --test custody -- --nocapture
