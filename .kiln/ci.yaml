# kiln builds itself: lint + test the server in a Kubernetes pod, build the UI in another,
# and run the transport benchmarks on real hardware.
name: ci
on:
  push: { branches: [main] }
  pull_request: {}
  manual: true
# One run per branch at a time, and it finishes: pushes come faster than a run ends on busy
# machines, and cancelling the one under way left nothing finished. The newest push waits for it
# (an older one waiting is dropped, as GitHub's single queue does).
concurrency:
  group: "kiln-${{ branch }}"
  cancel-in-progress: false
jobs:
  rust:
    name: rust lint + test
    runs-on: [k8s]
    toolchain: rust
    # Debian 13's: kiln's conflict replays pass --merge-base to git merge-tree, which git gained in
    # 2.40, and the preset's rust:1-bookworm carries git 2.39.5 (w26_ac04 and w26_r14 failed on it,
    # run #1661); trixie's is 2.47.
    image: docker.io/library/rust:1-trixie
    # Compiling kiln's own crate takes 7 GiB and more, and `cargo test` compiles it twice at once
    # (the library, and the library as its tests): 8Gi ran out, rustc killed. Cargo runs a rustc
    # per CPU the machine has, not per CPU asked for, unless told; line tables are the debug info
    # a test's backtrace needs, at far less memory. Its CPUs are what it asks for to be placed, not
    # a cap (the pod has no CPU limit): the jobs namespace's quota (18 CPUs, 36Gi, every
    # repository's jobs together) refuses a pod that asks more than is left, and it waits until
    # others' jobs end; it uses whatever's free once it runs. Built from scratch as here, every
    # library's tests at -j 4 peaked at 16.7 GiB of anonymous memory (2026-11-01): 16Gi had rustc
    # killed on every main commit from run #1522 on. Only production's 48 GiB node has room for
    # 24Gi, once each node's kubelet reserves what its container lacks (deploy/cluster/size-nodes.sh).
    resources: { cpu: "2", memory: 24Gi }
    env:
      CARGO_BUILD_JOBS: "4"
      RUST_TEST_THREADS: "4"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    # Clippy and the libraries' tests take about 8 minutes; every test binary took longer than the
    # 37 minutes left of 45 (run #1661, cancelled in observe_replay with 84 binaries done).
    timeout-minutes: 90
    steps:
      - name: toolchain
        run: rustup component add clippy && cargo --version
      - name: clippy (no-panic lint wall)
        run: cargo clippy --locked --all-targets -- -D warnings
      # Built apart, the libraries as their tests first, then the rest: kiln's crate compiled twice
      # at once (the library, and the library as its tests) ran out of 16Gi now and then.
      - name: build the libraries' tests
        run: cargo test --locked --lib --no-run
      # Every test binary, whatever fails before it: each failing test shows in one run.
      - name: test
        run: cargo test --locked --no-fail-fast

  ui:
    name: ui typecheck + lint + build
    runs-on: [k8s]
    toolchain: node
    resources: { cpu: "2", memory: 4Gi }
    steps:
      # One UI build per ui/ tree for ci, release and image (docs/ci.md W28-R77): this step's text,
      # memo and place among memo steps are the same in every job that builds the UI, so is its key
      # (W28-R70), and the first job to reach it builds it while the others wait and take it
      # (W28-R72). The PATH line is for a Mac's launchd service, whose PATH has no tools in it.
      - name: ui
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && npm ci --prefix ui --no-audit --no-fund && KILN_UI_SERVER=off npm run --prefix ui build
      # Each page's bytes on the wire held to its budget, from the build alone (goal 8, plan
      # 01a1a832ebfd step 2: ci/ui/page_budgets.json, docs/browser-lab.md "UI page loads").
      - name: page budgets
        run: node --test ci/ui/page_bytes.test.mjs && node ci/ui/page_bytes.mjs --dist ui/dist --check
      # A one-line change renames at most 2 hashed files, and what a visit after it downloads
      # again stays within each page's deploy budget (goal 8 step 4: names from content alone).
      - name: two builds
        run: ci/ui/two_builds.sh
      # Against the wire types made from Rust (ui/src/api/wire, held to the Rust by `wire::ts`). The
      # tests one file at a time (`test:ci`): each syntax samples' file compiles its grammars'
      # WebAssembly, up to 3.3 GiB, and side by side they outgrew this job's 4 GiB (2026-11-02).
      - run: npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui typecheck && npm run --prefix ui lint && npm run --prefix ui test:ci

  ui-checks:
    name: ui checks (Chromium and WebKit, desktop and phone)
    needs: [rust, ui]
    # Every page's check (docs/ci.md W21-AC01) against servers of this build, the browsers in
    # Playwright's image: on a Linux machine that runs Docker and builds kiln, as `requires` says
    # (both engines route by it). `linux` keeps it on Linux by its labels too: the Windows and
    # macOS runners are bare metal as well (c76ef82's checks went to jupiter, whose PowerShell
    # couldn't read them, before v1 read `requires`).
    runs-on: [baremetal, linux]
    requires: ["os == linux", "executors has docker", "tools has cargo", "tools has node", "tools has python3", "tools has git"]
    if: "branch == 'main'"
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: what it needs
        run: for t in docker python3 git node npm cargo; do command -v "$t" > /dev/null || { echo "this machine has no $t"; exit 1; }; done && docker info --format '{{.ServerVersion}}'
      # One UI build per ui/ tree for ci, release and image (docs/ci.md W28-R77): this step's text,
      # memo and place among memo steps are the same in every job that builds the UI, so is its key
      # (W28-R70), and the first job to reach it builds it while the others wait and take it
      # (W28-R72). The PATH line is for a Mac's launchd service, whose PATH has no tools in it.
      - name: ui
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && npm ci --prefix ui --no-audit --no-fund && KILN_UI_SERVER=off npm run --prefix ui build
      # The UI server this build carries, for this machine (vendor/bun/README.md).
      - run: node ui/scripts/pack-ui-server.mjs --require
      - run: cargo build --locked -p kiln --bin kiln
      - run: ci/ui/run-all.sh target/debug/kiln
    artifacts: [ci/ui/shots/*/*]

  locks:
    name: no new lock on the API's hot path
    # Goal 5 of the API runtime program (plan 01a1a59c2aae step 3): no Mutex, RwLock or Condvar in the
    # modules scripts/locks/hot.toml names but those it lists with why; the check's own tests plant one.
    runs-on: [k8s]
    toolchain: python
    resources: { cpu: "1", memory: 1Gi }
    timeout-minutes: 10
    steps:
      - name: the hot path's locks are those hot.toml lists
        run: python3 scripts/locks.py check
      - name: the check fails on a planted lock
        run: TMPDIR=$(mktemp -d -p "$PWD") python3 scripts/test_locks.py

  vendor:
    name: vendored projects (upstream plus kiln's recorded changes)
    runs-on: [k8s]
    toolchain: python
    resources: { cpu: "1", memory: 2Gi }
    timeout-minutes: 15
    steps:
      - name: git
        run: command -v git >/dev/null || { apt-get update && apt-get install -y --no-install-recommends git ca-certificates; }
      - name: the vendor tool's tests
        run: python3 scripts/test_vendor.py
      # Each git project fetched at its commit (one shallow fetch apiece). Bun's release is checked
      # against its sources by every re-vendor, and its hashes by every release build's pack, not
      # here: its image comes from Docker Hub, whose pulls are rate-limited (docs/vendoring.md).
      - name: every vendored git project is its upstream plus its recorded changes
        run: python3 scripts/vendor.py check --kind git

  release-binary:
    name: release build (bare metal)
    needs: [rust, ui]
    # Any open Linux machine that builds kiln and its UI (W25), placed by `requires`.
    runs-on: [baremetal]
    requires: ["os == linux", "tools has cargo", "tools has node"]
    if: "branch == 'main'"
    steps:
      # One UI build per ui/ tree for ci, release and image (docs/ci.md W28-R77): this step's text,
      # memo and place among memo steps are the same in every job that builds the UI, so is its key
      # (W28-R70), and the first job to reach it builds it while the others wait and take it
      # (W28-R72). The PATH line is for a Mac's launchd service, whose PATH has no tools in it.
      - name: ui
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && npm ci --prefix ui --no-audit --no-fund && KILN_UI_SERVER=off npm run --prefix ui build
      - run: node ui/scripts/pack-ui-server.mjs --require
      - run: cargo build --release --locked -p kiln
      - run: mkdir -p dist && cp target/release/kiln dist/kiln-$(uname -m)
    artifacts: [dist/*]
