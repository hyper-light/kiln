# kiln builds itself: lint + test the server in a Kubernetes pod, build the UI in another,
# and run the transport benchmarks on real hardware.
name: ci
on:
  push: { branches: [main] }
  pull_request: {}
  manual: true
concurrency:
  group: "kiln-${{ branch }}"
  cancel-in-progress: true
jobs:
  rust:
    name: rust lint + test
    runs-on: [k8s]
    toolchain: rust
    # Compiling kiln's own crate takes 7 GiB and more, and `cargo test` compiles it twice at once
    # (the library, and the library as its tests): 8Gi ran out, rustc killed. Cargo runs a rustc
    # per CPU the machine has, not per CPU asked for, unless told; line tables are the debug info
    # a test's backtrace needs, at far less memory.
    resources: { cpu: "4", memory: 16Gi }
    env:
      CARGO_BUILD_JOBS: "4"
      RUST_TEST_THREADS: "4"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    timeout-minutes: 45
    steps:
      - name: toolchain
        run: rustup component add clippy && cargo --version
      - name: clippy (no-panic lint wall)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  ui:
    name: ui typecheck + build
    runs-on: [k8s]
    toolchain: node
    resources: { cpu: "2", memory: 4Gi }
    steps:
      - run: npm ci --prefix ui --no-audit --no-fund
      - run: npm run --prefix ui typecheck
      # The UI only: packing Bun for the binary (vendor/bun) is the release builds' part.
      - run: KILN_UI_SERVER=off npm run --prefix ui build

  release-binary:
    name: release build (bare metal)
    needs: [rust, ui]
    # The server's own Linux machine (as release.yaml): other runners, a Mac among them, are bare
    # metal too.
    runs-on: [baremetal, local]
    if: "branch == 'main'"
    steps:
      - run: npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui build
      - run: cargo build --release --locked -p kiln
      - run: mkdir -p dist && cp target/release/kiln dist/kiln-$(uname -m)
    artifacts: [dist/*]
