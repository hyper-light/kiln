# kiln builds itself: lint + test the server on a bare-metal Linux runner, build the UI in a
# Kubernetes pod, and run the transport benchmarks on real hardware.
name: ci
on:
  push: { branches: [main] }
  pull_request: {}
  manual: true
# One run per branch at a time, and it finishes: pushes come faster than a run ends on busy
# machines, and cancelling the one under way left nothing finished. The newest push waits for it
# (an older one waiting is dropped, as GitHub's single queue does).
concurrency:
  group: "kiln-${{ branch }}"
  cancel-in-progress: false
jobs:
  rust:
    name: rust lint + test
    # On a bare-metal Linux runner, placed by kiln's load balancer: compiling kiln's library as its
    # tests (`cargo test --lib --no-run`, CARGO_BUILD_JOBS=4) peaked at 24.8 GiB resident in that
    # one rustc (26,673,692,672 bytes, cccc3ffc7, 2026-11-19), past the 24Gi a pod could ask here:
    # only production's 48 GiB node had room for that, within a jobs quota of 36Gi for every
    # repository, and rustc was killed (SIGKILL) on every main commit from run 3733 on. A runner
    # asks for what was measured, rounded up to the whole GiB; it says the step's peak, to ask next
    # time (AGENTS.md, "Sized"). kiln's conflict replays pass --merge-base to git merge-tree, which
    # git gained in 2.40 (w26_ac04 and w26_r14).
    runs-on: [baremetal]
    requires: ["os == linux", "tools has cargo", "tools has git"]
    resources: { cpu: "4", memory: 25Gi }
    env:
      CARGO_BUILD_JOBS: "4"
      RUST_TEST_THREADS: "4"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    # Clippy and the libraries' tests take about 8 minutes; every test binary took longer than the
    # 37 minutes left of 45 (run #1661, cancelled in observe_replay with 84 binaries done).
    timeout-minutes: 90
    steps:
      # A runner's service may start with none of the usual tools on its PATH (a launchd or systemd
      # unit's own), and git must be one that has merge-tree's --merge-base.
      - name: toolchain
        run: export PATH="$HOME/.cargo/bin:$PATH" && rustup component add clippy && cargo --version && git --version
      - name: clippy (no-panic lint wall)
        run: export PATH="$HOME/.cargo/bin:$PATH" && nice -n 10 cargo clippy --locked --all-targets -- -D warnings
      # Built apart, the libraries as their tests first, then the rest: kiln's crate compiled twice
      # at once (the library, and the library as its tests) ran out of 16Gi now and then.
      - name: build the libraries' tests
        run: export PATH="$HOME/.cargo/bin:$PATH" && nice -n 10 cargo test --locked --lib --no-run
      # Every test binary, whatever fails before it: each failing test shows in one run.
      - name: test
        run: export PATH="$HOME/.cargo/bin:$PATH" && nice -n 10 cargo test --locked --no-fail-fast

  replay-arm64:
    name: the scheduler's replay on arm64
    # docs/needs.md E1: the engine gives the same commands on every machine. The rust job runs the
    # replay (crates/kiln-ci/src/sched/replay.rs) on x86-64; this runs it on arm64, on whichever
    # machine of that architecture has cargo, against the same committed digest. A launchd
    # service's PATH has none of the usual tools in it.
    runs-on: [baremetal]
    requires: ["arch == aarch64", "tools has cargo"]
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - run: export PATH="$HOME/.cargo/bin:$PATH" && nice -n 10 cargo test --locked -p kiln-ci --lib sched::replay

  # Kiln goal 90, part 01a1ec34599974448569750ac79093b6: kiln builds the Slates it vendors (vendor/slates, at
  # vendor/MANIFEST.toml's commit) and tests its use of it on every platform it ships, natively. Each lane builds
  # kiln with it, then runs the tests that drive it through the library: workspace::slates* (kiln's side of the
  # consumer contract, its fleet, moves and faults), `vendored` (one revision of each vendored crate in Cargo.lock)
  # and `slates_roles` (kiln's own executable runs the instance's anchor and daemon; no Slates binary runs). The
  # rust job's whole suite covers Linux x86-64 too; this lane is the focused one every platform shares. GitHub's
  # ci.yml runs the same on GitHub's runners (its `slates` and `windows-slates` jobs); these run on kiln's own.
  # Windows x86-64's native lane is GitHub's windows-slates (WinFsp); Windows arm64 is checked by compile (below).
  # The host lanes ask 32Gi: kiln's library as its tests peaked at 24.8 GiB in one rustc, and the macOS lane asked
  # 26Gi was stopped in its tests (kiln ci run 01a1f9fb0653, 2026-11-20).
  slates-linux-x86_64:
    name: slates (Linux x86-64)
    runs-on: [baremetal]
    requires: ["os == linux", "arch == x86_64", "tools has cargo", "tools has git"]
    resources: { cpu: "4", memory: 32Gi }
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: build kiln with vendor/slates
        run: export PATH="$HOME/.cargo/bin:$PATH" && nice -n 10 cargo build --locked -p kiln --bin kiln
      - name: kiln's Slates tests
        run: export PATH="$HOME/.cargo/bin:$PATH" && nice -n 10 cargo test --locked -p kiln --lib workspace::slates && nice -n 10 cargo test --locked -p kiln --test vendored --test slates_roles

  slates-macos-arm64:
    name: slates (macOS arm64)
    runs-on: [baremetal, macos]
    requires: ["os == macos", "arch == aarch64", "tools has cargo", "tools has git"]
    resources: { cpu: "4", memory: 32Gi }
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: build kiln with vendor/slates
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && nice -n 10 cargo build --locked -p kiln --bin kiln
      - name: kiln's Slates tests
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && nice -n 10 cargo test --locked -p kiln --lib workspace::slates && nice -n 10 cargo test --locked -p kiln --test vendored --test slates_roles

  # Linux on arm64, natively: kiln has no Linux arm64 machine, so the lane runs in a linux/arm64 container on an
  # Apple-silicon runner's Docker (an arm64 Linux kernel in its VM, no emulation; 31-62 GiB there, 2026-11-20). The
  # target directory stays inside the container: the leg's folder is bind-mounted, and root's files left in it would
  # outlive the leg.
  slates-linux-arm64:
    name: slates (Linux arm64)
    runs-on: [baremetal, macos]
    requires: ["os == macos", "arch == aarch64", "executors has docker"]
    resources: { cpu: "4", memory: 26Gi }
    timeout-minutes: 150
    steps:
      - name: build kiln with vendor/slates, and kiln's Slates tests, in linux/arm64
        run: |
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          # A pull that hangs fails the leg in minutes, not at its timeout (one hung at "Unable to find image",
          # kiln ci run 01a1f9fb0653), so it runs again elsewhere.
          perl -e 'alarm 600; exec @ARGV' docker pull -q --platform linux/arm64 docker.io/library/rust:1-bookworm
          docker run --rm --platform linux/arm64 -v "$PWD:/src" -w /src \
            -e CARGO_TARGET_DIR=/target -e CARGO_BUILD_JOBS=4 -e CARGO_INCREMENTAL=0 \
            -e CARGO_PROFILE_DEV_DEBUG=line-tables-only -e CARGO_TERM_COLOR=never \
            docker.io/library/rust:1-bookworm bash -euc '
              uname -sm
              git config --global --add safe.directory /src
              cargo build --locked -p kiln --bin kiln
              cargo test --locked -p kiln --lib workspace::slates
              cargo test --locked -p kiln --test vendored --test slates_roles'

  # Windows on arm64, by compile: kiln has no arm64 Windows machine of its own (GitHub's ci.yml runs it natively on
  # windows-11-arm, its `slates` job). As Slates' own cross-lint lane checks aarch64-pc-windows-msvc (its ci.yml
  # `cross-lint`), this checks the vendored Slates crates that build without a C toolchain for the target, at kiln's
  # lock, from Linux; the crates that reach aws-lc-sys or zstd need clang-cl and Windows' SDK, which only a native
  # lane has. The target is added inside a throwaway container, so the runner's own toolchain is left as it is.
  slates-windows-arm64-cross:
    name: slates (Windows arm64, cross check)
    runs-on: [baremetal, macos]
    requires: ["os == macos", "arch == aarch64", "executors has docker"]
    resources: { cpu: "2", memory: 8Gi }
    timeout-minutes: 60
    steps:
      - name: cargo check --target aarch64-pc-windows-msvc, the C-free vendored Slates crates
        run: |
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          perl -e 'alarm 600; exec @ARGV' docker pull -q --platform linux/arm64 docker.io/library/rust:1-bookworm
          docker run --rm --platform linux/arm64 -v "$PWD:/src:ro" -w /src \
            -e CARGO_TARGET_DIR=/target -e CARGO_BUILD_JOBS=2 -e CARGO_TERM_COLOR=never \
            docker.io/library/rust:1-bookworm bash -euc '
              rustup target add aarch64-pc-windows-msvc
              cargo check --locked --target aarch64-pc-windows-msvc \
                -p slates-wire -p slates-mem -p slates-rt -p slates-ipc -p slates-merge -p slates-db -p slates-wire-derive'

  ui:
    name: ui typecheck + lint + build
    runs-on: [k8s]
    toolchain: node
    resources: { cpu: "2", memory: 4Gi }
    steps:
      # One UI build per ui/ tree for ci, release and image (docs/ci.md W28-R77): this step's text,
      # memo and place among memo steps are the same in every job that builds the UI, so is its key
      # (W28-R70), and the first job to reach it builds it while the others wait and take it
      # (W28-R72). The PATH line is for a Mac's launchd service, whose PATH has no tools in it.
      - name: ui
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && npm ci --prefix ui --no-audit --no-fund && KILN_UI_SERVER=off npm run --prefix ui build
      # Each page's bytes on the wire held to its budget, from the build alone (goal 8, plan
      # 01a1a832ebfd step 2: ci/ui/page_budgets.json, docs/browser-lab.md "UI page loads").
      - name: page budgets
        run: node --test ci/ui/page_bytes.test.mjs && node ci/ui/page_bytes.mjs --dist ui/dist --check
      # A one-line change renames at most 2 hashed files, and what a visit after it downloads
      # again stays within each page's deploy budget (goal 8 step 4: names from content alone).
      - name: two builds
        run: ci/ui/two_builds.sh
      # Against the wire types made from Rust (ui/src/api/wire, held to the Rust by `wire::ts`). The
      # tests one file at a time (`test:ci`): each syntax samples' file compiles its grammars'
      # WebAssembly, up to 3.3 GiB, and side by side they outgrew this job's 4 GiB (2026-11-02).
      - run: npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui typecheck && npm run --prefix ui lint && npm run --prefix ui test:ci

  ui-checks:
    name: ui checks (Chromium and WebKit, desktop and phone)
    needs: [rust, ui]
    # Every page's check (docs/ci.md W21-AC01) against servers of this build, the browsers in
    # Playwright's image: on a Linux machine that runs Docker and builds kiln, as `requires` says
    # (both engines route by it). `linux` keeps it on Linux by its labels too: the Windows and
    # macOS runners are bare metal as well (c76ef82's checks went to jupiter, whose PowerShell
    # couldn't read them, before v1 read `requires`).
    runs-on: [baremetal, linux]
    requires: ["os == linux", "executors has docker", "tools has cargo", "tools has node", "tools has python3", "tools has git"]
    if: "branch == 'main'"
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: what it needs
        run: for t in docker python3 git node npm cargo; do command -v "$t" > /dev/null || { echo "this machine has no $t"; exit 1; }; done && docker info --format '{{.ServerVersion}}'
      # One UI build per ui/ tree for ci, release and image (docs/ci.md W28-R77): this step's text,
      # memo and place among memo steps are the same in every job that builds the UI, so is its key
      # (W28-R70), and the first job to reach it builds it while the others wait and take it
      # (W28-R72). The PATH line is for a Mac's launchd service, whose PATH has no tools in it.
      - name: ui
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && npm ci --prefix ui --no-audit --no-fund && KILN_UI_SERVER=off npm run --prefix ui build
      # The UI server this build carries, for this machine (vendor/bun/README.md).
      - run: node ui/scripts/pack-ui-server.mjs --require
      - run: cargo build --locked -p kiln --bin kiln
      - run: ci/ui/run-all.sh target/debug/kiln
    artifacts: [ci/ui/shots/*/*]

  locks:
    name: no new lock on the API's hot path
    # Goal 5 of the API runtime program (plan 01a1a59c2aae step 3): no Mutex, RwLock or Condvar in the
    # modules scripts/locks/hot.toml names but those it lists with why; the check's own tests plant one.
    runs-on: [k8s]
    toolchain: python
    resources: { cpu: "1", memory: 1Gi }
    timeout-minutes: 10
    steps:
      - name: the hot path's locks are those hot.toml lists
        run: python3 scripts/locks.py check
      - name: the check fails on a planted lock
        run: TMPDIR=$(mktemp -d -p "$PWD") python3 scripts/test_locks.py

  vendor:
    name: vendored projects (upstream plus kiln's recorded changes)
    runs-on: [k8s]
    toolchain: python
    resources: { cpu: "1", memory: 2Gi }
    timeout-minutes: 15
    steps:
      - name: git
        run: command -v git >/dev/null || { apt-get update && apt-get install -y --no-install-recommends git ca-certificates; }
      - name: the vendor tool's tests
        run: python3 scripts/test_vendor.py
      # Each git project fetched at its commit (one shallow fetch apiece). Bun's release is checked
      # against its sources by every re-vendor, and its hashes by every release build's pack, not
      # here: its image comes from Docker Hub, whose pulls are rate-limited (docs/vendoring.md).
      - name: every vendored git project is its upstream plus its recorded changes
        run: python3 scripts/vendor.py check --kind git

  release-binary:
    name: release build (bare metal)
    needs: [rust, ui]
    # Any open Linux machine that builds kiln and its UI (W25), placed by `requires`.
    runs-on: [baremetal]
    requires: ["os == linux", "tools has cargo", "tools has node"]
    if: "branch == 'main'"
    steps:
      # One UI build per ui/ tree for ci, release and image (docs/ci.md W28-R77): this step's text,
      # memo and place among memo steps are the same in every job that builds the UI, so is its key
      # (W28-R70), and the first job to reach it builds it while the others wait and take it
      # (W28-R72). The PATH line is for a Mac's launchd service, whose PATH has no tools in it.
      - name: ui
        run: export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" && npm ci --prefix ui --no-audit --no-fund && KILN_UI_SERVER=off npm run --prefix ui build
      - run: node ui/scripts/pack-ui-server.mjs --require
      - run: cargo build --release --locked -p kiln
      - run: mkdir -p dist && cp target/release/kiln dist/kiln-$(uname -m)
    artifacts: [dist/*]
